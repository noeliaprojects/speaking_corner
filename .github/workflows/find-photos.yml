name: Find photos
on:
  push:
    paths:
      - '.github/workflows/find-photos.yml'
      - 'src/photo_queries.json'
  workflow_dispatch:
    inputs:
      max_images:
        description: "How many photos to look for in this run"
        default: "60"
      only:
        description: "Only this activity (e.g. guess-the-job). Leave empty for all."
        default: ""
      redo:
        description: "Replace these photos (comma-separated names, e.g. how-often-03,mood-menu-02)"
        default: ""
permissions:
  contents: write
concurrency:
  group: photos
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/find_photos.py --max "${{ inputs.max_images || '100' }}" --only "${{ inputs.only || '' }}" --redo "${{ inputs.redo || '' }}"
      - name: Save the new photos
        run: |
          git config user.name "Speaking Corner bot"
          git config user.email "actions@users.noreply.github.com"
          git add img src/credits.json
          git diff --cached --quiet && exit 0
          git commit -m "Add photos from open-licence sources"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
