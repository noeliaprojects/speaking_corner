name: Generate photos
on:
  push:
    paths:
      - '.github/workflows/photos.yml'
  workflow_dispatch:
    inputs:
      max_images:
        description: "How many photos to make in this run"
        default: "20"
      quality:
        description: "low (cheapest), medium or high"
        default: "medium"
      only:
        description: "Only this activity (e.g. guess-the-job). Leave empty for all."
        default: ""
permissions:
  contents: write
concurrency:
  group: photos
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate missing photos
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/generate_photos.py --max "${{ inputs.max_images || '100' }}" --quality "${{ inputs.quality || 'medium' }}" --only "${{ inputs.only || '' }}"
      - run: python3 build.py
      - name: Save the new photos
        run: |
          git config user.name "Speaking Corner bot"
          git config user.email "actions@users.noreply.github.com"
          git add img index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add generated photos"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && exit 0
              sleep 5
            done
            exit 1
          fi
