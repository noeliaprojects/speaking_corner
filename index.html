<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaking Corner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: quiet hub (search, filters, plain activity cards grouped by type); each activity opens a white, projector-ready slide with teacher tools underneath. One accent colour, one typeface. */
:root{
  --bg:#f7f7f4; --paper:#ffffff; --ink:#1f2427; --muted:#6b7176; --line:#e5e5e0;
  --stamp:#2a6b61; --stamp-soft:#e7f0ed; --ok:#2a6b61; --ok-soft:#e7f0ed; --warn:#8a5a12; --warn-soft:#f6eedf;
  --c-warm:#2a6b61; --c-you:#2a6b61; --c-opinion:#2a6b61; --c-game:#2a6b61;
  --stage:#ffffff; --stage-2:#f4f4f1; --stage-ink:#1f2427; --stage-muted:#6b7176;
  --display:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.narrow{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4.5vw,2.1rem);margin:0;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
h1 span{color:var(--stamp)}
h2{font-size:1.2rem;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:1.08rem;margin:0}
p{margin:0;max-width:65ch}
.sub{color:var(--muted)}
.label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,4vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:.85rem;color:var(--muted)}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button.primary,.btn.primary{background:var(--ink);color:var(--paper)}
button.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
button.ghost,.btn.ghost{border-color:var(--line);font-weight:600;background:var(--paper)}
button.ghost:hover,.btn.ghost:hover{border-color:var(--muted)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
textarea,select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:120px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 170px}
a{color:inherit}
.back{align-self:flex-start;text-decoration:none;font-weight:600;color:var(--muted)}
.back:hover{color:var(--ink)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top nav{display:flex;gap:8px;flex-wrap:wrap}
.classpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.classpick select{width:auto;min-width:0;max-width:100%;padding:7px 10px;font-weight:700}
.filters{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips{align-items:center}
.chips button{padding:5px 12px;border-width:1px;border-color:var(--line);font-weight:500;border-radius:99px;font-size:.92rem}
.grsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grsel select{width:auto;max-width:100%;background:var(--paper);padding:7px 12px;border-radius:99px;font-weight:500}
.focus{background:var(--stamp-soft);border-radius:8px;padding:10px 12px;font-size:.95rem}
.chips-l{font-size:.85rem;color:var(--muted);margin-right:4px}
.search input{background:var(--paper);padding:12px 14px;font-size:1rem;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gram{display:flex;gap:6px;flex-wrap:wrap}
.gram span{font-size:.75rem;font-weight:600;color:var(--stamp);background:var(--stamp-soft);border-radius:99px;padding:2px 9px}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.top nav{align-items:center}
.top .classpick{padding:4px 4px 4px 12px;border-radius:8px}

/* activity cards */
.cat{display:flex;flex-direction:column;gap:12px}
.cat-h{display:flex;align-items:baseline;gap:10px}
.cat-h i{display:none}
.cat-h h2{font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.act{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;min-width:0;transition:border-color .15s,box-shadow .15s}
.act:hover{border-color:#cfcfc8;box-shadow:0 2px 10px rgba(30,36,40,.06)}
.act h3{font-weight:700;letter-spacing:-.01em}
.act h3{padding-right:4px}
.act p{font-size:.93rem;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.lvl{font-size:.75rem;font-weight:600;padding:1px 0;color:var(--ink)}
.fmt{font-size:.75rem;font-weight:500;color:var(--muted)}
.flag{font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:99px}
.flag.print{background:var(--warn-soft);color:var(--warn)}
.flag.done{background:var(--ok-soft);color:var(--ok)}
.flag.app{background:var(--stamp-soft);color:var(--stamp)}
.c-warm{--cc:var(--c-warm)}.c-you{--cc:var(--c-you)}.c-opinion{--cc:var(--c-opinion)}.c-game{--cc:var(--c-game)}
.empty{color:var(--muted);padding:20px;text-align:center}

/* banners */
.banner{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:700}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.print{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}

/* stage (deliberately one dark look in both themes: it is projected) */
.stage{position:relative;background:var(--stage);border:1px solid var(--line);box-shadow:0 1px 3px rgba(30,36,40,.05);color:var(--stage-ink);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  padding:clamp(18px,4.5vw,52px);min-height:min(66vh,560px);gap:18px;--acc:#2a6b61;--tint:#f4f4f1}
@media (min-width:760px){.stage{aspect-ratio:16/9;min-height:0}}

.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;padding:max(4vh,24px) max(5vw,24px)}
.s-eyebrow{font-size:clamp(.7rem,1.3vw,.9rem);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--stage-muted);display:flex;justify-content:space-between;gap:10px}
.s-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.4vw,26px);min-height:0}
.s-title{font-family:var(--display);font-weight:800;letter-spacing:-.025em;font-size:clamp(1.8rem,5vw,3.6rem);line-height:1.05;text-wrap:balance;margin:0}
.s-instr{font-size:clamp(1.05rem,2.3vw,1.7rem);line-height:1.35;max-width:46ch;color:var(--stage-ink)}
.s-ex{font-size:clamp(.95rem,1.8vw,1.3rem);color:var(--stage-muted);border-left:4px solid var(--acc);padding-left:14px;max-width:60ch}
.s-big{font-size:clamp(1.8rem,5.4vw,4.2rem);font-weight:700;letter-spacing:-.02em;line-height:1.1;text-wrap:balance;margin:0}
.s-big.mid{font-size:clamp(1.5rem,4.2vw,3.2rem)}
.s-q{margin:0;padding-left:1.1em;font-size:clamp(1rem,2vw,1.5rem);display:flex;flex-direction:column;gap:4px;color:var(--stage-ink)}
.s-q li::marker{color:var(--acc)}
.s-ph{display:flex;flex-wrap:wrap;gap:8px}
.s-ph span{background:var(--stage-2);border:0;border-radius:99px;padding:6px 14px;font-size:clamp(.8rem,1.5vw,1.1rem);font-weight:500;color:var(--stage-ink)}
.s-ph b{color:var(--stage-muted);font-weight:600;font-size:.8em;letter-spacing:.06em;text-transform:uppercase;align-self:center;margin-right:4px}
.s-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(10px,2vw,24px);align-items:stretch}
.s-opt{background:var(--tint);border-radius:14px;padding:clamp(14px,2.5vw,28px);display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0}
.s-opt small{font-size:clamp(.7rem,1.3vw,.95rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.s-opt div{font-size:clamp(1.2rem,3.3vw,2.5rem);font-weight:700;line-height:1.15;text-wrap:balance}
.s-opt img,.s-img img{width:100%;height:auto;max-height:52vh;object-fit:cover;border-radius:10px;max-width:100%}
.s-opt.ph{position:relative;padding:0;overflow:hidden;justify-content:flex-end}
.s-opt.ph img{position:absolute;inset:0;width:100%;height:100%;max-height:none;border-radius:0;object-fit:cover}
.s-opt.ph .cap{position:relative;padding:clamp(40px,6vw,80px) clamp(12px,2vw,22px) clamp(10px,1.6vw,18px);background:linear-gradient(to top,rgba(10,14,30,.82),rgba(10,14,30,0));display:flex;flex-direction:column;gap:4px}
.s-opt.ph .cap small{color:#fff;opacity:.85}
.s-opt.ph .cap div{color:#fff;font-size:clamp(1.05rem,2.6vw,2rem)}
.s-vs.ph{flex:1 1 0;min-height:200px}
.s-or{align-self:center;font-weight:700;color:var(--stage-muted);font-size:clamp(1rem,2.4vw,1.8rem)}
.s-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.4vw,14px)}
.s-tiles div{background:var(--tint);border-radius:12px;padding:clamp(10px,1.8vw,20px);font-size:clamp(.9rem,2vw,1.45rem);font-weight:600;line-height:1.2;display:flex;align-items:center;min-height:clamp(56px,9vw,110px)}
.s-tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.s-tiles div.ptile{position:relative;padding:0;overflow:hidden;align-items:flex-end;min-height:clamp(110px,15vw,220px)}
.s-tiles div.ptile.sm{min-height:clamp(70px,8vw,110px)}
.ptile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ptile span{position:relative;width:100%;padding:clamp(22px,3vw,40px) clamp(8px,1.2vw,14px) clamp(6px,1vw,12px);background:linear-gradient(to top,rgba(10,14,30,.85),rgba(10,14,30,0));color:#fff}
.s-tiles.five div.ptile span{font-size:clamp(.7rem,1.3vw,1rem)}
.s-tiles.n2 div,.s-tiles.n3 div{font-size:clamp(1.1rem,2.8vw,2.1rem);min-height:clamp(90px,16vw,220px)}
.s-tiles.n4 div{font-size:clamp(1rem,2.4vw,1.8rem);min-height:clamp(70px,11vw,150px)}
.s-tiles.five div{font-size:clamp(.78rem,1.6vw,1.15rem);min-height:clamp(48px,7vw,90px)}
.s-stat{font-size:clamp(1.4rem,4.2vw,3.2rem);font-weight:700;line-height:1.12;text-wrap:balance;margin:0}
.s-tag{align-self:flex-start;font-size:clamp(.72rem,1.3vw,.95rem);font-weight:600;color:var(--acc);background:var(--stamp-soft);border-radius:99px;padding:4px 12px}
.s-split{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(14px,3vw,36px);align-items:center}
.s-no{display:flex;flex-direction:column;gap:6px}
.s-no span{font-size:clamp(1rem,2.4vw,1.8rem);font-weight:800;color:var(--stage-muted);text-decoration:line-through;text-decoration-color:var(--acc);text-decoration-thickness:3px}
.s-cover{position:absolute;inset:0;background:var(--stage);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:2}
.s-cover .s-title{color:var(--acc)}
.s-overlay{position:absolute;top:clamp(10px,2vw,20px);right:clamp(10px,2vw,20px);display:flex;gap:8px;z-index:3}
.s-pill{background:var(--stage-2);color:var(--stage-ink);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-family:var(--mono);font-weight:700;font-size:clamp(1rem,2.2vw,1.6rem);font-variant-numeric:tabular-nums}
.s-pill.low{background:#c9381f;color:#fff;border-color:#c9381f}
.s-pick{position:absolute;left:50%;bottom:clamp(14px,3vw,28px);transform:translateX(-50%);background:var(--acc);color:#fff;box-shadow:0 6px 20px rgba(27,35,64,.2);border-radius:14px;padding:10px 22px;font-weight:700;font-size:clamp(1.2rem,3vw,2.2rem);z-index:3;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.s-up{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#fff;color:#c9381f;font-family:var(--display);font-size:clamp(2rem,8vw,6rem);text-align:center;animation:flash .5s ease-in-out 4 alternate}
@keyframes flash{from{color:#c9381f}to{color:#f4c7bd}}
@media (prefers-reduced-motion:reduce){.s-up{animation:none}}
.s-nav{position:absolute;bottom:14px;right:14px;display:none;gap:8px;z-index:4}
.stage:fullscreen .s-nav{display:flex}
.s-nav button{background:var(--stage-2);color:var(--stage-ink);border:1px solid var(--line);padding:10px 16px;opacity:.7}
.s-nav button:hover{opacity:1}
@media (max-width:640px){.s-vs{grid-template-columns:1fr}.s-or{justify-self:center}.s-tiles,.s-tiles.five{grid-template-columns:repeat(2,minmax(0,1fr))!important}.s-split{grid-template-columns:1fr}}

/* controls under stage */
.ctrl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ctrl .count{font-family:var(--mono);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button,.tools select{padding:8px 12px;font-size:.92rem}
.tools select{width:auto;border-width:2px;border-color:var(--line);font-weight:700}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:7px 12px;border-width:1px;border-color:var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.guide p{font-size:1rem}
.guide ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

/* games (interactive) */
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.rules b{color:var(--ink)}
.chip{display:inline-block;font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--stamp-soft);color:var(--stamp)}
.envelope{border:2px dashed var(--line);border-radius:14px;min-height:170px;display:grid;place-items:center;text-align:center;padding:20px;user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:none}
.envelope .closed{display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted)}
.stamp{font-family:var(--display);font-weight:800;color:var(--stamp);border:3px solid var(--stamp);padding:6px 14px;border-radius:6px;transform:rotate(-6deg);font-size:1rem;letter-spacing:.05em;display:inline-block}
.word{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,8vw,3rem);color:var(--stamp);word-break:break-word}
.topic{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;line-height:1.2;text-wrap:balance}
.timer{font-family:var(--mono);font-weight:700;font-size:clamp(3rem,14vw,5.5rem);font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.timer.low{color:var(--stamp)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s linear}
.scores{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.scores li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.scores li.lead{background:var(--stamp-soft);font-weight:800}
.scores .pts{font-family:var(--mono);font-weight:700}
.reveal{background:var(--ok-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{padding:8px 12px;border-width:1px;font-weight:600}
.pick button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.bank{display:flex;flex-direction:column;gap:12px;margin-top:12px}
details.more summary{cursor:pointer;font-weight:800}
.stg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cell{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 6px;min-height:76px;font-weight:800;font-size:clamp(.72rem,2.6vw,.95rem);line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;word-break:break-word}
.cell:hover:not(:disabled){border-color:var(--ink)}
.cell.done{background:var(--pc);border-color:var(--pb);opacity:1;cursor:default}
.cell.used{opacity:.45}
.cell small{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--pb,var(--ok))}
.prompts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:1.05rem}
.turn{display:flex;align-items:center;gap:8px;font-weight:800}
.dot{width:14px;height:14px;border-radius:50%;background:var(--pb);flex:none}
.p0{--pb:#d8432f;--pc:#fbe3df}.p1{--pb:#1f7fb8;--pc:#dcedf8}.p2{--pb:#2f8a5b;--pc:#dff2e7}.p3{--pb:#7a4fd0;--pc:#ece4fb}.p4{--pb:#c27a0e;--pc:#fbeed6}.p5{--pb:#b0306f;--pc:#f8dfeb}.p6{--pb:#0f8a8a;--pc:#d8f1f0}.p7{--pb:#5b6478;--pc:#e3e6ee}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1;padding:9px 12px;font-weight:700;background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.clist li{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--bg)}
.clist li>div:first-child{display:flex;flex-direction:column;min-width:0}
.clist button{padding:7px 12px}
.clist button.warn{background:var(--stamp);border-color:var(--stamp);color:#fff}
.prompt{background:var(--bg);border-radius:10px;padding:12px;font-family:var(--mono);font-size:.82rem;white-space:pre-wrap;word-break:break-word}
@media (max-width:420px){.stg{gap:6px}.cell{min-height:68px;padding:8px 4px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<script>

hree things you both used to do."], "grp": ["Show the topic. Volunteers play the grandparent for one minute.", "The class reacts and asks questions.", "Finish with a real 'When I was a child…' round."]}, "end": "What do you think people in 2080 will find funny about us?"}, {"id": "fortune-teller", "name": "Fortune Teller", "cat": "game", "lv": ["A2", "B1", "B2"], "fmts": ["pair", "grp"], "kind": "single", "gram": ["Future forms"], "focus": "will / going to / might for predictions: You will…, You're going to…, You might…", "desc": "Read your partner's future. Make the predictions as dramatic as possible!", "instr": "You're a fortune teller. Look into the crystal ball and predict your partner's future about this topic. Your partner reacts!", "ph": ["I can see that you will…", "You're going to… very soon.", "You might… but be careful!", "You won't… until…"], "cards": ["Love", "Money", "Travel", "Your next job", "This weekend", "Your next birthday", "A big surprise", "Your future house", "A new friend", "Your health", "Your next holiday", "Something you'll lose"], "guide": {"ind": ["You're the fortune teller first, then the student.", "Push for three predictions per topic.", "Point out 'going to' when there's evidence: 'Look at the clouds! It's going to rain.'"], "pair": ["Partners take turns being the fortune teller.", "The 'client' must react: 'Really? When will that happen?'", "At the end, each says which prediction they hope comes true."], "grp": ["Choose a fortune teller and a client to come to the front.", "The class can add 'extra visions'.", "Rotate every topic."]}, "end": "Which prediction do you hope will come true?"}, {"id": "sorry-ill-be-busy", "name": "Sorry, I'll Be Busy", "cat": "game", "lv": ["B1", "B2"], "fmts": ["pair", "grp"], "kind": "single", "gram": ["Future continuous", "Future forms"], "focus": "Future continuous for actions in progress in the future: I'll be …ing at 6.", "desc": "Someone keeps inviting you to boring things. Invent creative reasons why you'll be busy.", "instr": "Your partner invites you to this. You don't want to go! Say what you'll be doing at that time. Be creative. Your partner suggests another time…", "ph": ["Sorry, at that time I'll be…ing.", "I'd love to, but I'll be…ing all day.", "What about…? / How about…?", "No, I'll be…ing then too!"], "cards": ["Can you help me move house on Saturday at 9 am?", "Do you want to come to my cousin's poetry reading tonight?", "Can you look after my five cats this weekend?", "Shall we go running at 6 am tomorrow?", "Come to my 3-hour presentation about stamps!", "Can you help me paint my fence on Sunday?", "Do you want to watch all 8 Harry Potter films tomorrow?", "Can you drive me to the airport at 4 am?", "Want to help me clean the garage next Saturday?", "Can you come to my karaoke practice tonight?"], "guide": {"ind": ["You invite; the student refuses with 'I'll be…ing'. Keep suggesting new times.", "Swap roles.", "Contrast: 'I'll be working at 6' vs 'I'll work tomorrow'."], "pair": ["Partner A invites and suggests three different times.", "Partner B must refuse each time with a new excuse.", "Swap after each card."], "grp": ["One student invites the class; volunteers refuse with creative excuses.", "The class votes for the most creative excuse.", "Rotate the 'inviter'."]}, "end": "What will you be doing this time tomorrow?"}, {"id": "by-2050", "name": "By the Year 2050", "cat": "opinion", "lv": ["B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Future perfect", "Future continuous"], "focus": "Future perfect: By 2050, we will have…; Future continuous: People will be …ing.", "desc": "Predict what will have changed by a certain point in the future.", "instr": "Make predictions. What will have happened by then? What will people be doing? Agree or disagree with each other.", "ph": ["By then, we will have…", "I don't think we'll have… by…", "People will be…ing", "By the time I'm…, I'll have…"], "cards": ["By 2050… transport", "By 2050… schools", "By 2050… food", "By 2050… holidays", "By 2050… languages", "By 2050… jobs", "By the end of this year, I…", "By the time I'm 40, I…", "By the end of this course, we…", "By next summer, I…", "By 2100… the planet", "By 2050… phones"], "guide": {"ind": ["The student makes three predictions; you agree or disagree.", "Do the personal cards (By the time I'm 40…) slowly and ask why.", "Point out 'by' + future perfect."], "pair": ["Partners make predictions and rate each other's: likely, possible or impossible.", "Find one prediction you both agree on.", "Share it with the class."], "grp": ["Show the card. Groups write three predictions in two minutes.", "Groups read them; the class votes for the most likely.", "Write the best ones on the board as a 'time capsule'."]}, "end": "Write one prediction for yourself to read in 10 years."}, {"id": "agony-aunt", "name": "Dear Agony Aunt", "cat": "opinion", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Modals: advice & obligation"], "focus": "Advice: You should…, You ought to…, You'd better…, If I were you, I'd…", "desc": "Give advice to people with funny or tricky problems.", "instr": "This person has written to the advice column. Give them at least three pieces of advice. What shouldn't they do?", "ph": ["You should…", "You shouldn't…", "If I were you, I'd…", "You'd better… / Why don't you…?"], "cards": ["My flatmate eats all my food.", "I've accidentally liked my ex's photo from 5 years ago.", "My best friend sings terribly but wants to go on a talent show.", "I can't stop checking my phone.", "My boss always calls me on Sundays.", "My dog hates my new partner.", "I've said yes to two parties on the same night.", "My neighbour practises the drums at midnight.", "I want to learn English but I have no time.", "I told everyone I can cook… and now I have to cook for 10 people.", "My parents want to join my group chat.", "I'm scared of flying but I've won a free trip to Japan."], "guide": {"ind": ["The student gives three pieces of advice; you choose the best and ask why.", "Then the student writes you a problem.", "Practise softening: 'Maybe you could…'"], "pair": ["Partner A reads the problem as if it's theirs; B gives advice.", "A chooses the best advice.", "Swap."], "grp": ["Show the problem. Students have one minute to write their best advice.", "Read a few aloud; the class votes.", "Highlight should / ought to / had better on the board."]}, "end": "What's the best advice anyone has ever given you?"}, {"id": "alien-rulebook", "name": "The Alien Rulebook", "cat": "game", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Modals: advice & obligation"], "focus": "Rules: You have to…, You must…, You mustn't…, You don't have to…, You can…", "desc": "An alien is coming to live in your town. Teach it the rules nobody explains.", "instr": "An alien has just arrived and wants to fit in. Explain the rules for this place: what you have to do, what you mustn't do and what you don't have to do.", "ph": ["You have to…", "You mustn't…", "You don't have to…, but…", "You're allowed to… / You can…"], "cards": ["At a Spanish family dinner", "On the metro", "In a lift", "At a wedding", "At the beach", "At school", "In a WhatsApp group", "At the cinema", "At the gym", "At a job interview", "At a birthday party", "In a library"], "guide": {"ind": ["The student explains the rules; you're the confused alien and ask 'Why?'", "Ask for one rule that's different in another country.", "Contrast mustn't vs don't have to."], "pair": ["One partner is the alien and asks questions; the other explains.", "Swap every card.", "Find a rule that you think is silly."], "grp": ["Show the place. The class gives rules; you write them in three columns (have to / mustn't / don't have to).", "Ask: which rule is the most important?", "Vote on the silliest rule."]}, "end": "Which rule would the alien find the strangest?"}, {"id": "whose-bag", "name": "Whose Bag Is This?", "cat": "game", "lv": ["B1", "B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Modals of deduction"], "focus": "Deduction: It must be…, It might/could be…, It can't be…", "desc": "Look at what's inside a lost bag and work out who it belongs to.", "instr": "This bag was found on a train. Look at what's inside. Who does it belong to? What do they do? Use must, might and can't.", "ph": ["It must belong to…", "It might be… / It could be…", "It can't be… because…", "He/She probably…"], "cards": [{"t": "Lost bag #1", "sub": ["a whistle", "a stopwatch", "energy bars", "a list of names"]}, {"t": "Lost bag #2", "sub": ["dog biscuits", "a ball", "a lead", "a map of the park"]}, {"t": "Lost bag #3", "sub": ["a passport", "a phrase book", "sun cream", "a camera"]}, {"t": "Lost bag #4", "sub": ["red pens", "30 exam papers", "a coffee flask", "headache tablets"]}, {"t": "Lost bag #5", "sub": ["a baby bottle", "nappies", "a toy giraffe", "an energy drink"]}, {"t": "Lost bag #6", "sub": ["a wedding invitation", "a tie", "a speech", "tissues"]}, {"t": "Lost bag #7", "sub": ["a stethoscope", "chewing gum", "a phone charger", "a novel"]}, {"t": "Lost bag #8", "sub": ["paint brushes", "a sketchbook", "a croissant", "a train ticket to Paris"]}, {"t": "Lost bag #9", "sub": ["a ring box", "flowers", "a restaurant booking", "a very nervous note"]}, {"t": "Lost bag #10", "sub": ["a microphone", "a setlist", "earplugs", "a guitar pick"]}], "guide": {"ind": ["The student makes at least three deductions; you challenge them ('Are you sure?').", "Ask them to describe the owner's day.", "Contrast must / might / can't with how sure they are."], "pair": ["Partners make deductions and agree on one 'owner profile'.", "Compare with another pair.", "Swap who starts."], "grp": ["Show the bag. Groups write a profile of the owner in two minutes.", "Groups present; the class decides which is most logical.", "Write the best deductions on the board."]}, "end": "What would someone deduce about you from YOUR bag?"}, {"id": "what-must-have-happened", "name": "What Must Have Happened?", "cat": "opinion", "lv": ["B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Past modals"], "focus": "Past deduction: must have / might have / can't have + past participle; criticism: should have…", "desc": "Mysterious situations: work out what happened and who should have done things differently.", "instr": "What must have happened? Give three possible explanations, then say what someone should or shouldn't have done.", "ph": ["Someone must have…", "They might have… / could have…", "She can't have… because…", "He should have… / shouldn't have…"], "cards": ["The kitchen is flooded and the dog is wet.", "Your friend didn't come to your birthday party.", "The car has a parking ticket and a broken mirror.", "Your phone has 47 missed calls from your mum.", "The cake in the fridge has a big bite out of it.", "Your neighbour's garden is full of footprints.", "The teacher came to class with one shoe.", "All the lights in the office were on on Monday morning.", "Your plant is dead after your holiday.", "There's a stranger asleep on your sofa.", "Your laptop screen is cracked.", "The pizza arrived two hours late and cold."], "guide": {"ind": ["The student gives three deductions, then one criticism.", "Ask them to tell the 'true story' in the end.", "Contrast must have (sure) vs might have (possible)."], "pair": ["Partners take turns making deductions until one sounds right.", "Then they decide who should have done what.", "Share with the class."], "grp": ["Show the situation. Groups think of the most logical and the funniest explanation.", "Groups present; vote for each.", "Correct past participles on the board."]}, "end": "Tell us about something you should have done differently this week."}, {"id": "corrupt-a-wish", "name": "Corrupt a Wish", "cat": "game", "lv": ["B1", "B2", "C1"], "fmts": ["pair", "grp"], "kind": "single", "gram": ["Wish / If only", "Second conditional"], "focus": "I wish I had/could…, If only…, I wish I hadn't… — and the genie's twist: 'Granted, but…'", "desc": "Make a wish. The next person grants it… but adds a terrible twist.", "instr": "Make a wish about the topic: 'I wish I…'. The next student is the genie: 'Granted, but…' and adds a twist. Then they make a new wish.", "ph": ["I wish I had / could / were…", "If only I…", "Granted, but…", "Now I wish I hadn't wished for that!"], "ex": "A: I wish I could fly. B: Granted, but you can only fly at 2 km per hour. B: I wish I were rich. C: Granted, but all your money is in coins.", "cards": ["Money", "Free time", "Being famous", "Superpowers", "Your house", "School or work", "Your appearance", "Food", "Holidays", "Your phone", "The weather", "Talents"], "guide": {"ind": ["You're the genie first. The student wishes, you twist it. Then swap.", "Finish with a real regret: 'I wish I hadn't…'", "Point out: wish + past simple (present), wish + past perfect (past)."], "pair": ["Partners take turns wishing and twisting for 2 minutes per topic.", "Count the twists: the funniest pair shares one.", "Swap topics."], "grp": ["Students sit in a circle. The wish travels round the class.", "Anyone who can't think of a twist in 5 seconds is out.", "Vote for the cruellest twist."]}, "end": "What's one thing you really wish you could change about your week?"}, {"id": "it-wasnt-me", "name": "It Wasn't Me!", "cat": "game", "lv": ["B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Passive voice", "Past modals"], "focus": "Passive to avoid blame: The vase was broken…, The cake has been eaten…, It must have been…", "desc": "Something went wrong and you don't want to be blamed. Explain it with the passive.", "instr": "Your parent, boss or flatmate is angry. Explain what happened without saying it was you! Use the passive.", "ph": ["It was broken when I…", "Mistakes were made…", "The… has been… by someone", "It must have been… by the cat"], "cards": ["The vase is broken.", "All the biscuits have been eaten.", "The car is scratched.", "The homework is missing.", "The plant is dead.", "The TV remote has disappeared.", "The walls have been painted pink.", "The wifi password has been changed.", "Your sister's jumper is ruined.", "The boss's chair is broken.", "The dog has been dyed blue.", "The fridge door was left open all night."], "guide": {"ind": ["You're the angry parent or boss and ask questions; the student defends themselves with the passive.", "Swap roles.", "Show how the passive hides who did it."], "pair": ["One partner accuses, the other avoids the blame.", "The accuser decides: guilty or not guilty?", "Swap."], "grp": ["Groups play a family. 'Parents' ask questions; 'siblings' blame each other using the passive.", "Act out the best one for the class.", "Write the best passive excuses on the board."]}, "end": "What's the best excuse you've ever heard?"}, {"id": "made-built-written", "name": "Made, Built, Written…", "cat": "warm", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "reveal": true, "revealTag": "Passive quiz · say the full sentence", "ansLabel": "The answer", "gram": ["Passive voice"], "focus": "Past passive with by: It was painted by…, It was invented by…", "desc": "A passive quiz: who made it? Say the full sentence before the answer is revealed.", "instr": "Who made it? Answer with a full passive sentence: 'It was painted by…'. Then tell your partner one more fact you know.", "ph": ["It was painted by…", "It was written by…", "It was invented / discovered by…", "I think it was built in…"], "cards": [{"t": "The Mona Lisa / paint", "ans": "It was painted by Leonardo da Vinci."}, {"t": "The Sagrada Família / design", "ans": "It was designed by Antoni Gaudí."}, {"t": "Harry Potter / write", "ans": "It was written by J.K. Rowling."}, {"t": "Penicillin / discover", "ans": "It was discovered by Alexander Fleming in 1928."}, {"t": "The World Wide Web / invent", "ans": "It was invented by Tim Berners-Lee in 1989."}, {"t": "Guernica / paint", "ans": "It was painted by Pablo Picasso in 1937."}, {"t": "Romeo and Juliet / write", "ans": "It was written by William Shakespeare."}, {"t": "Radium / discover", "ans": "It was discovered by Marie and Pierre Curie in 1898."}, {"t": "The theory of relativity / develop", "ans": "It was developed by Albert Einstein."}, {"t": "Don Quixote / write", "ans": "It was written by Miguel de Cervantes."}], "guide": {"ind": ["The student answers in a full passive sentence before you reveal.", "Ask: 'Where was it made? When?' to get more passives.", "Then ask them to make a quiz question for you."], "pair": ["Pairs answer before each reveal; one point per correct full sentence.", "After the quiz, each pair writes two new questions for another pair.", "Swap questions."], "grp": ["Teams answer on mini whiteboards: only full passive sentences score.", "Reveal and give points.", "Teams invent a question for the other team."]}, "end": "Make a passive question about your city for a partner."}, {"id": "lazy-millionaire", "name": "The Lazy Millionaire", "cat": "you", "lv": ["B1", "B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Causative have/get"], "focus": "Causative: I have my… done, I get someone to…, I had it repaired", "desc": "You're a millionaire who never does anything yourself. Explain how you get things done.", "instr": "You're a very lazy millionaire. Explain how you get this done — you never do it yourself! Then say what you really do yourself in real life.", "ph": ["I have my… done every…", "I get someone to…", "I had it… last week", "In real life, I… myself."], "cards": ["your hair", "your car", "your house cleaned", "your shopping", "your nails", "your dog", "your photos", "your clothes", "your meals", "your homework or emails", "your garden", "your birthday party"], "guide": {"ind": ["The student plays the millionaire; you're the journalist asking questions.", "Switch to real life: 'When did you last have your hair cut?'", "Compare 'I cut my hair' vs 'I had my hair cut'."], "pair": ["One partner is the millionaire, the other the interviewer.", "Swap, then compare what you do yourselves in real life.", "Who's the laziest?"], "grp": ["Show the card. Volunteers answer as millionaires.", "Then a real-life round: hands up if you do it yourself.", "Write a few causative sentences on the board."]}, "end": "What would you pay someone to do for you if you could?"}, {"id": "pardon", "name": "Pardon? What Did She Say?", "cat": "game", "lv": ["A2", "B1", "B2"], "fmts": ["grp", "pair"], "kind": "single", "gram": ["Reported speech"], "focus": "Reported speech: She said (that)…, He told me…, She asked if…, He wanted to know…", "desc": "Grandma can't hear well. Repeat what people said using reported speech.", "instr": "Student A says the sentence. Student B is grandma and says 'Pardon?' Student C reports it: 'She said that…'. Watch the tenses!", "ph": ["She said (that)…", "He told me (that)…", "She asked if…", "He wanted to know where…"], "cards": ["\"I've lost my keys again!\"", "\"I'm going to Paris tomorrow.\"", "\"Are you coming to my party?\"", "\"I can't find my glasses.\"", "\"I'll call you later.\"", "\"Where did you buy that hat?\"", "\"I don't like this soup.\"", "\"We're getting married!\"", "\"Have you seen my cat?\"", "\"I was sleeping when you called.\"", "\"Don't touch the cake!\"", "\"I've never been so tired in my life.\""], "guide": {"ind": ["You say the sentence, play grandma, and the student reports it. Then swap.", "Show the backshift: am → was, will → would, have → had.", "Add a twist: report what someone said to them this week."], "pair": ["Groups of three: speaker, grandma, reporter. Rotate roles every card.", "Grandma can say 'Pardon?' twice: the reporter must say it in a different way the second time.", "Report the funniest sentence to the class."], "grp": ["Choose a speaker and a grandma. The class reports in turns.", "Points for correct tense changes.", "Finish with a gossip round: 'I heard that…'"]}, "end": "Report one thing someone said to you this week."}, {"id": "never-ending-sentence", "name": "The Never-Ending Sentence", "cat": "game", "lv": ["B1", "B2", "C1"], "fmts": ["pair", "grp"], "kind": "single", "timer": 120, "gram": ["Relative clauses"], "focus": "Relative clauses: who, which, that, where, whose, when", "desc": "Build one huge sentence together, adding relative clauses one by one.", "instr": "Continue the sentence by adding a relative clause (who, which, that, where, whose, when). How long can the class make it?", "ph": ["…who…", "…which…", "…where…", "…whose…"], "ex": "This is the man who lives in the house which has a garden where a dog whose name is Max sleeps…", "cards": ["This is the man…", "I found a phone…", "We went to a restaurant…", "She married a millionaire…", "I met a girl…", "They bought a house…", "He has a car…", "I'll never forget the day…", "There's a shop in my town…", "My teacher has a cat…"], "guide": {"ind": ["You and the student take turns adding a clause until it breaks.", "Then say the whole sentence from the beginning.", "Focus on whose and where."], "pair": ["Partners alternate clauses for two minutes.", "Count the clauses. Try to beat your record on the next card.", "Read the final sentence to the class."], "grp": ["Go round the class: each student repeats the sentence and adds a clause.", "If someone forgets, the sentence starts again.", "Write the record sentence on the board."]}, "end": "What's the longest sentence we built?"}, {"id": "most-ever", "name": "The Most… Ever", "cat": "you", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Comparatives & superlatives", "Present perfect"], "focus": "Superlative + present perfect: the best… I've ever…; comparatives to compare answers", "desc": "Talk about the best, worst and strangest things you've ever experienced.", "instr": "Answer with a superlative and the present perfect, then tell the story. Your partner compares: 'Mine was even worse than yours!'", "ph": ["The best… I've ever… was…", "It was the most… I've ever…", "Mine was even… than yours!", "It wasn't as… as…"], "cards": ["the best present you've ever received", "the worst meal you've ever eaten", "the most beautiful place you've ever visited", "the strangest dream you've ever had", "the most embarrassing moment you've ever had", "the longest journey you've ever made", "the best concert you've ever been to", "the most boring film you've ever seen", "the scariest thing you've ever done", "the funniest person you've ever met", "the most expensive thing you've ever bought", "the hardest exam you've ever taken"], "guide": {"ind": ["The student answers and tells the story; you compare with yours.", "Push for comparatives: 'Was it worse than…?'", "Correct 'the most + adjective' and 'I've ever'."], "pair": ["Partners answer and compare: whose was the best/worst?", "Each pair chooses one story to tell the class.", "Swap who starts."], "grp": ["Show the card. Students answer in small groups.", "Each group picks the 'winner' and tells the class.", "Vote for the most extreme story."]}, "end": "What's the best thing that has happened to you this week?"}, {"id": "cant-stand", "name": "Can't Stand, Can't Live Without", "cat": "warm", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Gerunds & infinitives"], "focus": "Verb patterns: love/enjoy/can't stand/don't mind + -ing; want/hope/would like/decide + to", "desc": "Say how you feel about everyday activities and find classmates with the same tastes.", "instr": "How do you feel about this? Use a verb + -ing or + to. Then try to convince your partner to like it as much as you do (or hate it!).", "ph": ["I really enjoy / love…ing", "I can't stand / don't mind…ing", "I'd like to / I'm hoping to…", "I've decided to stop…ing"], "cards": ["getting up early", "cooking for other people", "dancing in public", "waiting in queues", "travelling alone", "talking on the phone", "going to the gym", "doing nothing all day", "shopping for clothes", "learning new apps", "singing in the shower", "camping"], "guide": {"ind": ["The student gives their opinion with two different verb patterns.", "Ask: 'Would you like to… more often?' to get the infinitive.", "Share yours and disagree."], "pair": ["Partners find out who likes each activity more.", "Each tries to convince the other in 30 seconds.", "Find two things you both can't stand."], "grp": ["Show the card. Students move: love it (left), don't mind (middle), can't stand (right).", "Ask people in each group to explain.", "Keep a class 'top 3 most hated' list."]}, "end": "What's something you'd like to start doing?"}, {"id": "heres-the-answer", "name": "Here's the Answer", "cat": "game", "lv": ["A2", "B1", "B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Question forms"], "focus": "Question forms in all tenses: word order, auxiliaries (do/did/have/will), subject questions", "desc": "Jeopardy style: you get the answer, you invent the question.", "instr": "Here's the answer. What was the question? Think of at least two different questions. Then ask your partner one of them for real.", "ph": ["How long have you…?", "When did you…?", "Why do you…?", "Who…? / Which…? / How often…?"], "cards": ["Yes, twice.", "In a small village near the sea.", "Because I was hungry.", "Next Friday at 6.", "My grandmother.", "No, never.", "About three hours.", "By bus.", "A red one.", "Since I was eight.", "Pizza, definitely.", "Only if it's sunny."], "guide": {"ind": ["The student makes two questions for each answer.", "Then ask them one of their questions for real.", "Check auxiliaries and word order."], "pair": ["Partners race: who can make the most correct questions in one minute?", "Then they ask each other one question for real.", "Swap who starts."], "grp": ["Teams write as many questions as they can in one minute.", "One point per correct question; two for a question nobody else has.", "Ask some of the questions for real."]}, "end": "What's the most interesting question you heard today?"}, {"id": "drama-queen", "name": "Drama Queen", "cat": "game", "lv": ["C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "reveal": true, "revealTag": "Inversion · make it dramatic", "ansLabel": "The dramatic version", "gram": ["Inversion"], "focus": "Negative inversion: Never have I…, Not only did…, Hardly had… when…, Under no circumstances…", "desc": "Turn boring sentences into dramatic ones with inversion, then tell a dramatic story.", "instr": "Say this sentence in the most dramatic way, starting with the word in brackets. Then continue the story with one more dramatic sentence!", "ph": ["Never have I…", "Not only did…, but…", "Hardly had… when…", "Under no circumstances will…"], "cards": [{"t": "I have never seen such a mess. (Never…)", "ans": "Never have I seen such a mess!"}, {"t": "She was late and she forgot the present. (Not only…)", "ans": "Not only was she late, but she also forgot the present."}, {"t": "We had just sat down when the fire alarm rang. (Hardly…)", "ans": "Hardly had we sat down when the fire alarm rang."}, {"t": "You must not open this door. (Under no circumstances…)", "ans": "Under no circumstances must you open this door."}, {"t": "I realised the truth only later. (Only later…)", "ans": "Only later did I realise the truth."}, {"t": "I have rarely eaten such a good meal. (Rarely…)", "ans": "Rarely have I eaten such a good meal."}, {"t": "He didn't say a word all evening. (Not once…)", "ans": "Not once did he say a word all evening."}, {"t": "You'll understand when you have children. (Only when…)", "ans": "Only when you have children will you understand."}, {"t": "I had no idea he was a spy. (Little…)", "ans": "Little did I know that he was a spy."}, {"t": "We arrived and it started to rain immediately. (No sooner…)", "ans": "No sooner had we arrived than it started to rain."}], "guide": {"ind": ["The student says the dramatic version before the reveal, with lots of drama.", "Then continue the story with one more inverted sentence.", "Focus on the auxiliary after the adverbial."], "pair": ["Partners take turns: one reads, the other 'dramatises'.", "After each reveal, they add one more line to the story.", "Act out the best story."], "grp": ["Show the sentence. Volunteers perform it like an actor.", "The class checks the grammar on the reveal.", "Groups write a mini-drama with three inversions and perform it."]}, "end": "Tell us about something that happened this week, as dramatically as you can."}, {"id": "what-i-really-mean", "name": "What I Really Mean Is…", "cat": "opinion", "lv": ["B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Cleft sentences"], "focus": "Cleft sentences for emphasis: What I love about… is…, The thing that annoys me is…, It was… that…", "desc": "Give strong opinions with emphasis using cleft sentences.", "instr": "Say what you love and what annoys you about this topic. Start your sentences with 'What I…' or 'The thing that…'.", "ph": ["What I love about… is…", "The thing that drives me crazy is…", "What I don't understand is why…", "It's… that really…"], "cards": ["Mondays", "Your city", "Your phone", "Summer", "Your job or school", "Social media", "Travelling", "Your best friend", "Learning English", "Cooking", "Family dinners", "Weekends"], "guide": {"ind": ["The student gives one positive and one negative cleft sentence per topic.", "Ask 'Why?' and get a second cleft sentence.", "Compare: 'I love…' vs 'What I love is…' — which sounds stronger?"], "pair": ["Partners take turns. The listener must react with a cleft sentence too: 'What surprises me is…'", "Swap every card.", "Share the strongest opinion with the class."], "grp": ["Show the topic. Go round the class: each student adds a cleft sentence without repeating.", "Write the best ones on the board.", "Vote for the most passionate opinion."]}, "end": "What I've learnt today is…"}, {"id": "linker-challenge", "name": "Linker Challenge", "cat": "opinion", "lv": ["B1", "B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "timer": 60, "gram": ["Linkers"], "focus": "Linkers and discourse markers: however, on the other hand, what's more, having said that, as a result…", "desc": "Talk for one minute about a topic and use all three linkers on the card.", "instr": "Talk for one minute about the topic. You MUST use all three linkers on the card. The others tick them off when they hear them!", "ph": ["First of all,…", "However,…", "Having said that,…", "All in all,…"], "cards": [{"t": "Living in a big city", "sub": ["however", "what's more", "as a result"]}, {"t": "Social media", "sub": ["on the other hand", "for instance", "in my opinion"]}, {"t": "Working from home", "sub": ["although", "moreover", "all in all"]}, {"t": "Fast food", "sub": ["despite", "therefore", "having said that"]}, {"t": "Learning languages", "sub": ["not only… but also", "whereas", "to sum up"]}, {"t": "Homework", "sub": ["in contrast", "besides", "consequently"]}, {"t": "Travelling alone", "sub": ["even though", "on top of that", "in conclusion"]}, {"t": "Video games", "sub": ["nevertheless", "for example", "as a matter of fact"]}, {"t": "Summer holidays", "sub": ["while", "furthermore", "overall"]}, {"t": "Having a pet", "sub": ["in spite of", "because of this", "to be honest"]}], "guide": {"ind": ["The student talks for one minute; you tick the linkers.", "Give feedback: was each linker used correctly?", "Repeat with a new card and a higher target."], "pair": ["Partner A talks, B ticks the linkers and gives a point for each correct one.", "Swap every card.", "Who got the most points?"], "grp": ["Use Pick a student. The class listens and raises a hand at each linker.", "Correct use = 1 point, wrong use = 0.", "Finish with the three most useful linkers of the day."]}, "end": "Which function tone(f,t0,d,v){const a=audio();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(a.destination);const s=a.currentTime+t0;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d+.05);}catch(e){}}

let D=null;
function stopDeck(){if(D){clearInterval(D.tid);document.removeEventListener("keydown",D.key);}D=null;}
const PER_OK=d=>(d.kind==="grid"||d.kind==="single")&&!d.reveal;
const ctext=c=>typeof c==="object"?c.t:c;
function perOf(d){if(!PER_OK(d))return 1;const p=store.get("sc-per",{});return p[d.id]||1;}
function buildSlides(d,order){const s=[{t:"title"}];
  if(d.reveal){order.forEach(i=>{s.push({t:"card",i});s.push({t:"ans",i});});}
  else if(d.kind==="grid"||d.kind==="single"){const per=perOf(d);if(per===1)order.forEach(i=>s.push({t:"card",i}));else for(let i=0;i<order.length;i+=per)s.push({t:"grid",idx:order.slice(i,i+per)});}
  else if(d.kind==="pick"){s.push({t:"pick"});}
  else order.forEach(i=>s.push({t:"card",i}));
  s.push({t:"end"});return s;}

      inner=pic?`<div class="s-split"><div style="display:flex;flex-direction:column;gap:16px">${txt}</div><div class="s-img">${pic}</div></div>`:txt;}
    else if(d.kind==="versus"){const L=d.labels||["",""];

      inner=`<div class="s-vs ${ph?"ph":""}">${opt(pa,L[0],c.a)}<span class="s-or">OR</span>${opt(pb,L[1],c.b)}</div>`;}
    else if(d.kind==="triple"){

      inner=`<div class="s-tiles">${c.map(tl).join("")}</div>${d.id==="story-chain"?"":`<p class="s-instr" style="font-size:clamp(.95rem,1.8vw,1.3rem)">Done it? Want to try it? Would you skip it?</p>`}`;}
    else if(d.kind==="stat"){
      inner=`<span class="s-tag">Imagined headline</span><p class="s-stat">“${esc(c.s)}”</p><ul class="s-q">${d.q.map(q=>`<li>${esc(q)}</li>`).join("")}<li><b>${esc(c.q)}</b></li></ul>`;}
    else if(d.kind==="board"){

    body=`<div class="s-eyebrow"><span>${esc(d.name)}</span><span>${cardNo}</span></div><div class="s-body">${inner}</div>${phrases(d)}`;
    if((d.kind==="board"||d.secret)&&D.hide)body+=`<div class="s-cover"><span class="label" style="color:var(--stage-muted)">${d.secret?"Only the speaker looks":"Next word"}</span><p class="s-title">${d.secret?"Eyes closed!":"Ready?"}</p><p class="s-instr">${d.secret?"Everyone except the speaker closes their eyes. Press H to show the card, and H again to hide it.":"Press Hide card again to show it."}</p></div>`;
  }
  st.innerHTML=body+`<div class="s-overlay">${D.tid||D.left>0?`<span class="s-pill ${D.left<=10?"low":""}" id="tpill">${fmt(Math.max(D.left,0))}</span>`:""}</div>
    ${D.up?`<div class="s-up">Time's up!</div>`:""}${D.pickName?`<div class="s-pick">${esc(D.pickName)}</div>`:""}
    <div class="s-nav"><button id="fsPrev" aria-label="Previous">←</button><button id="fsNext" aria-label="Next">→</button></div>`;
  $("#fsPrev").onclick=()=>go(-1);$("#fsNext").onclick=()=>go(1);
  $("#count").textContent=`${D.i+1} / ${n}`;
  $("#prev").disabled=D.i===0;$("#next").disabled=D.i===n-1;

/* ---------- shared countdown (interactive games) ---------- */
const T={id:null,left:0,total:0};
function stopTimer(){clearInterval(T.id);T.id=null;}
function startTimer(onEnd){audio();T.id=setInterval(()=>{T.left--;if(T.left===10)warnTick();const tm=$("#tm");if(!tm){stopTimer();return;}
  tm.textContent=fmt(Math.max(T.left,0));tm.classList.toggle("low",T.left<=10);$("#br").style.width=(Math.max(T.left,0)/T.total*100)+"%";
  if(T.left<=0){stopTimer();beep();tm.textContent="Time's up!";setTimeout(onEnd,1500);}},1000);}
function timerBlock(){return `<div class="timer" id="tm">${fmt(T.left)}</div><div class="bar"><i id="br" style="width:${T.left/T.total*100}%"></i></div>`;}
function wireToggle(btn,onEnd){btn.onclick=()=>{if(T.id){stopTimer();btn.textContent="Resume";}else{startTimer(onEnd);btn.textContent="Pause";}};}
function gameHeader(g){return `<a class="back" href="#">← All activities</a><header><span class="label">${g.fmts.map(f=>FMTS[f]).join(" · ")} · ${lvRange(g.lv)}</span><h1>${esc(g.name.split(" ")[0])} <span>${esc(g.name.split(" ").slice(1).join(" "))}</span></h1></header>`;}
function classField(id){return `<div class="field"><label class="label" for="${id}">Class</label><select id="${id}">${CL.options(true)}</select></div>`;}

/* ---------- Secret Word ---------- */
const SW_WORDS={
 easy:["banana","umbrella","penguin","pizza","bicycle","guitar","rainbow","chocolate","elephant","sandwich","window","pirate","mirror","balloon","sock","candle","frog","rocket","sunglasses","pillow","butterfly","lemon","ladder","snow","cheese","dragon","clock","biscuit","teapot","shark"],
 tricky:["toothbrush","volcano","submarine","moustache","trampoline","lighthouse","pyjamas","cactus","helicopter","sandcastle","jellyfish","kangaroo","microwave","parachute","dinosaur","hamster","wig","broccoli","astronaut","snowman","octopus","handcuffs","saxophone","igloo","vampire","flamingo","wheelbarrow","toaster","unicorn","spaghetti"]};
const SW_TOPICS=["Your ideal weekend","The best job in the world","Why people should learn languages","Social media: good or bad?","A trip you will never forget","What makes a good friend","Life without mobile phones","The perfect school","How to stay healthy","A person who inspires you","City life or country life?","Your favourite season and why","Technology in 20 years","Is fast food really that bad?","Working from home","Beach holidays or mountain holidays?","The most useless invention","Your dream house","Should every family have a pet?","Shopping online vs in shops","A skill you'd love to learn","The best age to be","Your morning routine","A film everyone should watch","Should homework be banned?","Your favourite place in your town","Cooking at home vs eating out","Living abroad","The best gift you've ever received","Rules you would change at school"];
const SW={g:byId("secret-word"),players:[],round:1,rounds:1,idx:0,time:60,level:"easy",scores:{},usedW:new Set(),usedT:new Set(),cur:null,
 shell(inner){app.innerHTML=`<div class="narrow">${gameHeader(this.g)}
   <main class="card" id="screen" aria-live="polite">${inner}</main>
   <section class="card" id="scoreCard" ${this.started?"":"hidden"}><div class="label">Scoreboard</div><ol class="scores" id="scoreList"></ol></section></div>`;
   if(this.started)this.renderScores();},
 setup(){this.started=false;const a=CL.active(),saved=store.get("sc-names","");
  this.shell(`
    <div id="bn">${doneBanner("secret-word")}</div>
    <div class="row">${classField("cls")}</div>
    <div class="field"><label class="label" for="names">Students playing today</label>
      <textarea id="names">${esc(a?a.students.join("\n"):saved)}</textarea>
      <span class="note">One per line. Delete anyone who's absent.</span></div>
    <div class="row">
      <div class="field"><label class="label" for="time">Speaking time</label><select id="time"><option value="45">45 seconds</option><option value="60" selected>1 minute</option><option value="90">1.5 minutes</option><option value="120">2 minutes</option></select></div>
      <div class="field"><label class="label" for="level">Secret words</label><select id="level"><option value="easy">Easy</option><option value="tricky">Tricky</option><option value="mix">Mixed</option></select></div>
      <div class="field"><label class="label" for="rounds">Rounds</label><select id="rounds"><option>1</option><option>2</option><option>3</option></select></div>
    </div>
    <details class="more"><summary>How to play</summary><ul class="rules" style="margin-top:10px"><li>The speaker secretly sees one word, then gets a random topic.</li><li>They talk about the topic and must <b>use the word naturally</b>.</li><li>When time's up, the class guesses the word.</li><li><b>+2</b> to the speaker if nobody spots it. <b>+1</b> to each student who guesses it.</li></ul></details>
    <div class="row"><button class="primary" id="go">Start game</button></div>`);
  $("#cls").onchange=e=>{const c=CL.byId(e.target.value);if(c){CL.setActive(c.id);$("#names").value=c.students.join("\n");}else{$("#names").value="";$("#names").focus();}$("#bn").innerHTML=c?doneBanner("secret-word"):"";};
  $("#go").onclick=()=>{const names=parseNames($("#names").value);
    if(names.length<2){$("#names").focus();return;}
    if(!$("#cls").value)store.set("sc-names",names.join("\n"));else H.mark($("#cls").value,"secret-word");
    Object.assign(this,{players:names,time:+$("#time").value,level:$("#level").value,rounds:+$("#rounds").value,round:1,idx:0,scores:{},started:true});
    names.forEach(n=>this.scores[n]=0);this.newTurn();};},
 lvl(){return this.level==="mix"?(Math.random()<.5?"easy":"tricky"):this.level;},
 newTurn(){this.cur={speaker:this.players[this.idx],word:pickFrom(SW_WORDS[this.lvl()],this.usedW),topic:pickFrom(SW_TOPICS,this.usedT),guessers:new Set()};this.pass();},
 pass(){const c=this.cur;
  this.shell(`
    <div class="row" style="justify-content:space-between"><span class="label">Round ${this.round} of ${this.rounds} · Turn ${this.idx+1}/${this.players.length}</span><span class="chip">Eyes off the screen!</span></div>
    <h2>${esc(c.speaker)}, come and look</h2>
    <p class="note">Press and hold the envelope to see your secret word. Everyone else, look away.</p>
    <div class="envelope" id="env" role="button" tabindex="0" aria-label="Hold to reveal the secret word">
      <div class="closed" id="closed"><span class="stamp">TOP SECRET</span><span>Hold to open</span></div>
      <div id="open" hidden><div class="label">Your secret word</div><div class="word">${esc(c.word)}</div></div></div>
    <div class="row"><button class="primary" id="ready" disabled>I've got it. Show the topic</button><button class="ghost" id="swap">Different word</button></div>`);
  const env=$("#env"),show=v=>{$("#open").hidden=!v;$("#closed").hidden=v;if(v)$("#ready").disabled=false;};
  env.addEventListener("pointerdown",e=>{e.preventDefault();show(true)});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>env.addEventListener(ev,()=>show(false)));
  env.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();show(true)}});
  env.addEventListener("keyup",()=>show(false));env.addEventListener("contextmenu",e=>e.preventDefault());
  $("#swap").onclick=()=>{c.word=pickFrom(SW_WORDS[this.lvl()],this.usedW);this.pass();};
  $("#ready").onclick=()=>{T.left=T.total=this.time;this.speak();};},
 speak(){const c=this.cur;
  this.shell(`<span class="label">${esc(c.speaker)} is speaking about…</span><div class="topic">${esc(c.topic)}</div>${timerBlock()}
    <div class="row"><button class="red" id="play">Start timer</button><button class="ghost" id="newTopic">New topic</button><button class="primary" id="done">Finish</button></div>`);
  wireToggle($("#play"),()=>this.guess());
  $("#newTopic").onclick=()=>{c.topic=pickFrom(SW_TOPICS,this.usedT);stopTimer();T.left=T.total;this.speak();};
  $("#done").onclick=()=>{stopTimer();this.guess();};},
 guess(){const c=this.cur,others=this.players.filter(p=>p!==c.speaker);
  this.shell(`<span class="label">Time's up</span><h2>What was ${esc(c.speaker)}'s secret word?</h2>
    <div class="row"><button class="red" id="rev">Reveal the word</button></div>
    <div id="after" hidden><div class="reveal"><span class="label">The secret word was</span><span class="word">${esc(c.word)}</span></div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px"><span class="label">Who guessed it?</span>
        <div class="pick">${others.map(p=>`<button aria-pressed="false" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div>
        <label class="row note"><input type="checkbox" id="notUsed" style="width:auto"> ${esc(c.speaker)} never used the word (no points)</label>
        <div class="row"><button class="primary" id="score">Give points &amp; next</button></div></div></div>`);
  $("#rev").onclick=()=>{$("#after").hidden=false;$("#rev").disabled=true;};
  app.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);on?c.guessers.add(b.dataset.p):c.guessers.delete(b.dataset.p);});
  $("#score").onclick=()=>{if(!$("#notUsed").checked){if(!c.guessers.size)this.scores[c.speaker]+=2;c.guessers.forEach(p=>this.scores[p]+=1);}
    this.idx++;if(this.idx>=this.players.length){this.idx=0;this.round++;}
    this.round>this.rounds?this.end():this.newTurn();};},
 sorted(){return Object.entries(this.scores).sort((a,b)=>b[1]-a[1]);},
 renderScores(){const s=this.sorted(),top=s.length?s[0][1]:0;$("#scoreList").innerHTML=s.map(([n,p])=>`<li class="${p===top&&p>0?"lead":""}"><span>${esc(n)}</span><span class="pts">${p}</span></li>`).join("");},
 end(){const s=this.sorted(),top=s[0][1],w=s.filter(x=>x[1]===top).map(x=>x[0]);
  this.shell(`<span class="label">Game over</span><span class="stamp" style="align-self:flex-start">CASE CLOSED</span>
    <h2>${w.length>1?"It's a tie":"Winner"}: ${w.map(esc).join(" & ")} (${top} pts)</h2>
    <p class="note">Follow-up: which secret word was the hardest to hide?</p>
    <div class="row"><button class="primary" id="again">Play again</button><button class="ghost" id="reset">Change players</button></div>`);
  $("#again").onclick=()=>{this.round=1;this.idx=0;this.players.forEach(n=>this.scores[n]=0);this.newTurn();};
  $("#reset").onclick=()=>this.setup();}
};

/* ---------- Small Talk Grid ---------- */
const STG={
 A2:[["The weather today","Is it hot or cold today?","What do you do on rainy days?"],["Your weekend","What did you do last weekend?","What are you doing this Saturday?"],["Food you love","What's your favourite dish?","Who cooks at home?"],["Your family","How many people are in your family?","Who are you most like?"],["Pets","Do you have a pet?","What animal would you like?"],["Your bedroom","What's in your bedroom?","What would you change?"],["Breakfast","What do you have for breakfast?","Sweet or savoury?"],["Sports","What sports do you play or watch?","Which sport is boring?"],["Music","What music do you listen to?","Can you play an instrument?"],["Your best friend","How did you meet?","What do you do together?"],["Your town","What's good about your town?","Where do you meet friends?"],["Birthdays","How do you celebrate?","What was your best birthday?"],["Clothes","What are you wearing today?","Where do you buy clothes?"],["School","What's your favourite subject?","What's your least favourite?"],["TV and films","What do you watch?","Who's your favourite actor?"],["Holidays","Where do you go on holiday?","Beach or mountains?"]],
 B1:[["Your last holidays","Where did you go?","What was the best moment?"],["Video games","Do you play? What?","Are games a waste of time?"],["The weather lately","Has it been strange recently?","Your perfect weather?"],["Your neighbourhood","What's it like?","Has it changed much?"],["A good series","What are you watching?","Would you recommend it?"],["Weekend plans","Any plans this weekend?","Your ideal Saturday?"],["Your phone","How much do you use it?","Which app can't you live without?"],["Cooking","Can you cook? What?","Worst kitchen disaster?"],["Public transport","How do you get around?","What annoys you on the bus or metro?"],["Concerts & festivals","Best concert you've been to?","Who would you love to see live?"],["Shopping","Do you enjoy it?","Online or in shops?"],["Hobbies","What do you do in your free time?","A hobby you'd like to try?"],["Sleep","Early bird or night owl?","How many hours do you sleep?"],["Work or studies","What do you do?","What's the hardest part?"],["Coffee or tea","How do you take it?","Favourite café?"],["Childhood memories","A favourite toy?","Something you miss?"]],
 B2:[["Working from home","Have you tried it?","Pros and cons?"],["Travel plans","Next place on your list?","Plan everything or improvise?"],["Social media habits","Which do you use most?","Has it changed how you socialise?"],["A book you've read","What was it about?","Would it work as a film?"],["Fitness trends","Gym, running, yoga…?","A trend you don't get?"],["Living abroad","Would you live abroad?","What would you miss most?"],["Extreme weather","Heatwaves, storms… experiences?","Is it getting worse?"],["Streaming vs cinema","Where do you watch films?","Is cinema dying?"],["Learning languages","How did you learn English?","Which language next?"],["Local festivals","Your favourite local celebration?","Too touristy?"],["Your commute","How long does it take?","How do you use the time?"],["Gadgets","One gadget you can't live without?","An overrated one?"],["Tourism in your city","Good or bad for locals?","Tips for visitors?"],["Goals this year","Any resolutions?","Have you kept them?"],["Food trends","Tried anything new lately?","A trend that should disappear?"],["Small talk itself","Are you good at it?","Topics to avoid?"]]
};
const STGame={g:byId("small-talk-grid"),level:"B1",mode:"class",pairs:[],turn:0,cells:[],time:60,
 randomPairs(list){const a=shuffle(list),out=[];for(let i=0;i<a.length;i+=2)out.push(a.slice(i,i+2));
   if(out.length>1&&out[out.length-1].length===1)out[out.length-2].push(out.pop()[0]);return out.map(p=>p.join(" & ")).join("\n");},
 shell(inner){app.innerHTML=`<div class="narrow">${gameHeader(this.g)}
   <main class="card" id="screen" aria-live="polite">${inner}</main>
   ${this.mode==="race"&&this.cells.length?`<section class="card"><div class="label">Pairs</div><ol class="scores" id="scoreList"></ol></section>`:""}</div>`;
   if(this.mode==="race"&&this.cells.length)this.renderScores();},
 setup(){this.cells=[];const a=CL.active(),savedPairs=store.get("sc-pairs","");
  this.shell(`
    <div id="bn">${doneBanner("small-talk-grid")}</div>
    <div class="row">
      <div class="field"><label class="label" for="lvl">Level</label><select id="lvl">${Object.keys(STG).map(l=>`<option ${l===this.level?"selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label class="label" for="time">Time</label><select id="time"><option value="45">45 seconds</option><option value="60" selected>1 minute</option><option value="90">1.5 minutes</option><option value="120">2 minutes</option></select></div>
      ${classField("cls")}
    </div>
    <div class="field"><span class="label">Mode</span>
      <div class="seg" role="group"><button data-m="class" aria-pressed="${this.mode==="class"}">All pairs at once</button><button data-m="race" aria-pressed="${this.mode==="race"}">Race between pairs</button></div>
      <span class="note" id="modeNote"></span></div>
    <div id="pairsBox" class="field"><div class="row" style="justify-content:space-between"><label class="label" for="pairs">Pairs</label><button class="ghost" id="mkPairs" style="padding:6px 12px">Shuffle pairs</button></div>
      <textarea id="pairs">${esc(a?this.randomPairs(a.students):savedPairs)}</textarea><span class="note">One pair per line, up to 8.</span></div>
    <details class="more"><summary>How to play</summary><ul class="rules" style="margin-top:10px"><li>Choose a square: that's your topic.</li><li>Talk with your partner for <b>the whole time</b>. Ask follow-up questions, react, keep it going.</li><li>A silence of more than <b>3 seconds</b> and the square is lost.</li></ul></details>
    <div class="row"><button class="primary" id="go">Show the grid</button></div>`);
  const setMode=m=>{this.mode=m;app.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
    $("#pairsBox").hidden=m!=="race";
    $("#modeNote").textContent=m==="race"?"Pairs take turns. Survive the minute and the square is yours.":"You pick a square and every pair talks at the same time.";};
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode(this.mode);
  const shuffleFrom=()=>{const c=CL.byId($("#cls").value);if(c)$("#pairs").value=this.randomPairs(c.students);};
  $("#cls").onchange=e=>{const c=CL.byId(e.target.value);if(c){CL.setActive(c.id);shuffleFrom();}else{$("#pairs").value="";}$("#bn").innerHTML=c?doneBanner("small-talk-grid"):"";};
  $("#mkPairs").onclick=shuffleFrom;
  $("#go").onclick=()=>{this.level=$("#lvl").value;this.time=+$("#time").value;
    if(this.mode==="race"){const p=parseNames($("#pairs").value).slice(0,8);if(p.length<2){$("#pairs").focus();return;}store.set("sc-pairs",p.join("\n"));this.pairs=p.map(n=>({name:n,pts:0}));}
    if($("#cls").value)H.mark($("#cls").value,"small-talk-grid");
    this.turn=0;this.cells=STG[this.level].map(([t,...q])=>({t,q,owner:null,used:false}));this.grid();};},
 grid(){const race=this.mode==="race",cur=race?this.pairs[this.turn]:null,left=this.cells.filter(c=>c.owner==null&&!c.used).length;
  this.shell(`
    <div class="row" style="justify-content:space-between"><span class="label">${this.level} grid · ${left} squares left</span>
      ${race?`<span class="turn p${this.turn}"><span class="dot"></span>${esc(cur.name)}'s turn</span>`:`<span class="note">Tap a square to start</span>`}</div>
    <div class="stg">${this.cells.map((c,i)=>{const o=c.owner!=null;return `<button class="cell ${o?"done p"+c.owner:""} ${c.used&&!o?"used":""}" data-i="${i}" ${o||c.used?"disabled":""}>${esc(c.t)}${o?`<small>${esc(this.pairs[c.owner].name.split(/[ &]/)[0])}</small>`:c.used?`<small>✕</small>`:""}</button>`;}).join("")}</div>
    <div class="row"><button class="ghost" id="rand" ${left?"":"disabled"}>Random square</button><button class="ghost" id="newGrid">Change settings</button></div>`);
  app.querySelectorAll(".cell:not(:disabled)").forEach(b=>b.onclick=()=>this.talk(+b.dataset.i));
  $("#rand").onclick=()=>{const free=this.cells.map((c,i)=>i).filter(i=>this.cells[i].owner==null&&!this.cells[i].used);if(free.length)this.talk(free[Math.floor(Math.random()*free.length)]);};
  $("#newGrid").onclick=()=>this.setup();
  if(!left)this.over();},
 talk(i){const c=this.cells[i],race=this.mode==="race";T.left=T.total=this.time;
  this.shell(`
    <span class="label">${race?esc(this.pairs[this.turn].name)+" are talking about…":"Everyone, talk about…"}</span>
    <div class="topic">${esc(c.t)}</div>
    <div><span class="label">Ideas to get started</span><ul class="prompts">${c.q.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>
    ${timerBlock()}
    <div class="row"><button class="red" id="play">Start timer</button>
      ${race?`<button class="ghost" id="fail">Awkward silence!</button>`:`<button class="ghost" id="back">Back to grid</button>`}</div>
    <p class="note">Keep it going: <i>Really? · Why's that? · Me too! · What about you?</i></p>`);
  wireToggle($("#play"),()=>this.result(i,true));
  if(race)$("#fail").onclick=()=>{stopTimer();this.result(i,false);};else $("#back").onclick=()=>{stopTimer();c.used=true;this.grid();};},
 result(i,ok){const c=this.cells[i],race=this.mode==="race";
  if(!race){c.used=true;this.shell(`<span class="label">Time's up</span><h2>Nice work! Swap partners?</h2>
    <p>Which pair never stopped talking? What was the best follow-up question you heard?</p>
    <div class="row"><button class="primary" id="g">Back to the grid</button></div>`);$("#g").onclick=()=>this.grid();return;}
  const p=this.pairs[this.turn];
  if(ok){c.owner=this.turn;p.pts++;}else{c.used=true;}
  this.shell(`<span class="label">${ok?"Survived!":"Silence…"}</span>
    <h2>${ok?`${esc(p.name)} win “${esc(c.t)}”`:`${esc(p.name)} lose “${esc(c.t)}”`}</h2>
    <div class="row"><button class="primary" id="nx">Next pair</button>${ok?`<button class="ghost" id="undo">Actually, there was a silence</button>`:""}</div>`);
  $("#nx").onclick=()=>{this.turn=(this.turn+1)%this.pairs.length;this.grid();};
  if(ok)$("#undo").onclick=()=>{c.owner=null;c.used=true;p.pts--;this.turn=(this.turn+1)%this.pairs.length;this.grid();};},
 renderScores(){const s=this.pairs.map((p,i)=>({...p,i})).sort((a,b)=>b.pts-a.pts),top=s[0].pts;
  $("#scoreList").innerHTML=s.map(p=>`<li class="${p.pts===top&&p.pts>0?"lead":""}"><span class="turn p${p.i}"><span class="dot"></span>${esc(p.name)}</span><span class="pts">${p.pts}</span></li>`).join("");},
 over(){if(this.mode!=="race")return;const s=[...this.pairs].sort((a,b)=>b.pts-a.pts),top=s[0].pts,w=s.filter(p=>p.pts===top).map(p=>p.name);
  $("#screen").insertAdjacentHTML("beforeend",`<div class="reveal"><span class="label">Grid complete</span><h2>${w.length>1?"It's a tie":"Winners"}: ${w.map(esc).join(" & ")} (${top} squares)</h2></div>`);}
};
