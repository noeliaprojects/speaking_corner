/* ---------- shared countdown (interactive games) ---------- */
const T={id:null,left:0,total:0};
function stopTimer(){clearInterval(T.id);T.id=null;}
function startTimer(onEnd){audio();T.id=setInterval(()=>{T.left--;if(T.left===10)warnTick();const tm=$("#tm");if(!tm){stopTimer();return;}
  tm.textContent=fmt(Math.max(T.left,0));tm.classList.toggle("low",T.left<=10);$("#br").style.width=(Math.max(T.left,0)/T.total*100)+"%";
  if(T.left<=0){stopTimer();beep();tm.textContent="Time's up!";setTimeout(onEnd,1500);}},1000);}
function timerBlock(){return `<div class="timer" id="tm">${fmt(T.left)}</div><div class="bar"><i id="br" style="width:${T.left/T.total*100}%"></i></div>`;}
function wireToggle(btn,onEnd){btn.onclick=()=>{if(T.id){stopTimer();btn.textContent="Resume";}else{startTimer(onEnd);btn.textContent="Pause";}};}
function gameHeader(g){return `<a class="back" href="#">← All activities</a><header><span class="label">${g.fmts.map(f=>FMTS[f]).join(" · ")} · ${lvRange(g.lv)}</span><h1>${esc(g.name.split(" ")[0])} <span>${esc(g.name.split(" ").slice(1).join(" "))}</span></h1></header>`;}
function classField(id){return `<div class="field"><label class="label" for="${id}">Class</label><select id="${id}">${CL.options(true)}</select></div>`;}

/* ---------- Secret Word ---------- */
const SW_WORDS={
 easy:["banana","umbrella","penguin","pizza","bicycle","guitar","rainbow","chocolate","elephant","sandwich","window","pirate","mirror","balloon","sock","candle","frog","rocket","sunglasses","pillow","butterfly","lemon","ladder","snow","cheese","dragon","clock","biscuit","teapot","shark"],
 tricky:["toothbrush","volcano","submarine","moustache","trampoline","lighthouse","pyjamas","cactus","helicopter","sandcastle","jellyfish","kangaroo","microwave","parachute","dinosaur","hamster","wig","broccoli","astronaut","snowman","octopus","handcuffs","saxophone","igloo","vampire","flamingo","wheelbarrow","toaster","unicorn","spaghetti"]};
const SW_TOPICS=["Your ideal weekend","The best job in the world","Why people should learn languages","Social media: good or bad?","A trip you will never forget","What makes a good friend","Life without mobile phones","The perfect school","How to stay healthy","A person who inspires you","City life or country life?","Your favourite season and why","Technology in 20 years","Is fast food really that bad?","Working from home","Beach holidays or mountain holidays?","The most useless invention","Your dream house","Should every family have a pet?","Shopping online vs in shops","A skill you'd love to learn","The best age to be","Your morning routine","A film everyone should watch","Should homework be banned?","Your favourite place in your town","Cooking at home vs eating out","Living abroad","The best gift you've ever received","Rules you would change at school"];
const SW={g:byId("secret-word"),players:[],round:1,rounds:1,idx:0,time:60,level:"easy",scores:{},usedW:new Set(),usedT:new Set(),cur:null,
 shell(inner){app.innerHTML=`<div class="narrow">${gameHeader(this.g)}
   <main class="card" id="screen" aria-live="polite">${inner}</main>
   <section class="card" id="scoreCard" ${this.started?"":"hidden"}><div class="label">Scoreboard</div><ol class="scores" id="scoreList"></ol></section></div>`;
   if(this.started)this.renderScores();},
 setup(){this.started=false;const a=CL.active(),saved=store.get("sc-names","");
  this.shell(`
    <div id="bn">${doneBanner("secret-word")}</div>
    <div class="row">${classField("cls")}</div>
    <div class="field"><label class="label" for="names">Students playing today</label>
      <textarea id="names">${esc(a?a.students.join("\n"):saved)}</textarea>
      <span class="note">One per line. Delete anyone who's absent.</span></div>
    <div class="row">
      <div class="field"><label class="label" for="time">Speaking time</label><select id="time"><option value="45">45 seconds</option><option value="60" selected>1 minute</option><option value="90">1.5 minutes</option><option value="120">2 minutes</option></select></div>
      <div class="field"><label class="label" for="level">Secret words</label><select id="level"><option value="easy">Easy</option><option value="tricky">Tricky</option><option value="mix">Mixed</option></select></div>
      <div class="field"><label class="label" for="rounds">Rounds</label><select id="rounds"><option>1</option><option>2</option><option>3</option></select></div>
    </div>
    <details class="more"><summary>How to play</summary><ul class="rules" style="margin-top:10px"><li>The speaker secretly sees one word, then gets a random topic.</li><li>They talk about the topic and must <b>use the word naturally</b>.</li><li>When time's up, the class guesses the word.</li><li><b>+2</b> to the speaker if nobody spots it. <b>+1</b> to each student who guesses it.</li></ul></details>
    <div class="row"><button class="primary" id="go">Start game</button></div>`);
  $("#cls").onchange=e=>{const c=CL.byId(e.target.value);if(c){CL.setActive(c.id);$("#names").value=c.students.join("\n");}else{$("#names").value="";$("#names").focus();}$("#bn").innerHTML=c?doneBanner("secret-word"):"";};
  $("#go").onclick=()=>{const names=parseNames($("#names").value);
    if(names.length<2){$("#names").focus();return;}
    if(!$("#cls").value)store.set("sc-names",names.join("\n"));else H.mark($("#cls").value,"secret-word");
    Object.assign(this,{players:names,time:+$("#time").value,level:$("#level").value,rounds:+$("#rounds").value,round:1,idx:0,scores:{},started:true});
    names.forEach(n=>this.scores[n]=0);this.newTurn();};},
 lvl(){return this.level==="mix"?(Math.random()<.5?"easy":"tricky"):this.level;},
 newTurn(){this.cur={speaker:this.players[this.idx],word:pickFrom(SW_WORDS[this.lvl()],this.usedW),topic:pickFrom(SW_TOPICS,this.usedT),guessers:new Set()};this.pass();},
 pass(){const c=this.cur;
  this.shell(`
    <div class="row" style="justify-content:space-between"><span class="label">Round ${this.round} of ${this.rounds} · Turn ${this.idx+1}/${this.players.length}</span><span class="chip">Eyes off the screen!</span></div>
    <h2>${esc(c.speaker)}, come and look</h2>
    <p class="note">Press and hold the envelope to see your secret word. Everyone else, look away.</p>
    <div class="envelope" id="env" role="button" tabindex="0" aria-label="Hold to reveal the secret word">
      <div class="closed" id="closed"><span class="stamp">TOP SECRET</span><span>Hold to open</span></div>
      <div id="open" hidden><div class="label">Your secret word</div><div class="word">${esc(c.word)}</div></div></div>
    <div class="row"><button class="primary" id="ready" disabled>I've got it. Show the topic</button><button class="ghost" id="swap">Different word</button></div>`);
  const env=$("#env"),show=v=>{$("#open").hidden=!v;$("#closed").hidden=v;if(v)$("#ready").disabled=false;};
  env.addEventListener("pointerdown",e=>{e.preventDefault();show(true)});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>env.addEventListener(ev,()=>show(false)));
  env.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();show(true)}});
  env.addEventListener("keyup",()=>show(false));env.addEventListener("contextmenu",e=>e.preventDefault());
  $("#swap").onclick=()=>{c.word=pickFrom(SW_WORDS[this.lvl()],this.usedW);this.pass();};
  $("#ready").onclick=()=>{T.left=T.total=this.time;this.speak();};},
 speak(){const c=this.cur;
  this.shell(`<span class="label">${esc(c.speaker)} is speaking about…</span><div class="topic">${esc(c.topic)}</div>${timerBlock()}
    <div class="row"><button class="red" id="play">Start timer</button><button class="ghost" id="newTopic">New topic</button><button class="primary" id="done">Finish</button></div>`);
  wireToggle($("#play"),()=>this.guess());
  $("#newTopic").onclick=()=>{c.topic=pickFrom(SW_TOPICS,this.usedT);stopTimer();T.left=T.total;this.speak();};
  $("#done").onclick=()=>{stopTimer();this.guess();};},
 guess(){const c=this.cur,others=this.players.filter(p=>p!==c.speaker);
  this.shell(`<span class="label">Time's up</span><h2>What was ${esc(c.speaker)}'s secret word?</h2>
    <div class="row"><button class="red" id="rev">Reveal the word</button></div>
    <div id="after" hidden><div class="reveal"><span class="label">The secret word was</span><span class="word">${esc(c.word)}</span></div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px"><span class="label">Who guessed it?</span>
        <div class="pick">${others.map(p=>`<button aria-pressed="false" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div>
        <label class="row note"><input type="checkbox" id="notUsed" style="width:auto"> ${esc(c.speaker)} never used the word (no points)</label>
        <div class="row"><button class="primary" id="score">Give points &amp; next</button></div></div></div>`);
  $("#rev").onclick=()=>{$("#after").hidden=false;$("#rev").disabled=true;};
  app.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);on?c.guessers.add(b.dataset.p):c.guessers.delete(b.dataset.p);});
  $("#score").onclick=()=>{if(!$("#notUsed").checked){if(!c.guessers.size)this.scores[c.speaker]+=2;c.guessers.forEach(p=>this.scores[p]+=1);}
    this.idx++;if(this.idx>=this.players.length){this.idx=0;this.round++;}
    this.round>this.rounds?this.end():this.newTurn();};},
 sorted(){return Object.entries(this.scores).sort((a,b)=>b[1]-a[1]);},
 renderScores(){const s=this.sorted(),top=s.length?s[0][1]:0;$("#scoreList").innerHTML=s.map(([n,p])=>`<li class="${p===top&&p>0?"lead":""}"><span>${esc(n)}</span><span class="pts">${p}</span></li>`).join("");},
 end(){const s=this.sorted(),top=s[0][1],w=s.filter(x=>x[1]===top).map(x=>x[0]);
  this.shell(`<span class="label">Game over</span><span class="stamp" style="align-self:flex-start">CASE CLOSED</span>
    <h2>${w.length>1?"It's a tie":"Winner"}: ${w.map(esc).join(" & ")} (${top} pts)</h2>
    <p class="note">Follow-up: which secret word was the hardest to hide?</p>
    <div class="row"><button class="primary" id="again">Play again</button><button class="ghost" id="reset">Change players</button></div>`);
  $("#again").onclick=()=>{this.round=1;this.idx=0;this.players.forEach(n=>this.scores[n]=0);this.newTurn();};
  $("#reset").onclick=()=>this.setup();}
};

const STG={
 A2:[["The weather today","Is it hot or cold today?","What do you do on rainy days?"],["Your weekend","What did you do last weekend?","What are you doing this Saturday?"],["Food you love","What's your favourite dish?","Who cooks at home?"],["Your family","How many people are in your family?","Who are you most like?"],["Pets","Do you have a pet?","What animal would you like?"],["Your bedroom","What's in your bedroom?","What would you change?"],["Breakfast","What do you have for breakfast?","Sweet or savoury?"],["Sports","What sports do you play or watch?","Which sport is boring?"],["Music","What music do you listen to?","Can you play an instrument?"],["Your best friend","How did you meet?","What do you do together?"],["Your town","What's good about your town?","Where do you meet friends?"],["Birthdays","How do you celebrate?","What was your best birthday?"],["Clothes","What are you wearing today?","Where do you buy clothes?"],["School","What's your favourite subject?","What's your least favourite?"],["TV and films","What do you watch?","Who's your favourite actor?"],["Holidays","Where do you go on holiday?","Beach or mountains?"]],
 B1:[["Your last holidays","Where did you go?","What was the best moment?"],["Video games","Do you play? What?","Are games a waste of time?"],["The weather lately","Has it been strange recently?","Your perfect weather?"],["Your neighbourhood","What's it like?","Has it changed much?"],["A good series","What are you watching?","Would you recommend it?"],["Weekend plans","Any plans this weekend?","Your ideal Saturday?"],["Your phone","How much do you use it?","Which app can't you live without?"],["Cooking","Can you cook? What?","Worst kitchen disaster?"],["Public transport","How do you get around?","What annoys you on the bus or metro?"],["Concerts & festivals","Best concert you've been to?","Who would you love to see live?"],["Shopping","Do you enjoy it?","Online or in shops?"],["Hobbies","What do you do in your free time?","A hobby you'd like to try?"],["Sleep","Early bird or night owl?","How many hours do you sleep?"],["Work or studies","What do you do?","What's the hardest part?"],["Coffee or tea","How do you take it?","Favourite café?"],["Childhood memories","A favourite toy?","Something you miss?"]],
 B2:[["Working from home","Have you tried it?","Pros and cons?"],["Travel plans","Next place on your list?","Plan everything or improvise?"],["Social media habits","Which do you use most?","Has it changed how you socialise?"],["A book you've read","What was it about?","Would it work as a film?"],["Fitness trends","Gym, running, yoga…?","A trend you don't get?"],["Living abroad","Would you live abroad?","What would you miss most?"],["Extreme weather","Heatwaves, storms… experiences?","Is it getting worse?"],["Streaming vs cinema","Where do you watch films?","Is cinema dying?"],["Learning languages","How did you learn English?","Which language next?"],["Local festivals","Your favourite local celebration?","Too touristy?"],["Your commute","How long does it take?","How do you use the time?"],["Gadgets","One gadget you can't live without?","An overrated one?"],["Tourism in your city","Good or bad for locals?","Tips for visitors?"],["Goals this year","Any resolutions?","Have you kept them?"],["Food trends","Tried anything new lately?","A trend that should disappear?"],["Small talk itself","Are you good at it?","Topics to avoid?"]]
};
const STGame={g:byId("small-talk-grid"),level:"B1",mode:"class",pairs:[],turn:0,cells:[],time:60,
 randomPairs(list){const a=shuffle(list),out=[];for(let i=0;i<a.length;i+=2)out.push(a.slice(i,i+2));
   if(out.length>1&&out[out.length-1].length===1)out[out.length-2].push(out.pop()[0]);return out.map(p=>p.join(" & ")).join("\n");},
 shell(inner){app.innerHTML=`<div class="narrow">${gameHeader(this.g)}
   <main class="card" id="screen" aria-live="polite">${inner}</main>
   ${this.mode==="race"&&this.cells.length?`<section class="card"><div class="label">Pairs</div><ol class="scores" id="scoreList"></ol></section>`:""}</div>`;
   if(this.mode==="race"&&this.cells.length)this.renderScores();},
 setup(){this.cells=[];const a=CL.active(),savedPairs=store.get("sc-pairs","");
  this.shell(`
    <div id="bn">${doneBanner("small-talk-grid")}</div>
    <div class="row">
      <div class="field"><label class="label" for="lvl">Level</label><select id="lvl">${Object.keys(STG).map(l=>`<option ${l===this.level?"selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label class="label" for="time">Time</label><select id="time"><option value="45">45 seconds</option><option value="60" selected>1 minute</option><option value="90">1.5 minutes</option><option value="120">2 minutes</option></select></div>
      ${classField("cls")}
    </div>
    <div class="field"><span class="label">Mode</span>
      <div class="seg" role="group"><button data-m="class" aria-pressed="${this.mode==="class"}">All pairs at once</button><button data-m="race" aria-pressed="${this.mode==="race"}">Race between pairs</button></div>
      <span class="note" id="modeNote"></span></div>
    <div id="pairsBox" class="field"><div class="row" style="justify-content:space-between"><label class="label" for="pairs">Pairs</label><button class="ghost" id="mkPairs" style="padding:6px 12px">Shuffle pairs</button></div>
      <textarea id="pairs">${esc(a?this.randomPairs(a.students):savedPairs)}</textarea><span class="note">One pair per line, up to 8.</span></div>
    <details class="more"><summary>How to play</summary><ul class="rules" style="margin-top:10px"><li>Choose a square: that's your topic.</li><li>Talk with your partner for <b>the whole time</b>. Ask follow-up questions, react, keep it going.</li><li>A silence of more than <b>3 seconds</b> and the square is lost.</li></ul></details>
    <div class="row"><button class="primary" id="go">Show the grid</button></div>`);
  const setMode=m=>{this.mode=m;app.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
    $("#pairsBox").hidden=m!=="race";
    $("#modeNote").textContent=m==="race"?"Pairs take turns. Survive the minute and the square is yours.":"You pick a square and every pair talks at the same time.";};
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode(this.mode);
  const shuffleFrom=()=>{const c=CL.byId($("#cls").value);if(c)$("#pairs").value=this.randomPairs(c.students);};
  $("#cls").onchange=e=>{const c=CL.byId(e.target.value);if(c){CL.setActive(c.id);shuffleFrom();}else{$("#pairs").value="";}$("#bn").innerHTML=c?doneBanner("small-talk-grid"):"";};
  $("#mkPairs").onclick=shuffleFrom;
  $("#go").onclick=()=>{this.level=$("#lvl").value;this.time=+$("#time").value;
    if(this.mode==="race"){const p=parseNames($("#pairs").value).slice(0,8);if(p.length<2){$("#pairs").focus();return;}store.set("sc-pairs",p.join("\n"));this.pairs=p.map(n=>({name:n,pts:0}));}
    if($("#cls").value)H.mark($("#cls").value,"small-talk-grid");
    this.turn=0;this.cells=STG[this.level].map(([t,...q])=>({t,q,owner:null,used:false}));this.grid();};},
 grid(){const race=this.mode==="race",cur=race?this.pairs[this.turn]:null,left=this.cells.filter(c=>c.owner==null&&!c.used).length;
  this.shell(`
    <div class="row" style="justify-content:space-between"><span class="label">${this.level} grid · ${left} squares left</span>
      ${race?`<span class="turn p${this.turn}"><span class="dot"></span>${esc(cur.name)}'s turn</span>`:`<span class="note">Tap a square to start</span>`}</div>
    <div class="stg">${this.cells.map((c,i)=>{const o=c.owner!=null;return `<button class="cell ${o?"done p"+c.owner:""} ${c.used&&!o?"used":""}" data-i="${i}" ${o||c.used?"disabled":""}>${esc(c.t)}${o?`<small>${esc(this.pairs[c.owner].name.split(/[ &]/)[0])}</small>`:c.used?`<small>✕</small>`:""}</button>`;}).join("")}</div>
    <div class="row"><button class="ghost" id="rand" ${left?"":"disabled"}>Random square</button><button class="ghost" id="newGrid">Change settings</button></div>`);
  app.querySelectorAll(".cell:not(:disabled)").forEach(b=>b.onclick=()=>this.talk(+b.dataset.i));
  $("#rand").onclick=()=>{const free=this.cells.map((c,i)=>i).filter(i=>this.cells[i].owner==null&&!this.cells[i].used);if(free.length)this.talk(free[Math.floor(Math.random()*free.length)]);};
  $("#newGrid").onclick=()=>this.setup();
  if(!left)this.over();},
 talk(i){const c=this.cells[i],race=this.mode==="race";T.left=T.total=this.time;
  this.shell(`
    <span class="label">${race?esc(this.pairs[this.turn].name)+" are talking about…":"Everyone, talk about…"}</span>
    <div class="topic">${esc(c.t)}</div>
    <div><span class="label">Ideas to get started</span><ul class="prompts">${c.q.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>
    ${timerBlock()}
    <div class="row"><button class="red" id="play">Start timer</button>
      ${race?`<button class="ghost" id="fail">Awkward silence!</button>`:`<button class="ghost" id="back">Back to grid</button>`}</div>
    <p class="note">Keep it going: <i>Really? · Why's that? · Me too! · What about you?</i></p>`);
  wireToggle($("#play"),()=>this.result(i,true));
  if(race)$("#fail").onclick=()=>{stopTimer();this.result(i,false);};else $("#back").onclick=()=>{stopTimer();c.used=true;this.grid();};},
 result(i,ok){const c=this.cells[i],race=this.mode==="race";
  if(!race){c.used=true;this.shell(`<span class="label">Time's up</span><h2>Nice work! Swap partners?</h2>
    <p>Which pair never stopped talking? What was the best follow-up question you heard?</p>
    <div class="row"><button class="primary" id="g">Back to the grid</button></div>`);$("#g").onclick=()=>this.grid();return;}
  const p=this.pairs[this.turn];
  if(ok){c.owner=this.turn;p.pts++;}else{c.used=true;}
  this.shell(`<span class="label">${ok?"Survived!":"Silence…"}</span>
    <h2>${ok?`${esc(p.name)} win “${esc(c.t)}”`:`${esc(p.name)} lose “${esc(c.t)}”`}</h2>
    <div class="row"><button class="primary" id="nx">Next pair</button>${ok?`<button class="ghost" id="undo">Actually, there was a silence</button>`:""}</div>`);
  $("#nx").onclick=()=>{this.turn=(this.turn+1)%this.pairs.length;this.grid();};
  if(ok)$("#undo").onclick=()=>{c.owner=null;c.used=true;p.pts--;this.turn=(this.turn+1)%this.pairs.length;this.grid();};},
 renderScores(){const s=this.pairs.map((p,i)=>({...p,i})).sort((a,b)=>b.pts-a.pts),top=s[0].pts;
  $("#scoreList").innerHTML=s.map(p=>`<li class="${p.pts===top&&p.pts>0?"lead":""}"><span class="turn p${p.i}"><span class="dot"></span>${esc(p.name)}</span><span class="pts">${p.pts}</span></li>`).join("");},
 over(){if(this.mode!=="race")return;const s=[...this.pairs].sort((a,b)=>b.pts-a.pts),top=s[0].pts,w=s.filter(p=>p.pts===top).map(p=>p.name);
  $("#screen").insertAdjacentHTML("beforeend",`<div class="reveal"><span class="label">Grid complete</span><h2>${w.length>1?"It's a tie":"Winners"}: ${w.map(esc).join(" & ")} (${top} squares)</h2></div>`);}
};

/* migrate old saved names: nothing to do, classes keep same keys */
route();
</script>
