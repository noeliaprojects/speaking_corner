<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaking Corner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: quiet hub (search, filters, plain activity cards grouped by type); each activity opens a white, projector-ready slide with teacher tools underneath. One accent colour, one typeface. */
:root{
  --bg:#f7f7f4; --paper:#ffffff; --ink:#1f2427; --muted:#6b7176; --line:#e5e5e0;
  --stamp:#2a6b61; --stamp-soft:#e7f0ed; --ok:#2a6b61; --ok-soft:#e7f0ed; --warn:#8a5a12; --warn-soft:#f6eedf;
  --c-warm:#2a6b61; --c-you:#2a6b61; --c-opinion:#2a6b61; --c-game:#2a6b61;
  --stage:#ffffff; --stage-2:#f4f4f1; --stage-ink:#1f2427; --stage-muted:#6b7176;
  --display:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.narrow{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4.5vw,2.1rem);margin:0;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
h1 span{color:var(--stamp)}
h2{font-size:1.2rem;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:1.08rem;margin:0}
p{margin:0;max-width:65ch}
.sub{color:var(--muted)}
.label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,4vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:.85rem;color:var(--muted)}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button.primary,.btn.primary{background:var(--ink);color:var(--paper)}
button.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
button.ghost,.btn.ghost{border-color:var(--line);font-weight:600;background:var(--paper)}
button.ghost:hover,.btn.ghost:hover{border-color:var(--muted)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
textarea,select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:120px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 170px}
a{color:inherit}
.back{align-self:flex-start;text-decoration:none;font-weight:600;color:var(--muted)}
.back:hover{color:var(--ink)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top nav{display:flex;gap:8px;flex-wrap:wrap}
.classpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.classpick select{width:auto;min-width:0;max-width:100%;padding:7px 10px;font-weight:700}
.filters{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips{align-items:center}
.chips button{padding:5px 12px;border-width:1px;border-color:var(--line);font-weight:500;border-radius:99px;font-size:.92rem}
.grsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grsel select{width:auto;max-width:100%;background:var(--paper);padding:7px 12px;border-radius:99px;font-weight:500}
.focus{background:var(--stamp-soft);border-radius:8px;padding:10px 12px;font-size:.95rem}
.chips-l{font-size:.85rem;color:var(--muted);margin-right:4px}
.search input{background:var(--paper);padding:12px 14px;font-size:1rem;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gram{display:flex;gap:6px;flex-wrap:wrap}
.gram span{font-size:.75rem;font-weight:600;color:var(--stamp);background:var(--stamp-soft);border-radius:99px;padding:2px 9px}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.top nav{align-items:center}
.top .classpick{padding:4px 4px 4px 12px;border-radius:8px}

/* activity cards */
.cat{display:flex;flex-direction:column;gap:12px}
.cat-h{display:flex;align-items:baseline;gap:10px}
.cat-h i{display:none}
.cat-h h2{font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.act{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;min-width:0;transition:border-color .15s,box-shadow .15s}
.act:hover{border-color:#cfcfc8;box-shadow:0 2px 10px rgba(30,36,40,.06)}
.act h3{font-weight:700;letter-spacing:-.01em}
.act h3{padding-right:4px}
.act p{font-size:.93rem;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.lvl{font-size:.75rem;font-weight:600;padding:1px 0;color:var(--ink)}
.fmt{font-size:.75rem;font-weight:500;color:var(--muted)}
.flag{font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:99px}
.flag.print{background:var(--warn-soft);color:var(--warn)}
.flag.done{background:var(--ok-soft);color:var(--ok)}
.flag.app{background:var(--stamp-soft);color:var(--stamp)}
.c-warm{--cc:var(--c-warm)}.c-you{--cc:var(--c-you)}.c-opinion{--cc:var(--c-opinion)}.c-game{--cc:var(--c-game)}
.empty{color:var(--muted);padding:20px;text-align:center}

/* banners */
.banner{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:700}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.print{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}

/* stage (deliberately one dark look in both themes: it is projected) */
.stage{position:relative;background:var(--stage);border:1px solid var(--line);box-shadow:0 1px 3px rgba(30,36,40,.05);color:var(--stage-ink);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  padding:clamp(18px,4.5vw,52px);min-height:min(66vh,560px);gap:18px;--acc:#2a6b61;--tint:#f4f4f1}
@media (min-width:760px){.stage{aspect-ratio:16/9;min-height:0}}

.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;padding:max(4vh,24px) max(5vw,24px)}
.s-eyebrow{font-size:clamp(.7rem,1.3vw,.9rem);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--stage-muted);display:flex;justify-content:space-between;gap:10px}
.s-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.4vw,26px);min-height:0}
.s-title{font-family:var(--display);font-weight:800;letter-spacing:-.025em;font-size:clamp(1.8rem,5vw,3.6rem);line-height:1.05;text-wrap:balance;margin:0}
.s-instr{font-size:clamp(1.05rem,2.3vw,1.7rem);line-height:1.35;max-width:46ch;color:var(--stage-ink)}
.s-ex{font-size:clamp(.95rem,1.8vw,1.3rem);color:var(--stage-muted);border-left:4px solid var(--acc);padding-left:14px;max-width:60ch}
.s-big{font-size:clamp(1.8rem,5.4vw,4.2rem);font-weight:700;letter-spacing:-.02em;line-height:1.1;text-wrap:balance;margin:0}
.s-big.mid{font-size:clamp(1.5rem,4.2vw,3.2rem)}
.s-q{margin:0;padding-left:1.1em;font-size:clamp(1rem,2vw,1.5rem);display:flex;flex-direction:column;gap:4px;color:var(--stage-ink)}
.s-q li::marker{color:var(--acc)}
.s-ph{display:flex;flex-wrap:wrap;gap:8px}
.s-ph span{background:var(--stage-2);border:0;border-radius:99px;padding:6px 14px;font-size:clamp(.8rem,1.5vw,1.1rem);font-weight:500;color:var(--stage-ink)}
.s-ph b{color:var(--stage-muted);font-weight:600;font-size:.8em;letter-spacing:.06em;text-transform:uppercase;align-self:center;margin-right:4px}
.s-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(10px,2vw,24px);align-items:stretch}
.s-opt{background:var(--tint);border-radius:14px;padding:clamp(14px,2.5vw,28px);display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0}
.s-opt small{font-size:clamp(.7rem,1.3vw,.95rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.s-opt div{font-size:clamp(1.2rem,3.3vw,2.5rem);font-weight:700;line-height:1.15;text-wrap:balance}
.s-opt img,.s-img img{width:100%;height:auto;max-height:52vh;object-fit:cover;border-radius:10px;max-width:100%}
.s-opt.ph{position:relative;padding:0;overflow:hidden;justify-content:flex-end}
.s-opt.ph img{position:absolute;inset:0;width:100%;height:100%;max-height:none;border-radius:0;object-fit:cover}
.s-opt.ph .cap{position:relative;padding:clamp(40px,6vw,80px) clamp(12px,2vw,22px) clamp(10px,1.6vw,18px);background:linear-gradient(to top,rgba(10,14,30,.82),rgba(10,14,30,0));display:flex;flex-direction:column;gap:4px}
.s-opt.ph .cap small{color:#fff;opacity:.85}
.s-opt.ph .cap div{color:#fff;font-size:clamp(1.05rem,2.6vw,2rem)}
.s-vs.ph{flex:1 1 0;min-height:200px}
.s-or{align-self:center;font-weight:700;color:var(--stage-muted);font-size:clamp(1rem,2.4vw,1.8rem)}
.s-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.4vw,14px)}
.s-tiles div{background:var(--tint);border-radius:12px;padding:clamp(10px,1.8vw,20px);font-size:clamp(.9rem,2vw,1.45rem);font-weight:600;line-height:1.2;display:flex;align-items:center;min-height:clamp(56px,9vw,110px)}
.s-tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.s-tiles div.ptile{position:relative;padding:0;overflow:hidden;align-items:flex-end;min-height:clamp(110px,15vw,220px)}
.s-tiles div.ptile.sm{min-height:clamp(70px,8vw,110px)}
.ptile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ptile span{position:relative;width:100%;padding:clamp(22px,3vw,40px) clamp(8px,1.2vw,14px) clamp(6px,1vw,12px);background:linear-gradient(to top,rgba(10,14,30,.85),rgba(10,14,30,0));color:#fff}
.s-tiles.five div.ptile span{font-size:clamp(.7rem,1.3vw,1rem)}
.s-tiles.n2 div,.s-tiles.n3 div{font-size:clamp(1.1rem,2.8vw,2.1rem);min-height:clamp(90px,16vw,220px)}
.s-tiles.n4 div{font-size:clamp(1rem,2.4vw,1.8rem);min-height:clamp(70px,11vw,150px)}
.s-tiles.five div{font-size:clamp(.78rem,1.6vw,1.15rem);min-height:clamp(48px,7vw,90px)}
.s-stat{font-size:clamp(1.4rem,4.2vw,3.2rem);font-weight:700;line-height:1.12;text-wrap:balance;margin:0}
.s-tag{align-self:flex-start;font-size:clamp(.72rem,1.3vw,.95rem);font-weight:600;color:var(--acc);background:var(--stamp-soft);border-radius:99px;padding:4px 12px}
.s-split{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(14px,3vw,36px);align-items:center}
.s-no{display:flex;flex-direction:column;gap:6px}
.s-no span{font-size:clamp(1rem,2.4vw,1.8rem);font-weight:800;color:var(--stage-muted);text-decoration:line-through;text-decoration-color:var(--acc);text-decoration-thickness:3px}
.s-cover{position:absolute;inset:0;background:var(--stage);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:2}
.s-cover .s-title{color:var(--acc)}
.s-overlay{position:absolute;top:clamp(10px,2vw,20px);right:clamp(10px,2vw,20px);display:flex;gap:8px;z-index:3}
.s-pill{background:var(--stage-2);color:var(--stage-ink);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-family:var(--mono);font-weight:700;font-size:clamp(1rem,2.2vw,1.6rem);font-variant-numeric:tabular-nums}
.s-pill.low{background:#c9381f;color:#fff;border-color:#c9381f}
.s-pick{position:absolute;left:50%;bottom:clamp(14px,3vw,28px);transform:translateX(-50%);background:var(--acc);color:#fff;box-shadow:0 6px 20px rgba(27,35,64,.2);border-radius:14px;padding:10px 22px;font-weight:700;font-size:clamp(1.2rem,3vw,2.2rem);z-index:3;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.s-up{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#fff;color:#c9381f;font-family:var(--display);font-size:clamp(2rem,8vw,6rem);text-align:center;animation:flash .5s ease-in-out 4 alternate}
@keyframes flash{from{color:#c9381f}to{color:#f4c7bd}}
@media (prefers-reduced-motion:reduce){.s-up{animation:none}}
.s-nav{position:absolute;bottom:14px;right:14px;display:none;gap:8px;z-index:4}
.stage:fullscreen .s-nav{display:flex}
.s-nav button{background:var(--stage-2);color:var(--stage-ink);border:1px solid var(--line);padding:10px 16px;opacity:.7}
.s-nav button:hover{opacity:1}
@media (max-width:640px){.s-vs{grid-template-columns:1fr}.s-or{justify-self:center}.s-tiles,.s-tiles.five{grid-template-columns:repeat(2,minmax(0,1fr))!important}.s-split{grid-template-columns:1fr}}

/* controls under stage */
.ctrl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ctrl .count{font-family:var(--mono);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button,.tools select{padding:8px 12px;font-size:.92rem}
.tools select{width:auto;border-width:2px;border-color:var(--line);font-weight:700}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:7px 12px;border-width:1px;border-color:var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.guide p{font-size:1rem}
.guide ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

/* games (interactive) */
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.rules b{color:var(--ink)}
.chip{display:inline-block;font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--stamp-soft);color:var(--stamp)}
.envelope{border:2px dashed var(--line);border-radius:14px;min-height:170px;display:grid;place-items:center;text-align:center;padding:20px;user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:none}
.envelope .closed{display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted)}
.stamp{font-family:var(--display);font-weight:800;color:var(--stamp);border:3px solid var(--stamp);padding:6px 14px;border-radius:6px;transform:rotate(-6deg);font-size:1rem;letter-spacing:.05em;display:inline-block}
.word{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,8vw,3rem);color:var(--stamp);word-break:break-word}
.topic{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;line-height:1.2;text-wrap:balance}
.timer{font-family:var(--mono);font-weight:700;font-size:clamp(3rem,14vw,5.5rem);font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.timer.low{color:var(--stamp)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s linear}
.scores{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.scores li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.scores li.lead{background:var(--stamp-soft);font-weight:800}
.scores .pts{font-family:var(--mono);font-weight:700}
.reveal{background:var(--ok-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{padding:8px 12px;border-width:1px;font-weight:600}
.pick button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.bank{display:flex;flex-direction:column;gap:12px;margin-top:12px}
details.more summary{cursor:pointer;font-weight:800}
.stg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cell{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 6px;min-height:76px;font-weight:800;font-size:clamp(.72rem,2.6vw,.95rem);line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;word-break:break-word}
.cell:hover:not(:disabled){border-color:var(--ink)}
.cell.done{background:var(--pc);border-color:var(--pb);opacity:1;cursor:default}
.cell.used{opacity:.45}
.cell small{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--pb,var(--ok))}
.prompts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:1.05rem}
.turn{display:flex;align-items:center;gap:8px;font-weight:800}
.dot{width:14px;height:14px;border-radius:50%;background:var(--pb);flex:none}
.p0{--pb:#d8432f;--pc:#fbe3df}.p1{--pb:#1f7fb8;--pc:#dcedf8}.p2{--pb:#2f8a5b;--pc:#dff2e7}.p3{--pb:#7a4fd0;--pc:#ece4fb}.p4{--pb:#c27a0e;--pc:#fbeed6}.p5{--pb:#b0306f;--pc:#f8dfeb}.p6{--pb:#0f8a8a;--pc:#d8f1f0}.p7{--pb:#5b6478;--pc:#e3e6ee}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1;padding:9px 12px;font-weight:700;background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.clist li{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--bg)}
.clist li>div:first-child{display:flex;flex-direction:column;min-width:0}
.clist button{padding:7px 12px}
.clist button.warn{background:var(--stamp);border-color:var(--stamp);color:#fff}
.prompt{background:var(--bg);border-radius:10px;padding:12px;font-family:var(--mono);font-size:.82rem;white-space:pre-wrap;word-break:break-word}
@media (max-width:420px){.stg{gap:6px}.cell{min-height:68px;padding:8px 4px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ---- calm hub ---- */
body{font-weight:300;font-size:15.5px;line-height:1.55}
h1{font-weight:600;letter-spacing:-.03em;font-size:clamp(1.4rem,4vw,1.9rem)}
h3,b,strong{font-weight:500}
.top{padding-bottom:4px}
.top nav{display:flex;align-items:center;gap:18px}
.link{background:none;border:0;padding:0;font:inherit;font-weight:400;color:var(--muted);text-decoration:none;cursor:pointer}
.link:hover{color:var(--ink)}
.top .classpick{background:none;border:0;padding:0;gap:6px}
.top .classpick .label{display:none}
.top .classpick select{border:0;background:var(--stage-2);border-radius:8px;padding:7px 10px;font-weight:400}
.filters{gap:10px}
.search input{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 16px;font-weight:300}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fsel select{width:auto;max-width:100%;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:400;font-size:.9rem;color:var(--ink)}
#list{display:flex;flex-direction:column;gap:34px;margin-top:6px}
.cat{gap:14px}
.cat h2{font-size:1rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink)}
.cat h2 span{color:var(--muted);font-weight:300;margin-left:4px}
.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.act{border:0;background:var(--paper);border-radius:12px;padding:16px 18px;gap:6px;box-shadow:0 1px 2px rgba(30,36,40,.04)}
.act:hover{box-shadow:0 4px 14px rgba(30,36,40,.08)}
.act h3{font-size:1rem;font-weight:500;letter-spacing:-.01em}
.act p{font-size:.9rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act .meta{font-size:.78rem;color:var(--muted);margin-top:auto;padding-top:4px;display:block}
.m-print{color:var(--warn);font-weight:500}.m-done{color:var(--ok);font-weight:500}
.s-title{font-weight:600}.s-big{font-weight:500}.s-opt div,.s-stat{font-weight:500}
.s-instr{font-weight:300}
button,.btn{font-weight:500}
.label{font-weight:500}

/* ---- speech-bubble cards ---- */
.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.act{position:relative;border:1.5px solid var(--ink);border-radius:18px 18px 18px 4px;padding:18px 20px 16px;gap:8px;box-shadow:none;background:var(--paper);transition:box-shadow .15s,border-color .15s}
.act:hover{border-color:var(--stamp);box-shadow:5px 5px 0 var(--stamp-soft),5px 5px 0 1.5px var(--stamp)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.lvpill{font-size:.8rem;font-weight:600;color:#fff;background:#2f5bea;border-radius:99px 99px 99px 3px;padding:4px 11px;white-space:nowrap;letter-spacing:.01em}
.kind{font-size:.78rem;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.act h3{font-size:1.08rem;font-weight:600}
.act p{font-size:.9rem;color:#3d4347}
.act .meta{padding-top:10px}
@media (prefers-reduced-motion:reduce){.act{transition:none}}
.chips button{font-weight:400;padding:6px 14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stage.upper .s-body,.stage.upper .s-ph,.stage.upper .s-cover,.stage.upper .s-pick{text-transform:uppercase;letter-spacing:.02em}

/* ---- brand title ---- */
.brand{font-family:"Bricolage Grotesque","Lexend",system-ui,sans-serif;font-weight:800;font-size:clamp(2.1rem,6.5vw,3.4rem);letter-spacing:-.035em;line-height:.95}
.brand span{color:#2f5bea;position:relative;display:inline-block}
.brand span::after{content:"";position:absolute;right:-.28em;top:.06em;width:.2em;height:.2em;background:#2f5bea;border-radius:50% 50% 50% 0}
/* ---- printable cards ---- */
#printArea{display:none}
@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff!important;padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .pa-page{width:194mm;height:280mm;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);break-after:page;page-break-after:always}
  .pa-page:last-child{break-after:auto;page-break-after:auto}
  .pc{border:.3mm dashed #888;margin:-.15mm;padding:5mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3mm;text-align:center;overflow:hidden;position:relative;font-family:"Lexend",system-ui,sans-serif;color:#1f2427}
  .pc-empty{border-color:transparent}
  .pc-img{width:100%;flex:1 1 0;min-height:0;object-fit:cover;border-radius:2mm}
  .pa-noimg .pc-img{display:none}
  .pc-txt{display:flex;flex-direction:column;gap:2mm;align-items:center;flex:0 0 auto;max-width:100%}
  .pa-noimg .pc-txt{flex:1;justify-content:center}
  .pc-main{margin:0;font-weight:600;line-height:1.15;font-size:calc(10pt + 60pt / var(--rows) / var(--cols) * 1.6);overflow-wrap:anywhere}
  .pc-sub,.pc-no,.pc-ans{margin:0;font-size:calc(8pt + 18pt / var(--rows) / var(--cols) * 1.6);color:#555}
  .pc-no{color:#b0321f}
  .pc-foot{position:absolute;bottom:2mm;right:3mm;font-size:6pt;color:#999}
  .pc-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:3mm;align-items:center;width:100%;height:100%}
  .pc-vs div{display:flex;flex-direction:column;gap:2mm;align-items:center;min-width:0;justify-content:center}
  .pc-vs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2mm}
  .pc-vs b{font-size:calc(9pt + 34pt / var(--rows) / var(--cols) * 1.6);font-weight:600}
  .pc-vs i{font-style:normal;color:#888}
  .pc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2mm;width:100%}
  .pc-list li{display:flex;align-items:center;gap:3mm;text-align:left;font-size:calc(9pt + 30pt / var(--rows) / var(--cols) * 1.6)}
  .pc-list img{width:30%;aspect-ratio:4/3;object-fit:cover;border-radius:2mm}
  .pa-up .pc-txt,.pa-up .pc-vs b,.pa-up .pc-list span{text-transform:uppercase}
}
</style>

at happened next? Who was with you?"], "cards": ["been on TV", "met a famous person", "broken a bone", "eaten something really strange", "slept outside", "lost your phone", "won a competition", "sung in public", "got lost in a city", "fallen asleep in class or at work", "seen a ghost", "cried at a film"], "guide": {"ind": ["The student asks you; you answer yes and they ask three follow-ups. Then swap.", "They decide: truth or lie?", "Highlight the switch: Have you ever…? → When did you…?"], "pair": ["Partners take turns. The speaker secretly decides to tell the truth or lie.", "The listener asks three past simple questions and guesses.", "1 point for a correct guess, 1 point for a successful lie."], "grp": ["One student in the hot seat. The class asks follow-ups (max five).", "Everyone votes: truth or lie?", "Reveal and choose the next student."]}, "end": "Who was the best liar? What was the most surprising true story?", "ages": ["12-14", "14-16", "16-18", "19-25", "adults"], "books": ["Game Changer 4 · U6–8"]}, {"id": "epic-weekend", "name": "Epic Weekend", "cat": "you", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Past simple", "Narrative tenses"], "focus": "Past simple for a sequence of events: First I…, then I…, after that…", "desc": "Tell the story of your weekend, but it must include three surprising things.", "instr": "Tell the story of your last weekend. It must include the three things on the card! Make it believable. The others ask questions.", "ph": ["On Saturday morning I…", "Then, suddenly,…", "After that, we…", "In the end,…"], "cards": [{"t": "Last weekend…", "sub": ["a llama", "your old teacher", "a broken umbrella"]}, {"t": "Last weekend…", "sub": ["a helicopter", "a birthday cake", "your grandmother"]}, {"t": "Last weekend…", "sub": ["a famous singer", "a flat tyre", "100 euros"]}, {"t": "Last weekend…", "sub": ["a lost dog", "a wedding", "the police"]}, {"t": "Last weekend…", "sub": ["a karaoke bar", "a fir er and build a class story from it.", "Highlight the two tenses on the board."]}, "end": "What were you doing yesterday at 8 pm?", "ages": ["9-12", "12-14", "14-16", "16-18", "19-25", "adults"], "books": ["Game Changer 2 · U6–7"]}, {"id": "the-backstory", "name": "The Backstory", "cat": "opinion", "lv": ["B1", "B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Past perfect", "Narrative tenses"], "focus": "Past perfect for what happened before: She had already…, He hadn't…", "desc": "Something happened. Invent what had happened before to explain it.", "instr": "Explain the situation: what had happened before? Give at least three possible explanations, then choose the best one.", "ph": ["Maybe she had…", "He hadn't… so…", "By the time…, they had already…", "It turned out that…"], "cards": ["When Ana got home, she was absolutely furious.", "Tom arrived at work in his pyjamas.", "The teacher came into the class and started laughing.", "When we arrived at the party, everybody had gone.", "He opened the fridge and screamed.", "She was crying at the airport, but she was smiling.", "The dog was sitting on the sofa looking very guilty.", "My neighbour knocked on my door at midnight holding a cake.", "The whole team was singing in the office on Monday morning.", "When I got to the cinema, I realised I was alone.", "My grandmother suddenly bought a motorbike.", "The chef walked out of his own restaurant."], "guide": {"ind": ["The student gives three explanations with the past perfect.", "You choose the best one and ask questions about it.", "Correct: 'had + past participle' for the earlier action."], "pair": ["Partners compete: who can give the most original explanation?", "Then they tell the full story in order.", "Swap who starts."], "grp": ["Show the situation. Groups have one minute to invent the backstory.", "Each group tells theirs; the class votes for the best.", "Write a perfect example on the board."]}, "end": "Which backstory would make the best film?", "ages": ["14-16", "16-18", "19-25", "adults"]}, {"id": "back-in-my-day", "name": "Back in My Day…", "cat": "you", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Used to / would", "Past simple"], "focus": "used to / would for past habits: We used to…, We didn't use to…, We would…", "desc": "It's the year 2080 and you're very old. Tell the young people how life used to be in the 2020s.", "instr": "It's 2080 and you're a grandparent. Tell the 'kids' how things used to be when you were young. Then talk about your real childhood.", "ph": ["Back in my day, we used to…", "We didn't use to…", "Every weekend we would…", "Can you believe we used to…?"], "ex": "Back in my day, we used to carry our phones in our pockets! And we would wait 5 minutes for a pizza delivery. Terrible!", "cards": ["Phones", "School", "Transport", "Shopping", "Music", "Money", "Holidays", "TV and films", "Food", "Work", "Games and toys", "Friends and social media"], "q": ["How did it use to be in YOUR childhood?", "What do you miss?"], "guide": {"ind": ["The student plays the 2080 grandparent; you're the shocked grandchild.", "Then talk about their real childhood: 'When I was a child, I used to…'", "Note the difference between used to and would."], "pair": ["One partner is the 2080 grandparent, the other asks questions.", "Swap, then compare real childhoods.", "Find three things you both used to do."], "grp": ["Show the topic. Volunteers play the grandparent for one minute.", "The class reacts and asks questions.", "Finish with a real 'When I was a child…' round."]}, "end": "What do you think people in 2080 will find funny about us?", "ages": ["14-16", "16-18", "19-25", "adults"]}, {"id": "fortune-teller", "name": "Fortune Teller", "cat": "game", "lv": ["A2", "B1", "B2"], "fmts": ["pair", "grp"], "kind": "single", "gram": ["Future forms"], "focus": "will / going to / might for predictions: You will…, You're going to…, You might…", "desc": "Read your partner's future. Make the predictions as dramatic as possible!", "instr": "You're a fortune teller. Look into the crystal ball and predict your partner's future about this topic. Your partner reacts!", "ph": ["I can see that you will…", "You're going to… very soon.", "You might… but be careful!", "You won't… until…"], "cards": ["Love", "Money", "Travel", "Your next job", "This weekend", "Your next birthday", "A big surprise", "Your future house", "A new friend", "Your health", "Your next holiday", "Something you'll lose"], "guide": {"ind": ["You're the fortune teller first, then the student.", "Push for three predictions per topic.", "Point out 'going to' when there's evidence: 'Look at the clouds! It's going to rain.'"], "pair": ["Partners take turns being the fortune teller.", "The 'client' must react: 'Really? When will that happen?'", "At the end, each says which prediction they hope comes true."], "grp": ["Choose a fortune teller and a client to come to the front.", "The class can add 'extra visions'.", "Rotate every topic."]}, "end": "Which prediction do you hope will come true?", "ages": ["9-12", "12-14", "14-16", "16-18", "19-25", "adults"], "books": ["Game Changer 4 · U1"]}, {"id": "sorry-ill-be-busy", "name": "Sorry, I'll Be Busy", "cat": "game", "lv": ["B1", "B2"], "fmts": ["pair", "grp"], "kind": "single", "gram": ["Future continuous", "Future forms"], "focus": "Future continuous for actions in progress in the future: I'll be …ing at 6.", "desc": "Someone keeps inviting you to boring things. Invent creative reasons why you'll be busy.", "instr": "Your partner invites you to this. You don't want to go! Say what you'll be doing at that time. Be creative. Your partner suggests another time…", "ph": ["Sorry, at that time I'll be…ing.", "I'd love to, but I'll be…ing all day.", "What about…? / How about…?", "No, I'll be…ing then too!"], "cards": ["Can you help me move house on Saturday at 9 am?", "Do you want to come to my cousin's poetry reading tonight?", "Can e their best advice.", "Read a few aloud; the class votes.", "Highlight should / ought to / had better on the board."]}, "end": "What's the best advice anyone has ever given you?", "ages": ["14-16", "16-18", "19-25", "adults"], "books": ["Game Changer 3 · U4", "Game Changer 4 · U2"]}, {"id": "alien-rulebook", "name": "The Alien Rulebook", "cat": "game", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Modals: advice & obligation"], "focus": "Rules: You have to…, You must…, You mustn't…, You don't have to…, You can…", "desc": "An alien is coming to live in your town. Teach it the rules nobody explains.", "instr": "An alien has just arrived and wants to fit in. Explain the rules for this place: what you have to do, what you mustn't do and what you don't have to do.", "ph": ["You have to…", "You mustn't…", "You don't have to…, but…", "You're allowed to… / You can…"], "cards": ["At a Spanish family dinner", "On the metro", "In a lift", "At a wedding", "At the beach", "At school", "In a WhatsApp group", "At the cinema", "At the gym", "At a job interview", "At a birthday party", "In a library"], "guide": {"ind": ["The student explains the rules; you're the confused alien and ask 'Why?'", "Ask for one rule that's different in another country.", "Contrast mustn't vs don't have to."], "pair": ["One partner is the alien and asks questions; the other explains.", "Swap every card.", "Find a rule that you think is silly."], "grp": ["Show the place. The class gives rules; you write them in three columns (have to / mustn't / don't have to).", "Ask: which rule is the most important?", "Vote on the silliest rule."]}, "end": "Which rule would the alien find the strangest?", "ages": ["9-12", "12-14", "14-16", "16-18", "19-25", "adults"], "books": ["Game Changer 4 · U3"]}, {"id": "whose-bag", "name": "Whose Bag Is This?", "cat": "game", "lv": ["B1", "B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Modals of deduction"], "focus": "Deduction: It must be…, It might/could be…, It can't be…", "desc": "Look at what's inside a lost bag and work out who it belongs to.", "instr": "This bag was found on a train. Look at what's inside. Who does it belong to? What do they do? Use must, might and can't.", "ph": ["It must belong to…", "It might be… / It could be…", "It can't be… because…", "He/She probably…"], "cards": [{"t": "Lost bag #1", "sub": ["a whistle", "a stopwatch", "energy bars", "a list of names"]}, {"t": "Lost bag #2", "sub": ["dog biscuits", "a ball", "a lead", "a map of the park"]}, {"t": "Lost bag #3", "sub": ["a passport", "a phrase book", "sun cream", "a camera"]}, {"t": "Lost bag #4", "sub": ["red pens", "30 exam papers", "a coffee flask", "headache tablets"]}, {"t": "Lost bag #5", "sub": ["a baby bottle", "nappies", "a toy giraffe", "an energy drink"]}, {"t": "Lost bag #6", "sub": ["a wedding invitation", "a tie", "a speech", "tissues"]}, {"t": "Lost bag #7", "sub": ["a stethoscope", "chewing gum", "a phone charger", "a novel"]}, {"t": "Lost bag #8", "sub": ["paint brushes", "a sketchbook", "a croissant", "a train ticket to Paris"]}, {"t": "Lost bag #9", "sub": ["a ring box", "flowers", "a restaurant booking", "a very nervous note"]}, {"t": "Lost bag #10", "sub": ["a microphone", "a setlist", "earplugs", "a guitar pick"]}], "guide": {"ind": ["The student makes at least three deductions; you challenge them ('Are you sure?').", "Ask them to describe the owner's day.", "Contrast must / might / can't with how sure they are."], "pair": ["Partners make deductions and agree on one 'owner profile'.", "Compare with another pair.", "Swap who starts."], "grp": ["Show the bag. Groups write a profile of the owner in two minutes.", "Groups present; the class decides which is most logical.", "Write the best deductions on the board."]}, "end": "What would someone deduce about you from YOUR bag?", "ages": ["12-14", "14-16", "16-18", "19-25", "adults"]}, {"id": "what-must-have-happened", "name": "What Must Have Happened?", "cat": "opinion", "lv": ["B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Past modals"], "focus": "Past deduction: must have / might have / can't have + past participle; criticism: should have…", "desc": "Mysterious situations: work out what happened and who should have done things differently.", "instr": "What must have happened? Give three possible explanations, then say what someone should or shouldn't have done.", "ph": ["Someone must have…", "They might have… / could have…", "She can't have… because…", "He should have… / shouldn't have…"], "cards": ["The kitchen is flooded and the dog is wet.", "Your friend didn't come to your birthday party.", "The car has a parking ticket and a broken mirror.", "Your phone has 47 missed calls from your mum.", "The cake in the fridge has a big bite out of it.", "Your neighbour's garden is full of footprints.", "The teacher came to class with one shoe.", "All the lights in the office were on on Monday morning.", "Your plant is dead after your holiday.", "There's a stranger asleep on your sofa.", "Your laptop screen is cracked.", "The pizza arrived two hours late and cold."], "guide": {"ind": ["The student gives three deductions, then one criticism.", "Ask them to tell the 'true story' in the end.", "Contrast must have (sure) vs might have (possible)."], "pair": ["Partners take turns making deductions until one sounds right.", "Then they decide who should have done what.", "Share with the class."], "grp": ["Show the situation. Groups think of the most logical and the funniest explanation.", "Groups present; vote for each.", "Correct past participles on the board."]}, "end": "Tell us about something you should have done differently this week.", "ages": ["16-18", "19-25", "adults"]}, {"id": "corrupt-a-wish", "name": "Corrupt a Wish", "cat": "game", "lv": ["B1", "B2", "C1"], "fmts": ["pair", "grp"], "kind": "single", "gram": ["Wish / If only", "Second conditional"], "focus": "I wish I had/could…, If only…, I wish I hadn't… — and the genie's twist: 'Granted, but…'", "desc": "Make a wish. The next person grants it… but adds a terrible twist.", "instr": "Make a wish about the topic: 'I wish I…'. The next student is the genie: 'Granted, but…' and adds a twist. Then they make a new wish.", "ph": ["I wish I had / could / were…", "If only I…", "Granted, but…", "Now I wish I hadn't wished for that!"], "ex": "A: I wish I could fly. B: Granted, but you can only fly at 2 km per hour. B: I wish I were rich. C: Granted, but all your money is in coins.", "cards": ["Money", "Free time", "Being famous", "Superpowers", "Your house", "School or work", "Your appearance", "Food", "Holidays", "Your phone", "The weather", "Talents"], "guide": {"ind": ["You're the genie first. The student wishes, you twist it. Then swap.", "Finish with a real regret: 'I wish I hadn't…'", "Point out: wish + past simple (present), wish + past perfect (past)."], "pair": ["Partners take turns wishing and twisting for 2 minutes per topic.", "Count the twists: the funniest pair shares one.", "Swap topics."], "grp": ["Students sit in a circle. The wish travels round the class.", "Anyone who can't think of a twist in 5 seconds is out.", "Vote for the cruellest twist."]}, "end": "What's one thing you really wish you could change about your week?", "ages": ["12-14", "14-16", "16-18", "19-25", "adults"]}, {"id": "it-wasnt-me", "name": "It Wasn't Me!", "cat": "game", "lv": ["B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Passive voice", "Past modals"], "focus": "Passive to avoid blame: The vase was broken…, The cake has been eaten…, It must have been…", "desc": "Something went wrong and you don't want to be blamed. Explain it with the passive.", "instr": "Your parent, boss or flatmate is angry. Explain what happened without saying it was you! Use the passive.", "ph": ["It was broken when I…", "Mistakes were made…", "The… has been… by someone", "It must have been… by the cat"], "cards": ["The vase is broken.", "All the biscuits have been eaten.", "The car is scratched.", "The homework is missing.", "The plant is dead.", "The TV remote has disappeared.", "The walls have been painted pink.", "The wifi password has been changed.", "Your sister's jumper is ruined.", "The boss's chair is broken.", "The dog has been dyed blue.", "The fridge door was left open all night."], "guide": {"ind": ["You're the angry parent or boss and ask questions; the student defends themselves with the passive.", "Swap roles.", "Show how the passive hides who did it."], "pair": ["One partner accuses, the other avoids the blame.", "The accuser decides: guilty or not guilty?", "Swap."], "grp": ["Groups play a family. 'Parents' ask questions; 'siblings' blame each other using the passive.", "Act out the best one for the class.", "Write the best passive excuses on the board."]}, "end": "What's the best excuse you've ever heard?", "ages": ["9-12", "12-14", "14-16", "16-18", "19-25", "adults"]}, {"id": "made-built-written", "name": "Made, Built, Written…", "cat": "warm", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "reveal": true, "revealTag": "Passive quiz · say the full sentence", "ansLabel": "The answer", "gram": ["Passive voice"], "focus": "Past passive with by: It was painted by…, It was invented by…", "desc": "A passive quiz: who made it? Say the full sentence before the answer is revealed.", "instr": "Who made it? Answer with a full passive sentence: 'It was painted by…'. Then tell your partner one more fact you know.", "ph": ["It was painted by…", "It was written by…", "It was invented / discovered by…", "I think it was built in…"], "cards": [{"t": "The Mona Lisa / paint", "ans": "It was painted by Leonardo da Vinci."}, {"t": "The Sagrada Família / design", "ans": "It was designed by Antoni Gaudí."}, {"t": "Harry Potter / write", "ans": "It was written by J.K. Rowling."}, {"t": "Penicillin / discover", "ans": "It was discovered by Alexander Fleming in 1928."}, {"t": "The World Wide Web / invent", "ans": "It was invented by Tim Berners-Lee in 1989."}, {"t": "Guernica / paint", "ans": "It was painted by Pablo Picasso in 1937."}, {"t": "Romeo and Juliet / write", "ans": "It was written by William Shakespeare."}, {"t": "Radium / discover", "ans": "It was discovered by Marie and Pierre Curie in 1898."}, {"t": "The theory of relativity / develop", "ans": "It was developed by Albert Einstein."}, {"t": "Don Quixote / write", "ans": "It was written by Miguel de Cervantes."}], "guide": {"ind": ["The student answers in a full passive sentence before you reveal.", "Ask: 'Where was it made? When?' to get more passives.", "Then ask them to make a quiz question for you."], "pair": ["Pairs answer before each reveal; one point per correct full sentence.", "After the quiz, each pair writes two new questions for another pair.", "Swap questions."], "grp": ["Teams answer on mini whiteboards: only full passive sentences score.", "Reveal and give points.", "Teams invent a question for the other team."]}, "end": "Make a passive question about your city for a partner.", "ages": ["12-14", "14-16", "16-18", "19-25", "adults"]}, {"id": "lazy-millionaire", "name": "The Lazy Millionaire", "cat": "you", "lv": ["B1", "B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Causative have/get"], "focus": "Causative: I have my… done, I get someone to…, I had it repaired", "desc": "You're a millionaire who never does anything yourself. Explain how you get things done.", "instr": "You're a very lazy millionaire. Explain how you get this done — you never do it yourself! Then say what you really do yourself in real life.", "ph": ["I have my… done every…", "I get someone to…", "I had it… last week", "In real life, I… myself."], "cards": ["your hair", "your car", "your house cleaned", "your shopping", "your nails", "your dog", "your photos", "your clothes", "your meals", "your homework or emails", "your garden", "your birthday party"], "guide": {"ind": ["The student plays the millionaire; you're the journalist asking questions.", "Switch to real life: 'When did you last have your hair cut?'", "Compare 'I cut my hair' vs 'I had my hair cut'."], "pair": ["One partner is the millionaire, the other the interviewer.", "Swap, then compare what you do yourselves in real life.", "Who's the laziest?"], "grp": ["Show the card. Volunteers answer as millionaires.", "Then a real-life round: hands up if you do it yourself.", "Write a few causative sentences on the board."]}, "end": "What would you pay someone to do for you if you could?", "ages": ["14-16", "16-18", "19-25", "adults"]}, {"id": "pardon", "name": "Pardon? What Did She Say?", "cat": "game", "lv": ["A2", "B1", "B2"], "fmts": ["grp", "pair"], "kind": "single", "gram": ["Reported speech"], "focus": "Reported speech: She said (that)…, He told me…, She asked if…, He wanted to know…", "desc": "Grandma can't hear well. Repeat what people said using reported speech.", "instr": "Student A says the sentence. Student B is grandma and says 'Pardon?' Student C reports it: 'She said that…'. Watch the tenses!", "ph": ["She said (that)…", "He told me (that)…", "She asked if…", "He wanted to know where…"], "cards": ["\"I've lost my keys again!\"", "\"I'm going to Paris tomorrow.\"", "\"Are you coming to my party?\"", "\"I can't find my glasses.\"", "\"I'll call you later.\"", "\"Where did you buy that hat?\"", "\"I don't like this soup.\"", "\"We're getting married!\"", "\"Have you seen my cat?\"", "\"I was sleeping when you called.\"", "\"Don't touch the cake!\"", "\"I've never been so tired in my life.\""], "guide": {"ind": ["You say the sentence, play grandma, and the student reports it. Then swap.", "Show the backshift: am → was, will → would, have → had.", "Add a twist: report what someone said to them this week."], "pair": ["Groups of three: speaker, grandma, reporter. Rotate roles every card.", "Grandma can say 'Pardon?' twice: the reporter must say it in a different way the second time.", "Report the funniest sentence to the class."], "grp": ["Choose a speaker and a grandma. The class reports in turns.", "Points for correct tense changes.", "Finish with a gossip round: 'I heard that…'"]}, "end": "Report one thing someone said to you this week.", "ages": ["9-12", "12-14", "14-16", "16-18", "19-25", "adults"]}, {"id": "never-ending-sentence", "name": "The Never-Ending Sentence", "cat": "game", "lv": ["B1", "B2", "C1"], "fmts": ["pair", "grp"], "kind": "single", "timer": 120, "gram": ["Relative clauses"], "focus": "Relative clauses: who, which, that, where, whose, when", "desc": "Build one huge sentence together, adding relative clauses one by one.", "instr": "Continue the sentence by adding a relative clause (who, which, that, where, whose, when). How long can the class make it?", "ph": ["…who…", "…which…", "…where…", "…whose…"], "ex": "This is the man who lives in the house which has a garden where a dog whose name is Max sleeps…", "cards": ["This is the man…", "I found a phone…", "We went to a restaurant…", "She married a millionaire…", "I met a girl…", "They bought a house…", "He has a car…", "I'll never forget the day…", "There's a shop in my town…", "My teacher has a cat…"], "guide": {"ind": ["You and the student take turns adding a clause until it breaks.", "Then say the whole sentence from the beginning.", "Focus on whose and where."], "pair": ["Partners alternate clauses for two minutes.", "Count the clauses. Try to beat your record on the next card.", "Read the final sentence to the class."], "grp": ["Go round the class: each student repeats the sentence and adds a clause.", "If someone forgets, the sentence starts again.", "Write the record sentence on the board."]}, "end": "What's the longest sentence we built?", "ages": ["12-14", "14-16", "16-18", "19-25", "adults"], "books": ["Game Changer 3 · U8"]}, {"id": "most-ever", "name": "The Most… Ever", "cat": "you", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Comparatives & superlatives", "Present perfect"], "focus": "Superlative + present perfect: the best… I've ever…; comparatives to compare answers", "desc": "Talk about the best, worst and strangest things you've ever experienced.", "instr": "Answer with a superlative and the present perfect, then tell the story. Your partner compares: 'Mine was even worse than yours!'", "ph": ["The best… I've ever… was…", "It was the most… I've ever…", "Mine was even… than yours!", "It wasn't as… as…"], "cards": ["the best present you've ever received", "the worst meal you've ever eaten", "the most beautiful place you've ever visited", "the strangest dream you've ever had", "the most embarrassing moment you've ever had", "the longest journey you've ever made", "the best concert you've ever been to", "the most boring film you've ever seen", "the scariest thing you've ever done", "the funniest person you've ever met", "the most expensive thing you've ever bought", "the hardest exam you've ever taken"], "guide": {"ind": ["The student answers and tells the story; you compare with yours.", "Push for comparatives: 'Was it worse than…?'", "Correct 'the most + adjective' and 'I've ever'."], "pair": ["Partners answer and compare: whose was the best/worst?", "Each pair chooses one story to tell the class.", "Swap who starts."], "grp": ["Show the card. Students answer in small groups.", "Each group picks the 'winner' and tells the class.", "Vote for the most extreme story."]}, "end": "What's the best thing that has happened to you this week?", "ages": ["12-14", "14-16", "16-18", "19-25", "adults"], "books": ["Game Changer 4 · U8"]}, {"id": "cant-stand", "name": "Can't Stand, Can't Live Without", "cat": "warm", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Gerunds & infinitives"], "focus": "Verb patterns: love/enjoy/can't stand/don't mind + -ing; want/hope/would like/decide + to", "desc": "Say how you feel about everyday activities and find classmates with the same tastes.", "instr": "How do you feel about this? Use a verb + -ing or + to. Then try to convince your partner to like it as much as you do (or hate it!).", "ph": ["I really enjoy / love…ing", "I can't stand / don't mind…ing", "I'd like to / I'm hoping to…", "I've decided to stop…ing"], "cards": ["getting up early", "cooking for other people", "dancing in public", "waiting in queues", "travelling alone", "talking on the phone", "going to the gym", "doing nothing all day", "shopping for clothes", "learning new apps", "singing in the shower", "camping"], "guide": {"ind": ["The student gives their opinion with two different verb patterns.", "Ask: 'Would you like to… more often?' to get the infinitive.", "Share yours and disagree."], "pair": ["Partners find out who likes each activity more.", "Each tries to convince the other in 30 seconds.", "Find two things you both can't stand."], "grp": ["Show the card. Students move: love it (left), don't mind (middle), can't stand (right).", "Ask people in each group to explain.", "Keep a class 'top 3 most hated' list."]}, "end": "What's something you'd like to start doing?", "ages": ["12-14", "14-16", "16-18", "19-25", "adults"]}, {"id": "heres-the-answer", "name": "Here's the Answer", "cat": "game", "lv": ["A2", "B1", "B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Question forms"], "focus": "Question forms in all tenses: word order, auxiliaries (do/did/have/will), subject questions", "desc": "Jeopardy style: you get the answer, you invent the question.", "instr": "Here's the answer. What was the question? Think of at least two different questions. Then ask your partner one of them for real.", "ph": ["How long have you…?", "When did you…?", "Why do you…?", "Who…? / Which…? / How often…?"], "cards": ["Yes, twice.", "In a small village near the sea.", "Because I was hungry.", "Next Friday at 6.", "My grandmother.", "No, never.", "About three hours.", "By bus.", "A red one.", "Since I was eight.", "Pizza, definitely.", "Only if it's sunny."], "guide": {"ind": ["The student makes two questions for each answer.", "Then ask them one of their questions for real.", "Check auxiliaries and word order."], "pair": ["Partners race: who can make the most correct questions in one minute?", "Then they ask each other one question for real.", "Swap who starts."], "grp": ["Teams write as many questions as they can in one minute.", "One point per correct question; two for a question nobody else has.", "Ask some of the questions for real."]}, "end": "What's the most interesting question you heard today?", "ages": ["12-14", "14-16", "16-18", "19-25", "adults"]}, {"id": "drama-queen", "name": "Drama Queen", "cat": "game", "lv": ["C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "reveal": true, "revealTag": "Inversion · make it dramatic", "ansLabel": "The dramatic version", "gram": ["Inversion"], "focus": "Negative inversion: Never have I…, Not only did…, Hardly had… when…, Under no circumstances…", "desc": "Turn boring sentences into dramatic ones with inversion, then tell a dramatic story.", "instr": "Say this sentence in the most dramatic way, starting with the word in brackets. Then continue the story with one more dramatic sentence!", "ph": ["Never have I…", "Not only did…, but…", "Hardly had… when…", "Under no circumstances will…"], "cards": [{"t": "I have never seen such a mess. (Never…)", "ans": "Never have I seen such a mess!"}, {"t": "She was late and she forgot the present. (Not only…)", "ans": "Not only was she late, but she also forgot the present."}, {"t": "We had just sat down when the fire alarm rang. (Hardly…)", "ans": "Hardly had we sat down when the fire alarm rang."}, {"t": "You must not open this door. (Under no circumstances…)", "ans": "Under no circumstances must you open this door."}, {"t": "I realised the truth only later. (Only later…)", "ans": "Only later did I realise the truth."}, {"t": "I have rarely eaten such a good meal. (Rarely…)", "ans": "Rarely have I eaten such a good meal."}, {"t": "He didn't say a word all evening. (Not once…)", "ans": "Not once did he say a word all evening."}, {"t": "You'll understand when you have children. (Only when…)", "ans": "Only when you have children will you understand."}, {"t": "I had no idea he was a spy. (Little…)", "ans": "Little did I know that he was a spy."}, {"t": "We arrived and it started to rain immediately. (No sooner…)", "ans": "No sooner had we arrived than it started to rain."}], "guide": {"ind": ["The student says the dramatic version before the reveal, with lots of drama.", "Then continue the story with one more inverted sentence.", "Focus on the auxiliary after the adverbial."], "pair": ["Partners take turns: one reads, the other 'dramatises'.", "After each reveal, they add one more line to the story.", "Act out the best story."], "grp": ["Show the sentence. Volunteers perform it like an actor.", "The class checks the grammar on the reveal.", "Groups write a mini-drama with three inversions and perform it."]}, "end": "Tell us about something that happened this week, as dramatically as you can.", "ages": ["16-18", "19-25", "adults"]}, {"id": "what-i-really-mean", "name": "What I Really Mean Is…", "cat": "opinion", "lv": ["B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "gram": ["Cleft sentences"], "focus": "Cleft sentences for emphasis: What I love about… is…, The thing that annoys me is…, It was… that…", "desc": "Give strong opinions with emphasis using cleft sentences.", "instr": "Say what you love and what annoys you about this topic. Start your sentences with 'What I…' or 'The thing that…'.", "ph": ["What I love about… is…", "The thing that drives me crazy is…", "What I don't understand is why…", "It's… that really…"], "cards": ["Mondays", "Your city", "Your phone", "Summer", "Your job or school", "Social media", "Travelling", "Your best friend", "Learning English", "Cooking", "Family dinners", "Weekends"], "guide": {"ind": ["The student gives one positive and one negative cleft sentence per topic.", "Ask 'Why?' and get a second cleft sentence.", "Compare: 'I love…' vs 'What I love is…' — which sounds stronger?"], "pair": ["Partners take turns. The listener must react with a cleft sentence too: 'What surprises me is…'", "Swap every card.", "Share the strongest opinion with the class."], "grp": ["Show the topic. Go round the class: each student adds a cleft sentence without repeating.", "Write the best ones on the board.", "Vote for the most passionate opinion."]}, "end": "What I've learnt today is…", "ages": ["16-18", "19-25", "adults"]}, {"id": "linker-challenge", "name": "Linker Challenge", "cat": "opinion", "lv": ["B1", "B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "timer": 60, "gram": ["Linkers"], "focus": "Linkers and discourse markers: however, on the other hand, what's more, having said that, as a result…", "desc": "Talk for one minute about a topic and use all three linkers on the card.", "instr": "Talk for one minute about the topic. You MUST use all three linkers on the card. The others tick them off when they hear them!", "ph": ["First of all,…", "However,…", "Having said that,…", "All in all,…"], "cards": [{"t": "Living in a big city", "sub": ["however", "what's more", "as a result"]}, {"t": "Social media", "sub": ["on the other hand", "for instance", "in my opinion"]}, {"t": "Working from home", "sub": ["although", "moreover", "all in all"]}, {"t": "Fast food", "sub": ["despite", "therefore", "having said that"]}, {"t": "Learning languages", "sub": ["not only… but also", "whereas", "to sum up"]}, {"t": "Homework", "sub": ["in contrast", "besides", "consequently"]}, {"t": "Travelling alone", "sub": ["even though", "on top of that", "in conclusion"]}, {"t": "Video games", "sub": ["nevertheless", "for example", "as a matter of fact"]}, {"t": "Summer holidays", "sub": ["while", "furthermore", "overall"]}, {"t": "Having a pet", "sub": ["in spite of", "because of this", "to be honest"]}], "guide": {"ind": ["The student talks for one minute; you tick the linkers.", "Give feedback: was each linker used correctly?", "Repeat with a new card and a higher target."], "pair": ["Partner A talks, B ticks the linkers and gives a point for each correct one.", "Swap every card.", "Who got the most points?"], "grp": ["Use Pick a student. The class listens and raises a hand at each linker.", "Correct use = 1 point, wrong use = 0.", "Finish with the three most useful linkers of the day."]}, "end": "Which linker will you use in your next writing?", "ages": ["14-16", "16-18", "19-25", "adults"]}, {"id": "guess-the-job", "name": "Guess the Job", "cat": "game", "lv": ["B1", "B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "reveal": true, "img": true, "photoOnly": true, "revealTag": "Modals of speculation", "ansLabel": "The answer", "imgP": "an invented person (not a real or famous person), face clearly visible, waist-up portrait in their workplace, with visual clues about their job ({x}) — do NOT show any text or name badge", "gram": ["Modals of deduction"], "focus": "Speculation with a reason: He must be… because…, She might/could be…, He can't be… because…, She looks like… (clothes, place, objects, expression, posture…)", "desc": "Look at the photo and speculate about the person's job using must, might and can't.", "instr": "Look at the person in the photo. What's their job? Give at least two reasons: think about the place, the objects, their clothes, their expression or what they're doing.", "ph": ["He must be a… because…", "She might be a… / She could be a…", "He can't be a… because…", "She looks like a…"], "q": ["What's their job?", "What else can you guess: age, personality, where they live?"], "cards": [{"t": "a man in a dark suit and tie speaking at a podium with several microphones and flags behind him", "ans": "He's a politician."}, {"t": "a very stylish young woman  clear photo of {x}", "revealTag": "Yummy or yucky?", "ansLabel": "It's…", "q": ["What's this?", "Do you like it? Yummy or yucky?"], "desc": "Picture cards: name the food and say if you like it.", "instr": "What's this? Do you like it? Rub your tummy for 'yummy' or make a face for 'yucky'!", "ph": ["It's a… / It's…", "I like it!", "I don't like it!", "Yummy! / Yucky!"], "cards": [{"t": "banana", "ans": "It's a banana!"}, {"t": "apple", "ans": "It's an apple!"}, {"t": "pizza", "ans": "It's pizza!"}, {"t": "ice cream cone", "ans": "It's an ice cream!"}, {"t": "carrots", "ans": "They're carrots!"}, {"t": "bread", "ans": "It's bread!"}, {"t": "cheese", "ans": "It's cheese!"}, {"t": "strawberries", "ans": "They're strawberries!"}, {"t": "chocolate", "ans": "It's chocolate!"}, {"t": "broccoli", "ans": "It's broccoli!"}, {"t": "eggs", "ans": "They're eggs!"}, {"t": "orange fruit", "ans": "It's an orange!"}], "guide": {"ind": ["Show the picture, ask 'What's this?' and 'Do you like it?'.", "Model 'I like… / I don't like…' with big gestures.", "Reveal and repeat together."], "pair": ["Children ask each other 'Do you like…?' and answer with a gesture.", "", ""], "grp": ["Show the picture. Children answer with 'Yummy!' or 'Yucky!' and a gesture.", "Count hands: who likes it?", "Make a class 'favourite food' list."]}, "end": "What's your favourite food?", "books": ["Lead the Way 1 · U4"]}, {"id": "lost-and-found", "name": "Lost and Found", "cat": "game", "lv": ["A1", "A2", "B1"], "fmts": ["pair", "grp"], "kind": "single", "secret": true, "ages": ["6-8", "9-12", "12-14"], "gram": ["Present simple", "Relative clauses"], "focus": "Describing objects: It's big/small, It's made of…, It has…, It's the one with…", "desc": "You've lost something. Describe it so well that the others can 'find' it.", "instr": "Only the 'owner' looks at the card. You've lost this object! Describe it: colour, size, what it's made of, what's on it. The others guess what it is.", "ph": ["I've lost my…", "It's (blue) and (small)", "It's made of…", "It has… on it"], "cards": ["a red water bottle with stickers", "a blue backpack with a broken zip", "a pencil case shaped like a cat", "a black umbrella with white spots", "a green jumper with a big star", "a teddy bear with one ear", "a yellow football", "a silver watch", "a pair of glasses in a purple case", "a lunchbox with dinosaurs on it", "a skateboard with flames", "a pink hat with a pompom"], "guide": {"ind": ["The student describes; you guess. Then swap.", "Push for 3 details: colour, size, material.", "Ask 'Where did you lose it?'"], "pair": ["Hide the card for the guesser. The owner describes; the partner asks yes/no questions.", "Swap.", ""], "grp": ["One child looks at the card (press H). The class asks questions: 'Is it big? Is it blue?'", "Whoever guesses becomes the next owner.", ""]}, "end": "Have you ever lost something important?"}, {"id": "pizza-party", "name": "Pizza Party", "cat": "opinion", "lv": ["A2", "B1"], "fmts": ["pair", "grp"], "kind": "single", "ages": ["9-12", "12-14", "14-16"], "gram": ["Modals: advice & obligation", "Comparatives & superlatives"], "focus": "Suggesting and agreeing: Let's order…, We should…, What about…?, He can't eat…", "desc": "Plan a pizza order for the class with only three pizzas. Everyone has different needs!", "instr": "You can only order three pizzas for the whole group. Look at the problem on the card and agree which pizzas to order.", "ph": ["Let's order… because…", "We can't get… because… is allergic", "What about…?", "OK, so we agree on…"], "cards": ["Two people are vegetarian and one person hates cheese.", "Someone is allergic to tomatoes.", "Half the group loves spicy food, half hates it.", "One person only eats pizza with pineapple.", "The budget is only 25 euros.", "Someone doesn't eat meat or fish.", "The teacher wants a pizza too, with anchovies!", "It's someone's birthday: they choose one pizza.", "Someone can't eat gluten.", "Nobody likes mushrooms except one person."], "guide": {"ind": ["Plan together: you play a difficult classmate with lots of demands.", "The student must find a solution and explain it.", ""], "pair": ["Pairs agree on three pizzas in two minutes, then compare with another pair.", "", ""], "grp": ["Groups of four plan the order, then present it.", "The class votes for the fairest plan.", ""]}, "end": "What's the best pizza in the world?", "books": ["Game Changer 2 · U2"]}, {"id": "celebrity-holiday", "name": "Plan a Celebrity's Holiday", "cat": "opinion", "lv": ["A2", "B1", "B2"], "fmts": ["pair", "grp"], "kind": "single", "ages": ["12-14", "14-16", "16-18", "19-25", "adults"], "gram": ["Future forms", "Modals: advice & obligation"], "focus": "Planning: They're going to…, They should…, They'll love… because…", "desc": "You're a travel agent for a very demanding (invented) celebrity. Plan their perfect week.", "instr": "You work for a travel agency. Plan a one-week holiday for this client: where, where to stay, what to do and what to avoid.", "ph": ["They're going to stay at…", "They should avoid… because…", "On day one they'll…", "It's perfect for them because…"], "cards": ["A rock star who hates the sun and loves the night", "A famous chef who wants to discover new food", "A football player with an injured leg", "A shy actor who doesn't want to be recognised", "An influencer who needs 100 photos a day", "A singer who's scared of planes", "A billionaire who has been everywhere", "A grandmother who has just won the lottery", "A YouTuber who wants extreme adventures", "A writer who needs total silence"], "guide": {"ind": ["Plan the trip together; you're the difficult client and keep changing your mind.", "", ""], "pair": ["Pairs plan the week, then 'sell' it to another pair, who play the client.", "", ""], "grp": ["Groups plan a trip each, then present it like a TV ad.", "The class votes for the trip they'd most like to go on.", ""]}, "end": "Which client would be the worst to work for?", "books": ["Game Changer 2 · U3"]}, {"id": "perfect-match", "name": "The Perfect Match", "cat": "opinion", "lv": ["B1", "B2", "C1"], "fmts": ["pair", "grp"], "kind": "single", "ages": ["16-18", "19-25", "adults"], "gram": ["Comparatives & superlatives", "Second conditional"], "focus": "Comparing and justifying: … would get on better with… because…, They're more… than…", "desc": "Read the profiles and decide who should share a flat, a holiday or a team.", "instr": "Read the four profiles. Make two pairs that would get on well. Explain your choice and say which pair would be a disaster!", "ph": ["… and … would get on well because…", "… would drive … crazy because…", "They're both… / Unlike…,", "I'd put … with … because…"], "cards": [{"t": "Flatmates", "sub": ["Ana: tidy, early riser, hates noise", "Ben: plays drums, night owl, cooks well", "Carla: always travelling, very social", "Dev: works from home, loves silence"]}, {"t": "Holiday partners", "sub": ["Eli: loves museums and early mornings", "Fran: wants beach and parties", "Gus: adventure sports, no plans", "Hana: needs a detailed plan for every day"]}, {"t": "Project team", "sub": ["Ivan: great ideas, always late", "Julia: organised, a bit bossy", "Kai: quiet, brilliant with numbers", "Lola: talks a lot, great presenter"]}, {"t": "Road trip", "sub": ["Max: only listens to heavy metal", "Nora: gets car sick", "Omar: loves stopping everywhere for photos", "Pia: wants to arrive as fast as possible"]}, {"t": "Dinner party seating", "sub": ["Quim: talks only about football", "Rosa: vegetarian activist", "Sam: hunter and steak lover", "Tina: football fan, very funny"]}, {"t": "Gym partners", "sub": ["Uma: training for a marathon", "Vic: wants to chat, not train", "Will: very competitive", "Xia: complete beginner, a bit shy"]}], "guide": {"ind": ["The student pairs them up and justifies; you disagree with one pair.", "", ""], "pair": ["Pairs make their choice, then compare with another pair and negotiate a final answer.", "", ""], "grp": ["Groups decide, then defend their pairs to the class.", "", ""]}, "end": "Who would be YOUR perfect flatmate?"}, {"id": "museum-robbery", "name": "The Museum Robbery", "cat": "game", "lv": ["A2", "B1", "B2"], "fmts": ["pair", "grp"], "kind": "single", "ages": ["9-12", "12-14", "14-16", "16-18", "19-25", "adults"], "gram": ["Past continuous", "Modals of deduction", "Question forms"], "focus": "Alibis and deduction: I was …ing, He must have…, She can't have… because…", "desc": "A painting was stolen last night. Read one clue per slide and work out who did it.", "instr": "Last night at 9 pm the famous painting 'Blue Moon' was stolen from the City Museum. There are four suspects. Read the clues one by one and decide who did it.", "ph": ["She can't have done it because…", "He must have…", "Where was … at 9 pm?", "So the thief must be…"], "cards": ["The suspects: the guard (Mr Grey), the cleaner (Ms Rose), the director (Dr Black) and a visitor (Mr Green).", "Clue 1: Mr Grey says he was watching football in the guard room.", "Clue 2: The football match on TV was cancelled last night because of rain.", "Clue 3: Ms Rose says she was cleaning the café on the ground floor.", "Clue 4: The painting was on the second floor. The lift was broken.", "Clue 5: Dr Black was having dinner at a restaurant. The waiter remembers her.", "Clue 6: Mr Green left the museum at 8 pm. The camera at the door shows it.", "Clue 7: There was a pair of wet shoes in the guard room.", "Clue 8: Ms Rose's mop and bucket were found on the second floor.", "Clue 9: Mr Grey has just bought a very expensive car.", "Who stole the painting? Decide as a group and explain why. (Teacher: there's no single answer — the best argued solution wins!)"], "guide": {"ind": ["Read the clues together. After each one, the student says who it could or couldn't be.", "At the end they accuse someone and justify it.", ""], "pair": ["Pairs discuss each clue for one minute and keep a list of suspects.", "At the end, pairs compare their solution with another pair.", ""], "grp": ["Groups of three or four are detective teams. Show one clue at a time.", "At the end, each team accuses someone and gives three reasons.", "The best-argued case wins."]}, "end": "Who did it? Was it the best-argued case or the truth?"}, {"id": "class-playlist", "name": "The Class Playlist", "cat": "opinion", "lv": ["A2", "B1", "B2"], "fmts": ["pair", "grp"], "kind": "single", "ages": ["9-12", "12-14", "14-16", "16-18", "19-25"], "gram": ["Gerunds & infinitives", "Comparatives & superlatives"], "focus": "Opinions and preferences: I'd rather…, I can't stand…, It's more… than…, Let's include…", "desc": "Agree on a five-song playlist for a specific situation.", "instr": "Make a playlist of five songs for this situation. Everyone must agree! Explain why each song fits.", "ph": ["I think we should include…", "It's perfect for… because…", "I'd rather… than…", "OK, let's compromise:…"], "cards": ["A long bus trip on a school excursion", "Studying for exams", "A party at the end of the year", "A rainy Sunday", "Going to the gym", "Cooking with friends", "A road trip with your family (everyone must like it!)", "The last day of summer", "Waking up on Monday morning", "A film about your life"], "guide": {"ind": ["The student chooses five songs and explains; you challenge two choices.", "", ""], "pair": ["Pairs negotiate a list of five songs, then present them.", "", ""], "grp": ["Groups agree on a playlist in five minutes. They can only keep a song if everyone accepts it.", "Groups present and the class votes.", ""]}, "end": "Which song would you never put on a playlist?", "books": ["Game Changer 3 · U7"]}, {"id": "disaster-plan", "name": "Disaster Plan", "cat": "game", "lv": ["B1", "B2", "C1"], "fmts": ["pair", "grp"], "kind": "single", "ages": ["12-14", "14-16", "16-18", "19-25", "adults"], "gram": ["Modals: advice & obligation", "First conditional"], "focus": "Planning under pressure: We have to…, If we…, we'll…, We'd bette     else if(d.kind==="stat"){

    else if(d.kind==="board"){

    body=`<div class="s-eyebrow"><span>${esc(d.name)}</span><span>${cardNo}</span></div><div class="s-body">${inner}</div>${phrases(d)}`;
    if((d.kind==="board"||d.secret)&&D.hide)body+=`<div class="s-cover"><span class="label" style="color:var(--stage-muted)">${d.secret?"Only the speaker looks":"Next word"}</span><p class="s-title">${d.secret?"Eyes closed!":"Ready?"}</p><p class="s-instr">${d.secret?"Everyone except the speaker closes their eyes. Press H to show the card, and H again to hide it.":"Press Hide card again to show it."}</p></div>`;
  }
  st.innerHTML=body+`<div class="s-overlay">${D.tid||D.left>0?`<span class="s-pill ${D.left<=10?"low":""}" id="tpill">${fmt(Math.max(D.left,0))}</span>`:""}</div>
    ${D.up?`<div class="s-up">Time's up!</div>`:""}${D.pickName?`<div class="s-pick">${esc(D.pickName)}</div>`:""}
    <div class="s-nav"><button id="fsPrev" aria-label="Previous">←</button><button id="fsNext" aria-label="Next">→</button></div>`;
  $("#fsPrev").onclick=()=>go(-1);$("#fsNext").onclick=()=>go(1);
  $("#count").textContent=`${D.i+1} / ${n}`;
  $("#prev").disabled=D.i===0;$("#next").disabled=D.i===n-1;
  if(D.i===n-1){const a=CL.active();if(a&&!H.dates(a.id,d.id).includes(today())){$("#doneRow").scrollIntoView({block:"nearest"});}}
}
function toggleTimer(){if(D.tid){clearInterval(D.tid);D.tid=null;D.left=0;$("#tbtn").textContent="Timer";render();return;}
