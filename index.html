<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaking Corner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800;6..12,900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: hub of activity cards grouped by type; each activity opens a projector-ready slide stage (fixed dark look) with teacher tools underneath. */
:root{
  --bg:#f4f6fb; --paper:#ffffff; --ink:#1b2340; --muted:#5d6584; --line:#d3d7e4;
  --stamp:#d8432f; --stamp-soft:#fbe3df; --ok:#2f8a5b; --ok-soft:#dff2e7; --warn:#a86200; --warn-soft:#fdf0d9;
  --c-warm:#c27a0e; --c-you:#7a4fd0; --c-opinion:#1f7fb8; --c-game:#d8432f;
  --stage:#ffffff; --stage-2:#f1f3fa; --stage-ink:#1b2340; --stage-muted:#6b7392;
  --display:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.narrow{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-size:clamp(1.5rem,5.5vw,2.4rem);margin:0;letter-spacing:.02em;line-height:1.1;text-wrap:balance}
h1 span{color:var(--stamp)}
h2{font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-size:1.08rem;margin:0}
p{margin:0;max-width:65ch}
.sub{color:var(--muted)}
.label{font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:.85rem;color:var(--muted)}
button,.btn{font:inherit;font-weight:800;border-radius:10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button.primary,.btn.primary{background:var(--ink);color:var(--paper)}
button.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
button.ghost,.btn.ghost{border-color:var(--line);font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
textarea,select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:120px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 170px}
a{color:inherit}
.back{align-self:flex-start;text-decoration:none;font-weight:800;color:var(--muted)}
.back:hover{color:var(--ink)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top nav{display:flex;gap:8px;flex-wrap:wrap}
.classpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.classpick select{width:auto;min-width:0;max-width:100%;padding:7px 10px;font-weight:700}
.filters{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 13px;border-width:1px;border-color:var(--line);font-weight:700;border-radius:99px}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* activity cards */
.cat{display:flex;flex-direction:column;gap:12px}
.cat-h{display:flex;align-items:baseline;gap:10px}
.cat-h i{width:12px;height:12px;border-radius:3px;background:var(--cc);display:inline-block;transform:translateY(1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.act{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;min-width:0;border-left:5px solid var(--cc)}
.act:hover{border-color:var(--cc)}
.act h3{padding-right:4px}
.act p{font-size:.93rem;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.lvl{font-family:var(--mono);font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--muted)}
.fmt{font-size:.72rem;font-weight:800;color:var(--muted)}
.flag{font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px}
.flag.print{background:var(--warn-soft);color:var(--warn)}
.flag.done{background:var(--ok-soft);color:var(--ok)}
.flag.app{background:var(--stamp-soft);color:var(--stamp)}
.c-warm{--cc:var(--c-warm)}.c-you{--cc:var(--c-you)}.c-opinion{--cc:var(--c-opinion)}.c-game{--cc:var(--c-game)}
.empty{color:var(--muted);padding:20px;text-align:center}

/* banners */
.banner{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:700}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.print{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}

/* stage (deliberately one dark look in both themes: it is projected) */
.stage{position:relative;background:var(--stage);border:1px solid var(--line);box-shadow:0 6px 24px rgba(27,35,64,.07);color:var(--stage-ink);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  padding:clamp(18px,4.5vw,52px);min-height:min(66vh,560px);gap:18px;--acc:#b86e00;--tint:#fdf2e1;border-top:8px solid var(--acc)}
@media (min-width:760px){.stage{aspect-ratio:16/9;min-height:0}}
.stage.c-warm{--acc:#b86e00;--tint:#fdf2e1}.stage.c-you{--acc:#6a3fc4;--tint:#f0eafc}.stage.c-opinion{--acc:#1a6fa3;--tint:#e3f0f9}.stage.c-game{--acc:#c9381f;--tint:#fce6e1}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;padding:max(4vh,24px) max(5vw,24px)}
.s-eyebrow{font-size:clamp(.7rem,1.4vw,.95rem);font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);display:flex;justify-content:space-between;gap:10px}
.s-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.4vw,26px);min-height:0}
.s-title{font-family:var(--display);font-size:clamp(1.8rem,5.4vw,4rem);line-height:1.05;text-wrap:balance;margin:0}
.s-instr{font-size:clamp(1.05rem,2.3vw,1.7rem);line-height:1.35;max-width:46ch;color:var(--stage-ink)}
.s-ex{font-size:clamp(.95rem,1.8vw,1.3rem);color:var(--stage-muted);border-left:4px solid var(--acc);padding-left:14px;max-width:60ch}
.s-big{font-size:clamp(1.8rem,5.6vw,4.4rem);font-weight:900;line-height:1.1;text-wrap:balance;margin:0}
.s-big.mid{font-size:clamp(1.5rem,4.2vw,3.2rem)}
.s-q{margin:0;padding-left:1.1em;font-size:clamp(1rem,2vw,1.5rem);display:flex;flex-direction:column;gap:4px;color:var(--stage-ink)}
.s-q li::marker{color:var(--acc)}
.s-ph{display:flex;flex-wrap:wrap;gap:8px}
.s-ph span{background:var(--stage-2);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:clamp(.8rem,1.5vw,1.1rem);font-weight:700;color:var(--stage-ink)}
.s-ph b{color:var(--acc);font-size:.8em;letter-spacing:.12em;text-transform:uppercase;align-self:center;margin-right:4px}
.s-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(10px,2vw,24px);align-items:stretch}
.s-opt{background:var(--tint);border-radius:14px;padding:clamp(14px,2.5vw,28px);display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0}
.s-opt small{font-size:clamp(.7rem,1.3vw,.95rem);font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.s-opt div{font-size:clamp(1.2rem,3.3vw,2.5rem);font-weight:900;line-height:1.15;text-wrap:balance}
.s-opt img,.s-img img{width:100%;height:auto;max-height:52vh;object-fit:cover;border-radius:10px;max-width:100%}
.s-opt.ph{position:relative;padding:0;overflow:hidden;justify-content:flex-end}
.s-opt.ph img{position:absolute;inset:0;width:100%;height:100%;max-height:none;border-radius:0;object-fit:cover}
.s-opt.ph .cap{position:relative;padding:clamp(40px,6vw,80px) clamp(12px,2vw,22px) clamp(10px,1.6vw,18px);background:linear-gradient(to top,rgba(10,14,30,.82),rgba(10,14,30,0));display:flex;flex-direction:column;gap:4px}
.s-opt.ph .cap small{color:#fff;opacity:.85}
.s-opt.ph .cap div{color:#fff;font-size:clamp(1.05rem,2.6vw,2rem)}
.s-vs.ph{flex:1 1 0;min-height:200px}
.s-or{align-self:center;font-family:var(--display);color:var(--acc);font-size:clamp(1rem,2.4vw,1.8rem)}
.s-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.4vw,14px)}
.s-tiles div{background:var(--tint);border-radius:12px;padding:clamp(10px,1.8vw,20px);font-size:clamp(.9rem,2vw,1.45rem);font-weight:800;line-height:1.2;display:flex;align-items:center;min-height:clamp(56px,9vw,110px)}
.s-tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.s-tiles div.ptile{position:relative;padding:0;overflow:hidden;align-items:flex-end;min-height:clamp(110px,15vw,220px)}
.s-tiles div.ptile.sm{min-height:clamp(70px,8vw,110px)}
.ptile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ptile span{position:relative;width:100%;padding:clamp(22px,3vw,40px) clamp(8px,1.2vw,14px) clamp(6px,1vw,12px);background:linear-gradient(to top,rgba(10,14,30,.85),rgba(10,14,30,0));color:#fff}
.s-tiles.five div.ptile span{font-size:clamp(.7rem,1.3vw,1rem)}
.s-tiles.n2 div,.s-tiles.n3 div{font-size:clamp(1.1rem,2.8vw,2.1rem);min-height:clamp(90px,16vw,220px)}
.s-tiles.n4 div{font-size:clamp(1rem,2.4vw,1.8rem);min-height:clamp(70px,11vw,150px)}
.s-tiles.five div{font-size:clamp(.78rem,1.6vw,1.15rem);min-height:clamp(48px,7vw,90px)}
.s-stat{font-size:clamp(1.4rem,4.2vw,3.2rem);font-weight:900;line-height:1.12;text-wrap:balance;margin:0}
.s-tag{align-self:flex-start;font-size:clamp(.7rem,1.3vw,.95rem);font-weight:900;letter-spacing:.12em;text-transform:uppercase;border:2px solid var(--acc);color:var(--acc);border-radius:6px;padding:3px 10px}
.s-split{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(14px,3vw,36px);align-items:center}
.s-no{display:flex;flex-direction:column;gap:6px}
.s-no span{font-size:clamp(1rem,2.4vw,1.8rem);font-weight:800;color:var(--stage-muted);text-decoration:line-through;text-decoration-color:var(--acc);text-decoration-thickness:3px}
.s-cover{position:absolute;inset:0;background:var(--stage);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:2}
.s-cover .s-title{color:var(--acc)}
.s-overlay{position:absolute;top:clamp(10px,2vw,20px);right:clamp(10px,2vw,20px);display:flex;gap:8px;z-index:3}
.s-pill{background:var(--stage-2);color:var(--stage-ink);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-family:var(--mono);font-weight:700;font-size:clamp(1rem,2.2vw,1.6rem);font-variant-numeric:tabular-nums}
.s-pill.low{background:#c9381f;color:#fff;border-color:#c9381f}
.s-pick{position:absolute;left:50%;bottom:clamp(14px,3vw,28px);transform:translateX(-50%);background:var(--acc);color:#fff;box-shadow:0 6px 20px rgba(27,35,64,.2);border-radius:14px;padding:10px 22px;font-weight:900;font-size:clamp(1.2rem,3vw,2.2rem);z-index:3;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.s-up{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#fff;color:#c9381f;font-family:var(--display);font-size:clamp(2rem,8vw,6rem);text-align:center;animation:flash .5s ease-in-out 4 alternate}
@keyframes flash{from{color:#c9381f}to{color:#f4c7bd}}
@media (prefers-reduced-motion:reduce){.s-up{animation:none}}
.s-nav{position:absolute;bottom:14px;right:14px;display:none;gap:8px;z-index:4}
.stage:fullscreen .s-nav{display:flex}
.s-nav button{background:var(--stage-2);color:var(--stage-ink);border:1px solid var(--line);padding:10px 16px;opacity:.7}
.s-nav button:hover{opacity:1}
@media (max-width:640px){.s-vs{grid-template-columns:1fr}.s-or{justify-self:center}.s-tiles,.s-tiles.five{grid-template-columns:repeat(2,minmax(0,1fr))!important}.s-split{grid-template-columns:1fr}}

/* controls under stage */
.ctrl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ctrl .count{font-family:var(--mono);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button,.tools select{padding:8px 12px;font-size:.92rem}
.tools select{width:auto;border-width:2px;border-color:var(--line);font-weight:700}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:7px 12px;border-width:1px;border-color:var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.guide p{font-size:1rem}
.guide ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

/* games (interactive) */
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.rules b{color:var(--ink)}
.chip{display:inline-block;font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--stamp-soft);color:var(--stamp)}
.envelope{border:2px dashed var(--line);border-radius:14px;min-height:170px;display:grid;place-items:center;text-align:center;padding:20px;user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:none}
.envelope .closed{display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted)}
.stamp{font-family:var(--display);color:var(--stamp);border:3px solid var(--stamp);padding:6px 14px;border-radius:6px;transform:rotate(-6deg);font-size:1rem;letter-spacing:.05em;display:inline-block}
.word{font-family:var(--display);font-size:clamp(1.8rem,8vw,3rem);color:var(--stamp);word-break:break-word}
.topic{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;line-height:1.2;text-wrap:balance}
.timer{font-family:var(--mono);font-weight:700;font-size:clamp(3rem,14vw,5.5rem);font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.timer.low{color:var(--stamp)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s linear}
.scores{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.scores li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.scores li.lead{background:var(--stamp-soft);font-weight:800}
.scores .pts{font-family:var(--mono);font-weight:700}
.reveal{background:var(--ok-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{padding:8px 12px;border-width:1px;font-weight:600}
.pick button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.bank{display:flex;flex-direction:column;gap:12px;margin-top:12px}
details.more summary{cursor:pointer;font-weight:800}
.stg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cell{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 6px;min-height:76px;font-weight:800;font-size:clamp(.72rem,2.6vw,.95rem);line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;word-break:break-word}
.cell:hover:not(:disabled){border-color:var(--ink)}
.cell.done{background:var(--pc);border-color:var(--pb);opacity:1;cursor:default}
.cell.used{opacity:.45}
.cell small{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--pb,var(--ok))}
.prompts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:1.05rem}
.turn{display:flex;align-items:center;gap:8px;font-weight:800}
.dot{width:14px;height:14px;border-radius:50%;background:var(--pb);flex:none}
.p0{--pb:#d8432f;--pc:#fbe3df}.p1{--pb:#1f7fb8;--pc:#dcedf8}.p2{--pb:#2f8a5b;--pc:#dff2e7}.p3{--pb:#7a4fd0;--pc:#ece4fb}.p4{--pb:#c27a0e;--pc:#fbeed6}.p5{--pb:#b0306f;--pc:#f8dfeb}.p6{--pb:#0f8a8a;--pc:#d8f1f0}.p7{--pb:#5b6478;--pc:#e3e6ee}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1;padding:9px 12px;font-weight:700;background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.clist li{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--bg)}
.clist li>div:first-child{display:flex;flex-direction:column;min-width:0}
.clist button{padding:7px 12px}
.clist button.warn{background:var(--stamp);border-color:var(--stamp);color:#fff}
.prompt{background:var(--bg);border-radius:10px;padding:12px;font-family:var(--mono);font-size:.82rem;white-space:pre-wrap;word-break:break-word}
@media (max-width:420px){.stg{gap:6px}.cell{min-height:68px;padding:8px 4px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>

ecause…", "I'd rather … than…", "I'd only swap if…"], "cards": [{"a": "Swimming in the sea", "b": "A walk in a snowy forest"}, {"a": "Ice cream on the beach", "b": "Hot chestnuts in the street"}, {"a": "Long, light evenings", "b": "Rainy nights with a blanket and a film"}, {"a": "Flip-flops", "b": "Cosy boots"}, {"a": "Open-air concerts", "b": "Christmas markets"}, {"a": "Fresh watermelon", "b": "A bowl of hot soup"}, {"a": "Two months of summer holidays", "b": "A long weekend every month"}, {"a": "A barbecue with friends", "b": "A board game night"}, {"a": "Sunbathing", "b": "Ice skating"}, {"a": "A road trip", "b": "A cabin in the mountains"}]}, {"id": "try-do-skip", "name": "Done, Try or Skip", "cat": "you", "lv": ["A2", "B1"], "fmts": ["ind", "pair", "grp"], "kind": "triple", "desc": "Three activities: which have you done, which would you try, which would you skip?", "instr": "Look at the three activities. Which one have you done? Which would you love to try? Which would you skip?", "ph": ["I've already… (and it was…)", "I'd love to try… because…", "I'd definitely skip… because…", "I've never…"], "cards": [["Go camping in the mountains", "Sing karaoke in public", "Eat a whole pizza alone"], ["Try surfing", "Sleep in a treehouse", "Run a 10 km race"], ["Go to a music festival", "Take a cooking class", "Spend a day without your phone"], ["Go horse riding", "Visit a country where you don't speak the language", "Dye your hair a crazy colour"], ["Watch the sunrise", "Try an escape room", "Go on a roller coaster"], ["Grow your own vegetables", "Go scuba diving", "Travel alone"], ["Learn to juggle", "Go to the opera", "Take a night train"], ["Volunteer at an animal shelter", "Ride a motorbike", "Try a food you can't pronounce"]], "img": true, "imgP": "the activity: {x}"}, {"id": "two-truths", "name": "Two Truths and a Lie", "cat": "you", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "desc": "Say three things about yourself. The others find ion", "Ads for something you only talked about"], "img": true, "imgP": "a photo of this technology scenario: {x}"}, {"id": "parallel-realities", "name": "Parallel Realities", "cat": "opinion", "lv": ["B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "versus", "desc": "Find the deeper connection between two very different ideas.", "instr": "Look beyond the surface. What do these two ideas have in common at a deeper level?", "labels": ["", ""], "ph": ["What connects them is…", "At their core, both are about…", "In both cases, you have to…", "The key difference, though, is…"], "cards": [{"a": "Learning an instrument", "b": "A long-term relationship"}, {"a": "Running a marathon", "b": "Writing a thesis"}, {"a": "Planting a garden", "b": "Raising a teenager"}, {"a": "Moving to another country", "b": "Starting a new job"}, {"a": "Cooking for a big family", "b": "Managing a project"}, {"a": "Learning a language", "b": "Building a house"}, {"a": "Going on a diet", "b": "Saving money"}, {"a": "Climbing a mountain", "b": "Recovering from an injury"}, {"a": "Playing chess", "b": "Negotiating a salary"}, {"a": "Training a puppy", "b": "Teaching a class"}], "img": true, "imgP": "{x}"}, {"id": "headline-vs-life", "name": "Headline vs Real Life", "cat": "opinion", "lv": ["B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "stat", "desc": "Does an imagined headline match your experience?", "instr": "Imagine you read this headline. Does it match what you see in real life?", "q": ["Does it sound believable? Why or why not?", "Does your own experience support it or challenge it?", "Why might real life be different from the data?"], "ph": ["It rings true because…", "That doesn't match my experience…", "I suspect the numbers hide…", "People tend to say one thing and do another."], "cards": [{"s": "7 in 10 people check their phone within 10 minutes of waking up", "q": "Is that a problem, or just modern life?"}, {"s": "Most people say they would earn less to work four days a week", "q": "Would you? What would you do with the extra day?"}, {"s": "6 in 10 students say exams don't show what they really know", "q": "What would be a fairer way to assess students?"}, {"s": "Most drivers think they're better than average", "q": "Why are we so bad at judging ourselves?"}, {"s": "1 in 3 adults has never cooked a full meal from scratch", "q": "Is cooking still an essential skill?"}, {"s": "Most people prefer texting to phone calls", "q": "When is a call still better?"}, {"s": "Half of people have bought something online they never used", "q": "What makes us buy things we don't need?"}, {"s": "4 in 10 people say they work better from home", "q": "What do we lose when we don't share an office?"}, {"s": "Most people say they'd quit social media for a year if you paid them", "q": "How much would someone have to pay you?"}, {"s": "Most people say they want to travel more sustainably, but flights keep growing", "q": "Whose responsibility is it: people's or governments'?"}], "note": "These headlines are invented for discussion, not real statistics.", "coverP": "a pile of newspapers and a smartphone showing a chart, on a café table"}, {"id": "defend-the-object", "name": "Defend the Object", "cat": "opinion", "lv": ["B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "img": true, "desc": "Convince everyone that an ordinary object is the best invention ever.", "instr": "Convince everyone that this is the most important invention of all time. How has it changed people's lives?", "ph": ["Without it, we would…", "Imagine a world where…", "It has completely changed…", "Nothing else can…"], "cards": ["paper clip", "zip", "clothes peg", "bottle opener", "plaster", "safety pin", "measuring tape", "sticky tape", "hairbrush", "teabag", "coat hanger", "fridge magnet"], "end": "Vote: which object won the debate?"}, {"id": "would-you-rather", "name": "Would You Rather", "cat": "opinion", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "versus", "de ssing.", "Someone changed every phone alarm to 4 am.", "The last slice of pizza vanished from the staff room.", "Someone hid the TV remote, and the final is tonight."], "end": "Guilty or not guilty? If their stories differ in three details, they're guilty!", "img": true, "imgP": "a funny scene of the aftermath: {x}"}, {"id": "taboo", "name": "Taboo", "cat": "game", "lv": ["A2", "B1", "B2", "C1"], "fmts": ["ind", "grp"], "kind": "board", "print": "required", "desc": "Describe the word without the forbidden words.", "instr": "Projected version: one student sits with their back to the screen. Their team describes the word without saying the forbidden words. Printed version: students take a card and describe it to their team.", "ph": ["It's a kind of…", "You use it when…", "It's the opposite of…", "It sounds like…"], "cards": [{"w": "beach", "no": ["sand", "sea", "summer", "swim", "sun"]}, {"w": "teacher", "no": ["school", "students", "class", "lesson", "job"]}, {"w": "birthday", "no": ["cake", "party", "age", "present", "candles"]}, {"w": "pizza", "no": ["Italy", "cheese", "tomato", "food", "slice"]}, {"w": "phone", "no": ["call", "mobile", "apps", "screen", "message"]}, {"w": "dog", "no": ["animal", "pet", "bark", "cat", "walk"]}, {"w": "winter", "no": ["cold", "snow", "season", "Christmas", "December"]}, {"w": "hospital", "no": ["doctor", "nurse", "ill", "sick", "ambulance"]}, {"w": "football", "no": ["ball", "goal", "team", "Messi", "match"]}, {"w": "coffee", "no": ["drink", "morning", "cup", "milk", "caffeine"]}, {"w": "airport", "no": ["plane", "fly", "travel", "ticket", "gate"]}, {"w": "homework", "no": ["school", "teacher", "exercises", "home", "study"]}, {"w": "wedding", "no": ["marry", "bride", "husband", "wife", "ring"]}, {"w": "umbrella", "no": ["rain", "wet", "open", "weather", "cover"]}, {"w": "breakfast", "no": ["morning", "eat", "meal", "cereal", "toast"]}, {"w": "library", "no": ["books", "read", "borrow", "quiet", "study"]}, {"w": "holiday", "no": ["tr : a grandmother who loves gardening", "sub": ["umbrella", "speaker"]}, {"t": "Customer: a teenager who never wakes up on time", "sub": ["pillow", "trumpet"]}, {"t": "Customer: a pirate", "sub": ["phone", "parrot cage"]}, {"t": "Customer: a busy teacher", "sub": ["backpack", "robot"]}, {"t": "Customer: a vampire", "sub": ["sunglasses", "toaster"]}, {"t": "Customer: a football coach", "sub": ["helmet", "microwave"]}, {"t": "Customer: a cat", "sub": ["sofa", "alarm clock"]}, {"t": "Customer: an astronaut", "sub": ["pizza", "blanket"]}, {"t": "Customer: a famous chef", "sub": ["shoes", "fridge"]}, {"t": "Customer: a student before exams", "sub": ["hat", "coffee machine"]}], "guide": {"ind": ["Show the card. Give the student one minute to prepare and one minute to pitch.", "You play the customer: ask difficult questions and raise objections.", "Swap roles on the next card."], "pair": ["One student is the seller, the other is the customer, who must play the role on the card.", "Seller pitches for one minute, then the customer asks two questions and decides: buy or not?", "Swap roles."], "grp": ["In teams, students get two minutes to invent the product and its name.", "One person per team pitches to the class, who play the customer.", "Class votes for the product they'd actually buy."]}, "end": "Which product would actually sell? What would you call it?"}, {"id": "excuses", "name": "Excuses, Excuses", "cat": "game", "lv": ["A2", "B1", "B2"], "fmts": ["ind", "pair", "grp"], "kind": "single", "desc": "Invent the most creative excuse for an awkward situation.", "instr": "You're in trouble! Invent the most creative (but believable) excuse. Then the others decide if they believe you.", "ph": ["I'm so sorry, but…", "You won't believe what happened…", "It wasn't my fault because…", "On my way here,…"], "cards": ["You arrive 40 minutes late to your best friend's birthday dinner.", "You forgot to do your homework, again.", "You ate your flatmate's birthday cake.", "Your teacher sees you on social media when you said you were ill.", "You lost the keys to a friend's car.", "You fell asleep in an important meeting.", "You forgot your partner's birthday.", "Your dog is in the swimming pool of the hotel.", "You broke your neighbour's window with a ball.", "You sent a message about your boss… to your boss.", "You missed your own surprise party.", "You're wearing two different shoes at an interview."], "guide": {"ind": ["Show the situation. The student gives an excuse; you react as the angry person and ask questions.", "Push for details until the story falls apart (or doesn't!).", "Swap: you give an excuse and the student judges it."], "pair": ["Student A is in trouble, Student B is the angry person. A has 30 seconds to explain.", "B asks three follow-up questions, then decides: forgive or not?", "Swap roles on the next card."], "grp": ["Show the situation and give everyone 30 seconds to think.", "Pick three students to give their excuse.", "The class votes: most creative and most believable."]}, "end": "Who gave the best excuse today?"}, {"id": "hot-takes", "name": "Hot Takes", "cat": "opinion", "lv": ["B1", "B2", "C1"], "fmts": ["ind", "pair", "grp"], "kind": "single", "desc": "Controversial (but harmless) opinions. Agree, disagree and defend your position.", "instr": "Here's a hot take. Do you agree or disagree? Take a side and defend it, even if it's a silly one.", "ph": ["I totally agree because…", "No way! That's ridiculous because…", "I see your point, but…", "Let's be honest:…"], "cards": ["Cereal is a type of soup.", "Phone calls are worse than going to the dentist.", "Breakfast food is better at dinner time.", "Sequels are usually better than the original film.", "Summer holidays are too long.", "Sandwiches taste better when they're cut into triangles.", "Pineapple belongs on pizza.", "It's rude to send a voice message.", "Weekends should be three days long.", "Socks with sandals are a good idea.", "Dogs are overrated.", "Going to the gym }

const SW_WORDS={
 easy:["banana","umbrella","penguin","pizza","bicycle","guitar","rainbow","chocolate","elephant","sandwich","window","pirate","mirror","balloon","sock","candle","frog","rocket","sunglasses","pillow","butterfly","lemon","ladder","snow","cheese","dragon","clock","biscuit","teapot","shark"],
 tricky:["toothbrush","volcano","submarine","moustache","trampoline","lighthouse","pyjamas","cactus","helicopter","sandcastle","jellyfish","kangaroo","microwave","parachute","dinosaur","hamster","wig","broccoli","astronaut","snowman","octopus","handcuffs","saxophone","igloo","vampire","flamingo","wheelbarrow","toaster","unicorn","spaghetti"]};
const SW_TOPICS=["Your ideal weekend","The best job in the world","Why people should learn languages","Social media: good or bad?","A trip you will never forget","What makes a good friend","Life without mobile phones","The perfect school","How to stay healthy","A person who inspires you","City life or country life?","Your favourite season and why","Technology in 20 years","Is fast food really that bad?","Working from home","Beach holidays or mountain holidays?","The most useless invention","Your dream house","Should every family have a pet?","Shopping online vs in shops","A skill you'd love to learn","The best age to be","Your morning routine","A film everyone should watch","Should homework be banned?","Your favourite place in your town","Cooking at home vs eating out","Living abroad","The best gift you've ever received","Rules you would change at school"];
const SW={g:byId("secret-word"),players:[],round:1,rounds:1,idx:0,time:60,level:"easy",scores:{},usedW:new Set(),usedT:new Set(),cur:null,
 shell(inner){app.innerHTML=`<div class="narrow">${gameHeader(this.g)}
   <main class="card" id="screen" aria-live="polite">${inner}</main>
   <section class="card" id="scoreCard" ${this.started?"":"hidden"}><div class="label">Scoreboard</div><ol class="scores" id="scoreList"></ol></section></div>`;
   if(this.started)this.renderScores();},
 setup(){this.started=false;const a=CL.active(),saved=store.get("sc-names","");
  this.shell(`
    <div id="bn">${doneBanner("secret-word")}</div>
    <div class="row">${classField("cls")}</div>
    <div class="field"><label class="label" for="names">Students playing today</label>
      <textarea id="names">${esc(a?a.students.join("\n"):saved)}</textarea>
      <span class="note">One per line. Delete anyone who's absent.</span></div>
    <div class="row">
      <div class="field"><label class="label" for="time">Speaking time</label><select id="time"><option value="45">45 seconds</option><option value="60" selected>1 minute</option><option value="90">1.5 minutes</option><option value="120">2 minutes</option></select></div>
      <div class="field"><label class="label" for="level">Secret words</label><select id="level"><option value="easy">Easy</option><option value="tricky">Tricky</option><option value="mix">Mixed</option></select></div>
      <div class="field"><label class="label" for="rounds">Rounds</label><select id="rounds"><option>1</option><option>2</option><option>3</option></select></div>
    </div>
    <details class="more"><summary>How to play</summary><ul class="rules" style="margin-top:10px"><li>The speaker secretly sees one word, then gets a random topic.</li><li>They talk about the topic and must <b>use the word naturally</b>.</li><li>When time's up, the class guesses the word.</li><li><b>+2</b> to the speaker if nobody spots it. <b>+1</b> to each student who guesses it.</li></ul></details>
    <div class="row"><button class="primary" id="go">Start game</button></div>`);
  $("#cls").onchange=e=>{const c=CL.byId(e.target.value);if(c){CL.setActive(c.id);$("#names").value=c.students.join("\n");}else{$("#names").value="";$("#names").focus();}$("#bn").innerHTML=c?doneBanner("secret-word"):"";};
  $("#go").onclick=()=>{const names=parseNames($("#names").value);
    if(names.length<2){$("#names").focus();return;}
    if(!$("#cls").value)store.set("sc-names",names.join("\n"));else H.mark($("#cls").value,"secret-word");
    Object.assign(this,{players:names,time:+$("#time").value,level:$("#level").value,rounds:+$("#rounds").value,round:1,idx:0,scores:{},started:true});
    names.forEach(n=>this.scores[n]=0);this.newTurn();};},
 lvl(){return this.level==="mix"?(Math.random()<.5?"easy":"tricky"):this.level;},
 newTurn(){this.cur={speaker:this.players[this.idx],word:pickFrom(SW_WORDS[this.lvl()],this.usedW),topic:pickFrom(SW_TOPICS,this.usedT),guessers:new Set()};this.pass();},
 pass(){const c=this.cur;
  this.shell(`
    <div class="row" style="justify-content:space-between"><span class="label">Round ${this.round} of ${this.rounds} · Turn ${this.idx+1}/${this.players.length}</span><span class="chip">Eyes off the screen!</span></div>
    <h2>${esc(c.speaker)}, come and look</h2>
    <p class="note">Press and hold the envelope to see your secret word. Everyone else, look away.</p>
    <div class="envelope" id="env" role="button" tabindex="0" aria-label="Hold to reveal the secret word">
      <div class="closed" id="closed"><span class="stamp">TOP SECRET</span><span>Hold to open</span></div>
      <div id="open" hidden><div class="label">Your secret word</div><div class="word">${esc(c.word)}</div></div></div>
    <div class="row"><button class="primary" id="ready" disabled>I've got it. Show the topic</button><button class="ghost" id="swap">Different word</button></div>`);
  const env=$("#env"),show=v=>{$("#open").hidden=!v;$("#closed").hidden=v;if(v)$("#ready").disabled=false;};
  env.addEventListener("pointerdown",e=>{e.preventDefault();show(true)});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>env.addEventListener(ev,()=>show(false)));
  env.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();show(true)}});
  env.addEventListener("keyup",()=>show(false));env.addEventListener("contextmenu",e=>e.preventDefault());
  $("#swap").onclick=()=>{c.word=pickFrom(SW_WORDS[this.lvl()],this.usedW);this.pass();};
  $("#ready").onclick=()=>{T.left=T.total=this.time;this.speak();};},
 speak(){const c=this.cur;
  this.shell(`<span class="label">${esc(c.speaker)} is speaking about…</span><div class="topic">${esc(c.topic)}</div>${timerBlock()}
    <div class="row"><button class="red" id="play">Start timer</button><button class="ghost" id="newTopic">New topic</button><button class="primary" id="done">Finish</button></div>`);
  wireToggle($("#play"),()=>this.guess());
  $("#newTopic").onclick=()=>{c.topic=pickFrom(SW_TOPICS,this.usedT);stopTimer();T.left=T.total;this.speak();};
  $("#done").onclick=()=>{stopTimer();this.guess();};},
 guess(){const c=this.cur,others=this.players.filter(p=>p!==c.speaker);
  this.shell(`<span class="label">Time's up</span><h2>What was ${esc(c.speaker)}'s secret word?</h2>
    <div class="row"><button class="red" id="rev">Reveal the word</button></div>
    <div id="after" hidden><div class="reveal"><span class="label">The secret word was</span><span class="word">${esc(c.word)}</span></div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px"><span class="label">Who guessed it?</span>
        <div class="pick">${others.map(p=>`<button aria-pressed="false" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div>
        <label class="row note"><input type="checkbox" id="notUsed" style="width:auto"> ${esc(c.speaker)} never used the word (no points)</label>
        <div class="row"><button class="primary" id="score">Give points &amp; next</button></div></div></div>`);
  $("#rev").onclick=()=>{$("#after").hidden=false;$("#rev").disabled=true;};
  app.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);on?c.guessers.add(b.dataset.p):c.guessers.delete(b.dataset.p);});
  $("#score").onclick=()=>{if(!$("#notUsed").checked){if(!c.guessers.size)this.scores[c.speaker]+=2;c.guessers.forEach(p=>this.scores[p]+=1);}
    this.idx++;if(this.idx>=this.players.length){this.idx=0;this.round++;}
    this.round>this.rounds?this.end():this.newTurn();};},
 sorted(){return Object.entries(this.scores).sort((a,b)=>b[1]-a[1]);},
 renderScores(){const s=this.sorted(),top=s.length?s[0][1]:0;$("#scoreList").innerHTML=s.map(([n,p])=>`<li class="${p===top&&p>0?"lead":""}"><span>${esc(n)}</span><span class="pts">${p}</span></li>`).join("");},
 end(){const s=this.sorted(),top=s[0][1],w=s.filter(x=>x[1]===top).map(x=>x[0]);
  this.shell(`<span class="label">Game over</span><span class="stamp" style="align-self:flex-start">CASE CLOSED</span>
    <h2>${w.length>1?"It's a tie":"Winner"}: ${w.map(esc).join(" & ")} (${top} pts)</h2>
    <p class="note">Follow-up: which secret word was the hardest to hide?</p>
    <div class="row"><button class="primary" id="again">Play again</button><button class="ghost" id="reset">Change players</button></div>`);
  $("#again").onclick=()=>{this.round=1;this.idx=0;this.players.forEach(n=>this.scores[n]=0);this.newTurn();};
  $("#reset").onclick=()=>this.setup();}
};

/* ---------- Small Talk Grid ---------- */
const STG={
 A2:[["The weather today","Is it hot or cold today?","What do you do on rainy days?"],["Your weekend","What did you do last weekend?","What are you doing this Saturday?"],["Food you love","What's your favourite dish?","Who cooks at home?"],["Your family","How many people are in your family?","Who are you most like?"],["Pets","Do you have a pet?","What animal would you like?"],["Your bedroom","What's in your bedroom?","What would you change?"],["Breakfast","What do you have for breakfast?","Sweet or savoury?"],["Sports","What sports do you play or watch?","Which sport is boring?"],["Music","What music do you listen to?","Can you play an instrument?"],["Your best friend","How did you meet?","What do you do together?"],["Your town","What's good about your town?","Where do you meet friends?"],["Birthdays","How do you celebrate?","What was your best birthday?"],["Clothes","What are you wearing today?","Where do you buy clothes?"],["School","What's your favourite subject?","What's your least favourite?"],["TV and films","What do you watch?","Who's your favourite actor?"],["Holidays","Where do you go on holiday?","Beach or mountains?"]],
 B1:[["Your last holidays","Where did you go?","What was the best moment?"],["Video games","Do you play? What?","Are games a waste of time?"],["The weather lately","Has it been strange recently?","Your perfect weather?"],["Your neighbourhood","What's it like?","Has it changed much?"],["A good series","What are you watching?","Would you recommend it?"],["Weekend plans","Any plans this weekend?","Your ideal Saturday?"],["Your phone","How much do you use it?","Which app can't you live without?"],["Cooking","Can you cook? What?","Worst kitchen disaster?"],["Public transport","How do you get around?","What annoys you on the bus or metro?"],["Concerts & festivals","Best concert you've been to?","Who would you love to see live?"],["Shopping","Do you enjoy it?","Online or in shops?"],["Hobbies","What do you do in your free time?","A hobby you'd like to try?"],["Sleep","Early bird or night owl?","How many hours do you sleep?"],["Work or studies","What do you do?","What's the hardest part?"],["Coffee or tea","How do you take it?","Favourite café?"],["Childhood memories","A favourite toy?","Something you miss?"]],
 B2:[["Working from home","Have you tried it?","Pros and cons?"],["Travel plans","Next place on your list?","Plan everything or improvise?"],["Social media habits","Which do you use most?","Has it changed how you socialise?"],["A book you've read","What was it about?","Would it work as a film?"],["Fitness trends","Gym, running, yoga…?","A trend you don't get?"],["Living abroad","Would you live abroad?","What would you miss most?"],["Extreme weather","Heatwaves, storms… experiences?","Is it getting worse?"],["Streaming vs cinema","Where do you watch films?","Is cinema dying?"],["Learning languages","How did you learn English?","Which language next?"],["Local festivals","Your favourite local celebration?","Too touristy?"],["Your commute","How long does it take?","How do you use the time?"],["Gadgets","One gadget you can't live without?","An overrated one?"],["Tourism in your city","Good or bad for locals?","Tips for visitors?"],["Goals this year","Any resolutions?","Have you kept them?"],["Food trends","Tried anything new lately?","A trend that should disappear?"],["Small talk itself","Are you good at it?","Topics to avoid?"]]
};
const STGame={g:byId("small-talk-grid"),level:"B1",mode:"class",pairs:[],turn:0,cells:[],time:60,
 randomPairs(list){const a=shuffle(list),out=[];for(let i=0;i<a.length;i+=2)out.push(a.slice(i,i+2));
   if(out.length>1&&out[out.length-1].length===1)out[out.length-2].push(out.pop()[0]);return out.map(p=>p.join(" & ")).join("\n");},
 shell(inner){app.innerHTML=`<div class="narrow">${gameHeader(this.g)}
   <main class="card" id="screen" aria-live="polite">${inner}</main>
   ${this.mode==="race"&&this.cells.length?`<section class="card"><div class="label">Pairs</div><ol class="scores" id="scoreList"></ol></section>`:""}</div>`;
   if(this.mode==="race"&&this.cells.length)this.renderScores();},
 setup(){this.cells=[];const a=CL.active(),savedPairs=store.get("sc-pairs","");
  this.shell(`
    <div id="bn">${doneBanner("small-talk-grid")}</div>
    <div class="row">
      <div class="field"><label class="label" for="lvl">Level</label><select id="lvl">${Object.keys(STG).map(l=>`<option ${l===this.level?"selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label class="label" for="time">Time</label><select id="time"><option value="45">45 seconds</option><option value="60" selected>1 minute</option><option value="90">1.5 minutes</option><option value="120">2 minutes</option></select></div>
      ${classField("cls")}
    </div>
    <div class="field"><span class="label">Mode</span>
      <div class="seg" role="group"><button data-m="class" aria-pressed="${this.mode==="class"}">All pairs at once</button><button data-m="race" aria-pressed="${this.mode==="race"}">Race between pairs</button></div>
      <span class="note" id="modeNote"></span></div>
    <div id="pairsBox" class="field"><div class="row" style="justify-content:space-between"><label class="label" for="pairs">Pairs</label><button class="ghost" id="mkPairs" style="padding:6px 12px">Shuffle pairs</button></div>
      <textarea id="pairs">${esc(a?this.randomPairs(a.students):savedPairs)}</textarea><span class="note">One pair per line, up to 8.</span></div>
    <details class="more"><summary>How to play</summary><ul class="rules" style="margin-top:10px"><li>Choose a square: that's your topic.</li><li>Talk with your partner for <b>the whole time</b>. Ask follow-up questions, react, keep it going.</li><li>A silence of more than <b>3 seconds</b> and the square is lost.</li></ul></details>
    <div class="row"><button class="primary" id="go">Show the grid</button></div>`);
  const setMode=m=>{this.mode=m;app.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
    $("#pairsBox").hidden=m!=="race";
    $("#modeNote").textContent=m==="race"?"Pairs take turns. Survive the minute and the square is yours.":"You pick a square and every pair talks at the same time.";};
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode(this.mode);
  const shuffleFrom=()=>{const c=CL.byId($("#cls").value);if(c)$("#pairs").value=this.randomPairs(c.students);};
  $("#cls").onchange=e=>{const c=CL.byId(e.target.value);if(c){CL.setActive(c.id);shuffleFrom();}else{$("#pairs").value="";}$("#bn").innerHTML=c?doneBanner("small-talk-grid"):"";};
  $("#mkPairs").onclick=shuffleFrom;
  $("#go").onclick=()=>{this.level=$("#lvl").value;this.time=+$("#time").value;
    if(this.mode==="race"){const p=parseNames($("#pairs").value).slice(0,8);if(p.length<2){$("#pairs").focus();return;}store.set("sc-pairs",p.join("\n"));this.pairs=p.map(n=>({name:n,pts:0}));}
    if($("#cls").value)H.mark($("#cls").value,"small-talk-grid");
    this.turn=0;this.cells=STG[this.level].map(([t,...q])=>({t,q,owner:null,used:false}));this.grid();};},
 grid(){const race=this.mode==="race",cur=race?this.pairs[this.turn]:null,left=this.cells.filter(c=>c.owner==null&&!c.used).length;
  this.shell(`
    <div class="row" style="justify-content:space-between"><span class="label">${this.level} grid · ${left} squares left</span>
      ${race?`<span class="turn p${this.turn}"><span class="dot"></span>${esc(cur.name)}'s turn</span>`:`<span class="note">Tap a square to start</span>`}</div>
    <div class="stg">${this.cells.map((c,i)=>{const o=c.owner!=null;return `<button class="cell ${o?"done p"+c.owner:""} ${c.used&&!o?"used":""}" data-i="${i}" ${o||c.used?"disabled":""}>${esc(c.t)}${o?`<small>${esc(this.pairs[c.owner].name.split(/[ &]/)[0])}</small>`:c.used?`<small>✕</small>`:""}</button>`;}).join("")}</div>
    <div class="row"><button class="ghost" id="rand" ${left?"":"disabled"}>Random square</button><button class="ghost" id="newGrid">Change settings</button></div>`);
  app.querySelectorAll(".cell:not(:disabled)").forEach(b=>b.onclick=()=>this.talk(+b.dataset.i));
  $("#rand").onclick=()=>{const free=this.cells.map((c,i)=>i).filter(i=>this.cells[i].owner==null&&!this.cells[i].used);if(free.length)this.talk(free[Math.floor(Math.random()*free.length)]);};
  $("#newGrid").onclick=()=>this.setup();
  if(!left)this.over();},
 talk(i){const c=this.cells[i],race=this.mode==="race";T.left=T.total=this.time;
  this.shell(`
    <span class="label">${race?esc(this.pairs[this.turn].name)+" are talking about…":"Everyone, talk about…"}</span>
    <div class="topic">${esc(c.t)}</div>
    <div><span class="label">Ideas to get started</span><ul class="prompts">${c.q.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>
    ${timerBlock()}
    <div class="row"><button class="red" id="play">Start timer</button>
      ${race?`<button class="ghost" id="fail">Awkward silence!</button>`:`<button class="ghost" id="back">Back to grid</button>`}</div>
    <p class="note">Keep it going: <i>Really? · Why's that? · Me too! · What about you?</i></p>`);
  wireToggle($("#play"),()=>this.result(i,true));
  if(race)$("#fail").onclick=()=>{stopTimer();this.result(i,false);};else $("#back").onclick=()=>{stopTimer();c.used=true;this.grid();};},
 result(i,ok){const c=this.cells[i],race=this.mode==="race";
  if(!race){c.used=true;this.shell(`<span class="label">Time's up</span><h2>Nice work! Swap partners?</h2>
    <p>Which pair never stopped talking? What was the best follow-up question you heard?</p>
    <div class="row"><button class="primary" id="g">Back to the grid</button></div>`);$("#g").onclick=()=>this.grid();return;}
  const p=this.pairs[this.turn];
  if(ok){c.owner=this.turn;p.pts++;}else{c.used=true;}
  this.shell(`<span class="label">${ok?"Survived!":"Silence…"}</span>
    <h2>${ok?`${esc(p.name)} win “${esc(c.t)}”`:`${esc(p.name)} lose “${esc(c.t)}”`}</h2>
    <div class="row"><button class="primary" id="nx">Next pair</button>${ok?`<button class="ghost" id="undo">Actually, there was a silence</button>`:""}</div>`);
  $("#nx").onclick=()=>{this.turn=(this.turn+1)%this.pairs.length;this.grid();};
  if(ok)$("#undo").onclick=()=>{c.owner=null;c.used=true;p.pts--;this.turn=(this.turn+1)%this.pairs.length;this.grid();};},
 renderScores(){const s=this.pairs.map((p,i)=>({...p,i})).sort((a,b)=>b.pts-a.pts),top=s[0].pts;
  $("#scoreList").innerHTML=s.map(p=>`<li class="${p.pts===top&&p.pts>0?"lead":""}"><span class="turn p${p.i}"><span class="dot"></span>${esc(p.name)}</span><span class="pts">${p.pts}</span></li>`).join("");},
 over(){if(this.mode!=="race")return;const s=[...this.pairs].sort((a,b)=>b.pts-a.pts),top=s[0].pts,w=s.filter(p=>p.pts===top).map(p=>p.name);
  $("#screen").insertAdjacentHTML("beforeend",`<div class="reveal"><span class="label">Grid complete</span><h2>${w.length>1?"It's a tie":"Winners"}: ${w.map(esc).join(" & ")} (${top} squares)</h2></div>`);}
};

route();
