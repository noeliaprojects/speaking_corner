<title>Speaking Corner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: quiet hub (search, filters, plain activity cards grouped by type); each activity opens a white, projector-ready slide with teacher tools underneath. One accent colour, one typeface. */
:root{
  --bg:#f7f7f4; --paper:#ffffff; --ink:#1f2427; --muted:#6b7176; --line:#e5e5e0;
  --stamp:#2a6b61; --stamp-soft:#e7f0ed; --ok:#2a6b61; --ok-soft:#e7f0ed; --warn:#8a5a12; --warn-soft:#f6eedf;
  --c-warm:#2a6b61; --c-you:#2a6b61; --c-opinion:#2a6b61; --c-game:#2a6b61;
  --stage:#ffffff; --stage-2:#f4f4f1; --stage-ink:#1f2427; --stage-muted:#6b7176;
  --display:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.narrow{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4.5vw,2.1rem);margin:0;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
h1 span{color:var(--stamp)}
h2{font-size:1.2rem;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:1.08rem;margin:0}
p{margin:0;max-width:65ch}
.sub{color:var(--muted)}
.label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,4vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:.85rem;color:var(--muted)}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button.primary,.btn.primary{background:var(--ink);color:var(--paper)}
button.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
button.ghost,.btn.ghost{border-color:var(--line);font-weight:600;background:var(--paper)}
button.ghost:hover,.btn.ghost:hover{border-color:var(--muted)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
textarea,select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:120px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 170px}
a{color:inherit}
.back{align-self:flex-start;text-decoration:none;font-weight:600;color:var(--muted)}
.back:hover{color:var(--ink)}


/* Lesson planning */
.lesson-card{position:relative;min-width:0;display:flex;flex-direction:column}
.lesson-card .act{flex:1}
.lesson-card .top-row{padding-left:35px}
button.lesson-add{position:absolute;z-index:2;top:19px;left:20px;width:26px;height:26px;min-width:26px;display:flex;justify-content:center;align-items:center;border:1px solid var(--stamp);border-radius:8px;background:var(--paper);color:var(--stamp);font-size:1.2rem;font-weight:500;line-height:1;padding:0;box-shadow:none;transition:background .15s,color .15s}
button.lesson-add:hover,button.lesson-add:focus-visible{background:var(--stamp);color:#fff}
button.lesson-add::after{content:"Add to lesson";position:absolute;top:calc(100% + 8px);left:0;background:var(--ink);color:#fff;border-radius:6px;padding:6px 9px;font-size:.78rem;font-weight:500;line-height:1.2;white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(-3px);transition:opacity .12s,transform .12s;visibility:hidden}
button.lesson-add:hover::after,button.lesson-add:focus-visible::after{opacity:1;transform:translateY(0);visibility:visible}
@media (prefers-reduced-motion:reduce){button.lesson-add,button.lesson-add::after{transition:none}}
.lp-list{display:flex;flex-direction:column;gap:8px}
.lp-summary{border:1px solid var(--line);border-radius:10px;text-decoration:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;background:var(--bg)}
.lp-summary:hover{border-color:var(--muted)}.lp-summary span:first-child{display:flex;flex-direction:column;gap:3px;min-width:0}
.lp-summary small,.lp-step-name small{display:block;color:var(--muted);font-size:.82rem;font-weight:400}.lp-summary span:last-child{white-space:nowrap}
.lp-steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:lp}
.lp-step{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);counter-increment:lp}
.lp-step:before{content:counter(lp) ".";font-weight:700;color:var(--muted)}
.lp-tick{display:flex;align-items:center}.lp-tick input{width:20px;height:20px;margin:0;cursor:pointer}.lp-step-name{flex:1 1 170px;min-width:0}
.lp-actions{display:flex;flex-wrap:wrap;gap:5px}.lp-actions button{padding:7px 10px}
.lp-overlay{position:fixed;inset:0;background:rgba(25,30,34,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.lp-dialog{width:min(100%,490px);max-height:90vh;overflow-y:auto;box-shadow:0 15px 60px rgba(0,0,0,.2)}
@media(max-width:580px){.lp-step-name{flex-basis:calc(100% - 85px)}.lp-actions{width:100%;justify-content:flex-end}}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top nav{display:flex;gap:8px;flex-wrap:wrap}
.classpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.classpick select{width:auto;min-width:0;max-width:100%;padding:7px 10px;font-weight:700}
.filters{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips{align-items:center}
.chips button{padding:5px 12px;border-width:1px;border-color:var(--line);font-weight:500;border-radius:99px;font-size:.92rem}
.grsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grsel select{width:auto;max-width:100%;background:var(--paper);padding:7px 12px;border-radius:99px;font-weight:500}
.focus{background:var(--stamp-soft);border-radius:8px;padding:10px 12px;font-size:.95rem}
.chips-l{font-size:.85rem;color:var(--muted);margin-right:4px}
.search input{background:var(--paper);padding:12px 14px;font-size:1rem;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gram{display:flex;gap:6px;flex-wrap:wrap}
.gram span{font-size:.75rem;font-weight:600;color:var(--stamp);background:var(--stamp-soft);border-radius:99px;padding:2px 9px}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.top nav{align-items:center}
.top .classpick{padding:4px 4px 4px 12px;border-radius:8px}

/* activity cards */
.cat{display:flex;flex-direction:column;gap:12px}
.cat-h{display:flex;align-items:baseline;gap:10px}
.cat-h i{display:none}
.cat-h h2{font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.act{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;min-width:0;transition:border-color .15s,box-shadow .15s}
.act:hover{border-color:#cfcfc8;box-shadow:0 2px 10px rgba(30,36,40,.06)}
.act h3{font-weight:700;letter-spacing:-.01em}
.act h3{padding-right:4px}
.act p{font-size:.93rem;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.lvl{font-size:.75rem;font-weight:600;padding:1px 0;color:var(--ink)}
.fmt{font-size:.75rem;font-weight:500;color:var(--muted)}
.flag{font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:99px}
.flag.print{background:var(--warn-soft);color:var(--warn)}
.flag.done{background:var(--ok-soft);color:var(--ok)}
.flag.app{background:var(--stamp-soft);color:var(--stamp)}
.c-warm{--cc:var(--c-warm)}.c-you{--cc:var(--c-you)}.c-opinion{--cc:var(--c-opinion)}.c-game{--cc:var(--c-game)}
.empty{color:var(--muted);padding:20px;text-align:center}

/* banners */
.banner{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:700}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.print{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}

/* stage (deliberately one dark look in both themes: it is projected) */
.stage{position:relative;background:var(--stage);border:1px solid var(--line);box-shadow:0 1px 3px rgba(30,36,40,.05);color:var(--stage-ink);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  padding:clamp(18px,4.5vw,52px);min-height:min(66vh,560px);gap:18px;--acc:#2a6b61;--tint:#f4f4f1}
@media (min-width:760px){.stage{aspect-ratio:16/9;min-height:0}}

.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;padding:max(4vh,24px) max(5vw,24px)}
.s-eyebrow{font-size:clamp(.7rem,1.3vw,.9rem);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--stage-muted);display:flex;justify-content:space-between;gap:10px}
.s-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.4vw,26px);min-height:0}
.s-title{font-family:var(--display);font-weight:800;letter-spacing:-.025em;font-size:clamp(1.8rem,5vw,3.6rem);line-height:1.05;text-wrap:balance;margin:0}
.s-instr{font-size:clamp(1.05rem,2.3vw,1.7rem);line-height:1.35;max-width:46ch;color:var(--stage-ink)}
.s-ex{font-size:clamp(.95rem,1.8vw,1.3rem);color:var(--stage-muted);border-left:4px solid var(--acc);padding-left:14px;max-width:60ch}
.s-big{font-size:clamp(1.8rem,5.4vw,4.2rem);font-weight:700;letter-spacing:-.02em;line-height:1.1;text-wrap:balance;margin:0}
.s-big.mid{font-size:clamp(1.5rem,4.2vw,3.2rem)}
.s-q{margin:0;padding-left:1.1em;font-size:clamp(1rem,2vw,1.5rem);display:flex;flex-direction:column;gap:4px;color:var(--stage-ink)}
.s-q li::marker{color:var(--acc)}
.s-ph{display:flex;flex-wrap:wrap;gap:8px}
.s-ph span{background:var(--stage-2);border:0;border-radius:99px;padding:6px 14px;font-size:clamp(.8rem,1.5vw,1.1rem);font-weight:500;color:var(--stage-ink)}
.s-ph b{color:var(--stage-muted);font-weight:600;font-size:.8em;letter-spacing:.06em;text-transform:uppercase;align-self:center;margin-right:4px}
.s-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(10px,2vw,24px);align-items:stretch}
.s-opt{background:var(--tint);border-radius:14px;padding:clamp(14px,2.5vw,28px);display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0}
.s-opt small{font-size:clamp(.7rem,1.3vw,.95rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.s-opt div{font-size:clamp(1.2rem,3.3vw,2.5rem);font-weight:700;line-height:1.15;text-wrap:balance}
.s-opt img,.s-img img{width:100%;height:auto;max-height:52vh;object-fit:cover;border-radius:10px;max-width:100%}
.s-opt.ph{position:relative;padding:0;overflow:hidden;justify-content:flex-end}
.s-opt.ph img{position:absolute;inset:0;width:100%;height:100%;max-height:none;border-radius:0;object-fit:cover}
.s-opt.ph .cap{position:relative;padding:clamp(40px,6vw,80px) clamp(12px,2vw,22px) clamp(10px,1.6vw,18px);background:linear-gradient(to top,rgba(10,14,30,.82),rgba(10,14,30,0));display:flex;flex-direction:column;gap:4px}
.s-opt.ph .cap small{color:#fff;opacity:.85}
.s-opt.ph .cap div{color:#fff;font-size:clamp(1.05rem,2.6vw,2rem)}
.s-vs.ph{flex:1 1 0;min-height:200px}
.s-or{align-self:center;font-weight:700;color:var(--stage-muted);font-size:clamp(1rem,2.4vw,1.8rem)}
.s-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.4vw,14px)}
.s-tiles div{background:var(--tint);border-radius:12px;padding:clamp(10px,1.8vw,20px);font-size:clamp(.9rem,2vw,1.45rem);font-weight:600;line-height:1.2;display:flex;align-items:center;min-height:clamp(56px,9vw,110px)}
.s-tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.s-tiles div.ptile{position:relative;padding:0;overflow:hidden;align-items:flex-end;min-height:clamp(110px,15vw,220px)}
.s-tiles div.ptile.sm{min-height:clamp(70px,8vw,110px)}
.ptile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ptile span{position:relative;width:100%;padding:clamp(22px,3vw,40px) clamp(8px,1.2vw,14px) clamp(6px,1vw,12px);background:linear-gradient(to top,rgba(10,14,30,.85),rgba(10,14,30,0));color:#fff}
.s-tiles.five div.ptile span{font-size:clamp(.7rem,1.3vw,1rem)}
.s-tiles.n2 div,.s-tiles.n3 div{font-size:clamp(1.1rem,2.8vw,2.1rem);min-height:clamp(90px,16vw,220px)}
.s-tiles.n4 div{font-size:clamp(1rem,2.4vw,1.8rem);min-height:clamp(70px,11vw,150px)}
.s-tiles.five div{font-size:clamp(.78rem,1.6vw,1.15rem);min-height:clamp(48px,7vw,90px)}
.s-stat{font-size:clamp(1.4rem,4.2vw,3.2rem);font-weight:700;line-height:1.12;text-wrap:balance;margin:0}
.s-tag{align-self:flex-start;font-size:clamp(.72rem,1.3vw,.95rem);font-weight:600;color:var(--acc);background:var(--stamp-soft);border-radius:99px;padding:4px 12px}
.s-split{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(14px,3vw,36px);align-items:center}
.s-no{display:flex;flex-direction:column;gap:6px}
.s-no span{font-size:clamp(1rem,2.4vw,1.8rem);font-weight:800;color:var(--stage-muted);text-decoration:line-through;text-decoration-color:var(--acc);text-decoration-thickness:3px}
.s-cover{position:absolute;inset:0;background:var(--stage);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:2}
.s-cover .s-title{color:var(--acc)}
.s-overlay{position:absolute;top:clamp(10px,2vw,20px);right:clamp(10px,2vw,20px);display:flex;gap:8px;z-index:3}
.s-pill{background:var(--stage-2);color:var(--stage-ink);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-family:var(--mono);font-weight:700;font-size:clamp(1rem,2.2vw,1.6rem);font-variant-numeric:tabular-nums}
.s-pill.low{background:#c9381f;color:#fff;border-color:#c9381f}
.s-pick{position:absolute;left:50%;bottom:clamp(14px,3vw,28px);transform:translateX(-50%);background:var(--acc);color:#fff;box-shadow:0 6px 20px rgba(27,35,64,.2);border-radius:14px;padding:10px 22px;font-weight:700;font-size:clamp(1.2rem,3vw,2.2rem);z-index:3;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.s-up{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#fff;color:#c9381f;font-family:var(--display);font-size:clamp(2rem,8vw,6rem);text-align:center;animation:flash .5s ease-in-out 4 alternate}
@keyframes flash{from{color:#c9381f}to{color:#f4c7bd}}
@media (prefers-reduced-motion:reduce){.s-up{animation:none}}
.s-nav{position:absolute;bottom:14px;right:14px;display:none;gap:8px;z-index:4}
.stage:fullscreen .s-nav{display:flex}
.s-nav button{background:var(--stage-2);color:var(--stage-ink);border:1px solid var(--line);padding:10px 16px;opacity:.7}
.s-nav button:hover{opacity:1}
@media (max-width:640px){.s-vs{grid-template-columns:1fr}.s-or{justify-self:center}.s-tiles,.s-tiles.five{grid-template-columns:repeat(2,minmax(0,1fr))!important}.s-split{grid-template-columns:1fr}}

/* controls under stage */
.ctrl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ctrl .count{font-family:var(--mono);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button,.tools select{padding:8px 12px;font-size:.92rem}
.tools select{width:auto;border-width:2px;border-color:var(--line);font-weight:700}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:7px 12px;border-width:1px;border-color:var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.guide p{font-size:1rem}
.guide ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

/* games (interactive) */
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.rules b{color:var(--ink)}
.chip{display:inline-block;font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--stamp-soft);color:var(--stamp)}
.envelope{border:2px dashed var(--line);border-radius:14px;min-height:170px;display:grid;place-items:center;text-align:center;padding:20px;user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:none}
.envelope .closed{display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted)}
.stamp{font-family:var(--display);font-weight:800;color:var(--stamp);border:3px solid var(--stamp);padding:6px 14px;border-radius:6px;transform:rotate(-6deg);font-size:1rem;letter-spacing:.05em;display:inline-block}
.word{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,8vw,3rem);color:var(--stamp);word-break:break-word}
.topic{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;line-height:1.2;text-wrap:balance}
.timer{font-family:var(--mono);font-weight:700;font-size:clamp(3rem,14vw,5.5rem);font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.timer.low{color:var(--stamp)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s linear}
.scores{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.scores li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.scores li.lead{background:var(--stamp-soft);font-weight:800}
.scores .pts{font-family:var(--mono);font-weight:700}
.reveal{background:var(--ok-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{padding:8px 12px;border-width:1px;font-weight:600}
.pick button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.bank{display:flex;flex-direction:column;gap:12px;margin-top:12px}
details.more summary{cursor:pointer;font-weight:800}
.stg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cell{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 6px;min-height:76px;font-weight:800;font-size:clamp(.72rem,2.6vw,.95rem);line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;word-break:break-word}
.cell:hover:not(:disabled){border-color:var(--ink)}
.cell.done{background:var(--pc);border-color:var(--pb);opacity:1;cursor:default}
.cell.used{opacity:.45}

function renderList(){

function hasImgs(d){return Object.keys(IMAGES).some(k=>k.startsWith(d.id+":")&&k!==d.id+":cover");}
function cardFaces(d){return d.cards.map((c,i)=>{const im=k=>IMAGES[d.id+":"+k]||"";
  if(d.kind==="versus")return {html:`<div class="pc-vs"><div>${im(i+"a")?`<img src="${im(i+"a")}" alt="">`:""}<b>${esc(c.a)}</b></div><i>or</i><div>${im(i+"b")?`<img src="${im(i+"b")}" alt="">`:""}<b>${esc(c.b)}</b></div></div>`,img:""};

  if(d.kind==="stat")return {html:`<p class="pc-main">“${esc(c.s)}”</p><p class="pc-sub">${esc(c.q)}</p>`,img:""};

  return {html:`<p class="pc-main">${esc(c)}</p>`,img:im(i)};});}
function printCards(d,n,withImg,upper){
  const L={2:[1,2],4:[2,2],6:[2,3],8:[2,4],9:[3,3],12:[3,4],16:[4,4]}[n],faces=cardFaces(d),pages=[];
  for(let i=0;i<faces.length;i+=n)pages.push(faces.slice(i,i+n));
  let a=$("#printArea");if(!a){a=document.createElement("div");a.id="printArea";document.body.appendChild(a);}
  a.className=`pa-${n} ${withImg?"pa-img":"pa-noimg"} ${upper?"pa-up":""}`;
  a.style.setProperty("--cols",L[0]);a.style.setProperty("--rows",L[1]);
  a.innerHTML=pages.map(pg=>`<section class="pa-page">${pg.map(f=>`<div class="pc">${withImg&&f.img?`<img class="pc-img" src="${f.img}" alt="">`:""}<div class="pc-txt">${f.html}</div><span class="pc-foot">${esc(d.name)}</span></div>`).join("")}${Array(n-pg.length).fill('<div class="pc pc-empty"></div>').join("")}</section>`).join("");
  if(!withImg)a.querySelectorAll(".pc-vs img,.pc-list img").forEach(x=>x.remove());
  const imgs=[...a.querySelectorAll("img")];
  Promise.all(imgs.map(x=>x.complete?1:new Promise(r=>{x.onload=x.onerror=r;}))).then(()=>{try{window.print();}catch(e){}});
}
function stopDeck(){if(D){clearInterval(D.tid);document.removeEventListener("keydown",D.key);}D=null;}
const PER_OK=d=>(d.kind==="grid"||d.kind==="single")&&!d.reveal;
const ctext=c=>typeof c==="object"?c.t:c;
function perOf(d){if(!PER_OK(d))return 1;const p=store.get("sc-per",{});return p[d.id]||1;}
function buildSlides(d,order){const s=[{t:"title"}];
  if(d.reveal){order.forEach(i=>{s.push({t:"card",i});s.push({t:"ans",i});});}
  else if(d.kind==="grid"||d.kind==="single"){const per=perOf(d);if(per===1)order.forEach(i=>s.push({t:"card",i}));else for(let i=0;i<order.length;i+=per)s.push({t:"grid",idx:order.slice(i,i+per)});}
  else if(d.kind==="pick"){s.push({t:"pick"});}
  else order.forEach(i=>s.push({t:"card",i}));
  s.push({t:"end"});return s;}
function deckView(d){
  const order=[...d.cards.keys()];
  D={d,order,slides:buildSlides(d,order),i:0,phr:true,hide:!!d.secret,upper:ONLY_YOUNG(d)||F.age==="3-6"||F.age==="6-8",tid:null,left:0,picked:[],pickName:null};
  const p=PRINT[d.id],a=CL.active();
  app.innerHTML=`<div class="wrap" style="gap:14px">
    <div class="top">${LP.backLink()}${classSwitcher()}</div>
    <div id="bn">${doneBanner(d.id)}</div>
    ${d.print?`<div class="banner print"><span>${d.print==="required"?"This activity needs printed cards.":"Optional printed cards"} · ${p.what}</span><a class="btn primary" href="${p.file}" target="_blank" rel="noopener">Open PDF to print</a></div>`:""}
    <div class="stage c-${d.cat}" id="stage" tabindex="-1"></div>
    <div class="ctrl"><div class="row"><button class="ghost" id="prev" aria-label="Previous slide">←</button><button class="primary" id="next">Next →</button><span class="count" id="count"></span></div>
      <div class="tools">
        ${PER_OK(d)?`<select id="perSel" aria-label="Cards per slide">${[1,2,3,4,6,9].map(n=>`<option value="${n}" ${perOf(d)===n?"selected":""}>${n} ${n===1?"card":"cards"} per slide</option>`).join("")}</select>`:""}
        <button class="ghost" id="shuf">Shuffle</button>
        ${d.kind==="board"||d.secret?`<button class="ghost" id="hideB" aria-pressed="${!!d.secret}">Hide card</button>`:""}
        <select id="tsel" aria-label="Timer length"><option value="30">0:30</option><option value="60" ${(d.timer||60)===60?"selected":""}>1:00</option><option value="120" ${d.timer===120?"selected":""}>2:00</option><option value="180">3:00</option><option value="300">5:00</option><option value="480">8:00</option></select>
        <button class="ghost" id="tbtn">Timer</button>
        <button class="ghost" id="pickB" ${a?"":"disabled title=\"Choose a class first\""}>Pick a student</button>
        <button class="ghost" id="phB" aria-pressed="true">Phrases</button>
        ${YOUNG(d)?`<button class="ghost" id="upB" aria-pressed="${D.upper}" title="Capital letters for young learners">ABC</button>`:""}
        <button class="ghost" id="fsB">Full screen</button>
        <button class="ghost" id="prB" aria-expanded="false">Print cards</button>
         <button class="ghost" id="addLesson">+ Add to lesson</button>
      </div></div>
    <section class="card" id="prPanel" hidden><h2>Print cards</h2>
      <div class="row">
        <div class="field"><label class="label" for="prN">Cards per A4 page</label><select id="prN">${[2,4,6,8,9,12,16].map(n=>`<option ${n===(store.get("sc-prn",8))?"selected":""}>${n}</option>`).join("")}</select></div>
        <div class="field"><label class="label" for="prImg">Pictures</label><select id="prImg" ${hasImgs(d)?"":"disabled"}><option value="1">With pictures</option><option value="0" ${store.get("sc-primg",1)?"":"selected"}>Text only</option></select></div>
        <div class="field"><label class="label" for="prCase">Letters</label><select id="prCase"><option value="0">Normal</option><option value="1" ${D.upper?"selected":""}>CAPITALS</option></select></div>
      </div>
      <p class="note">${d.cards.length} cards · ${hasImgs(d)?"":"this activity has no pictures · "}cut along the dashed lines. Print at 100% (actual size).</p>
      <div class="row"><button class="primary" id="prGo">Print</button></div></section>
    <section class="card guide"><div class="row" style="justify-content:space-between"><h2>Teacher guide</h2>
      <div class="tabs" role="tablist">${Object.keys(FMTS).map(f=>`<button role="tab" data-f="${f}" aria-selected="false">${FMTS[f]}${d.fmts.includes(f)?"":" (adapted)"}</button>`).join("")}</div></div>
      <div id="gbody"></div>
      ${d.focus?`<p class="focus"><b>Structure focus:</b> ${esc(d.focus)}</p>`:""}
      ${d.printNote?`<p class="note">${esc(d.printNote)}</p>`:""}
      <div class="row" id="doneRow"></div></section></div>`;
  const tabs=app.querySelectorAll(".tabs button");
  const showG=f=>{tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.f===f));const g=(d.guide&&d.guide[f])||GUIDE[d.kind][f];$("#gbody").innerHTML=`<ol>${g.filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;store.set("sc-fmt",f);};
  tabs.forEach(b=>b.onclick=()=>showG(b.dataset.f));
  const pref=store.get("sc-fmt",null);showG(pref&&d.fmts.includes(pref)?pref:d.fmts[0]);
  $("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);
  $("#shuf").onclick=()=>{D.order=shuffle(D.order);D.slides=buildSlides(d,D.order);D.i=Math.min(D.i,1);render();};
  if($("#perSel"))$("#perSel").onchange=e=>{const p=store.get("sc-per",{});p[d.id]=+e.target.value;store.set("sc-per",p);D.slides=buildSlides(d,D.order);D.i=Math.min(D.i,D.slides.length-1);render();};
  if($("#upB"))$("#upB").onclick=()=>{D.upper=!D.upper;$("#upB").setAttribute("aria-pressed",D.upper);render();};
  $("#phB").onclick=()=>{D.phr=!D.phr;$("#phB").setAttribute("aria-pressed",D.phr);render();};
  if($("#hideB"))$("#hideB").onclick=()=>{D.hide=!D.hide;$("#hideB").setAttribute("aria-pressed",D.hide);render();};
  $("#addLesson").onclick=()=>LP.choose(d.id);
  $("#tbtn").onclick=toggleTimer;
  $("#pickB").onclick=pickStudent;
  $("#prB").onclick=()=>{const p=$("#prPanel");p.hidden=!p.hidden;$("#prB").setAttribute("aria-expanded",!p.hidden);if(!p.hidden)p.scrollIntoView({block:"nearest",behavior:"smooth"});};
  $("#prGo").onclick=()=>{const n=+$("#prN").value,im=$("#prImg").value==="1"&&hasImgs(d),up=$("#prCase").value==="1";store.set("sc-prn",n);store.set("sc-primg",im?1:0);printCards(d,n,im,up);};
  $("#fsB").onclick=()=>{const st=$("#stage");try{document.fullscreenElement?document.exitFullscreen():st.requestFullscreen().catch(()=>{});}catch(e){}};
  wireClassSwitcher(()=>{$("#bn").innerHTML=doneBanner(d.id);D.picked=[];$("#pickB").disabled=!CL.active();doneRow();});
  D.key=e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();go(1);}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(-1);}
    else if(e.key==="f"||e.key==="F")$("#fsB").click();
    else if(e.key==="p"||e.key==="P")$("#phB").click();
    else if(e.key==="t"||e.key==="T")toggleTimer();
    else if((e.key==="h"||e.key==="H")&&$("#hideB"))$("#hideB").click();};
  document.addEventListener("keydown",D.key);
  doneRow();render();
}
function doneRow(){const a=CL.active(),r=$("#doneRow");if(!r)return;
  if(!a){r.innerHTML=`<span class="note">Choose a class to keep track of what it has done.</span>`;return;}
  const did=H.dates(a.id,D.d.id).includes(today());
  r.innerHTML=did?`<span class="banner ok">Marked as done today for ${esc(a.name)}</span><button class="ghost" id="undoDone">Undo</button>`
    :`<button class="primary" id="markDone">Mark as done for ${esc(a.name)}</button>`;
  if($("#markDone"))$("#markDone").onclick=()=>{H.mark(a.id,D.d.id);LP.markPlayed(D.d.id);doneRow();};
  if($("#undoDone"))$("#undoDone").onclick=()=>{H.unmarkToday(a.id,D.d.id);doneRow();};}
function go(n){const k=D.i+n;if(k<0||k>=D.slides.length)return;D.i=k;D.pickName=null;render();}
function phrases(d){return D.phr&&d.ph?`<div class="s-ph"><b>Useful language</b>${d.ph.map(p=>`<span>${esc(p)}</span>`).join("")}</div>`:"";}
function img(d,i){const u=IMAGES[d.id+":"+i];return u?`<img src="${u}" alt="">`:"";}
function render(){const d=D.d,s=D.slides[D.i],st=$("#stage"),n=D.slides.length;st.classList.toggle("upper",!!D.upper);
  const cardNo=s.t==="card"?`${D.order.indexOf(s.i)+1} / ${d.cards.length}`:"";
  let body="";
  if(s.t==="title"){
    body=`<div class="s-eyebrow"><span>${CATS[d.cat]} · ${lvRange(d.lv)}</span>${d.gram?`<span>${esc(d.gram.join(" · "))}</span>`:""}</div>`;
    const cv=IMAGES[d.id+":cover"],txt=`<h2 class="s-title">${esc(d.name)}</h2><p class="s-instr">${esc(d.instr)}</p>
      ${d.ex?`<p class="s-ex"><b>Example:</b> ${esc(d.ex)}</p>`:""}${d.note?`<p class="s-ex">${esc(d.note)}</p>`:""}`;
    body+=`<div class="s-body">${cv?`<div class="s-split"><div style="display:flex;flex-direction:column;gap:clamp(12px,2vw,22px)">${txt}</div><div class="s-img"><img src="${cv}" alt=""></div></div>`:txt}</div>${phrases(d)}`;
  }else if(s.t==="ans"&&d.photoOnly){const c=d.cards[s.i],u=IMAGES[d.id+":"+s.i];
    body=`<div class="s-eyebrow"><span>${esc(d.name)}</span><span>${esc(d.ansLabel)}</span></div>
    <div class="s-body">${u?`<div class="s-split"><p class="s-big">${esc(c.ans)}</p><div class="s-img"><img src="${u}" alt=""></div></div>`:`<p class="s-instr">${esc(c.t)}</p><p class="s-big">${esc(c.ans)}</p>`}</div>`;
  }else if(s.t==="ans"){const c=d.cards[s.i];
    body=`<div class="s-eyebrow"><span>${esc(d.name)}</span><span>${esc(d.ansLabel||"The real meaning")}</span></div>
    <div class="s-body"><p class="s-big">${esc(c.t)}</p><p class="s-instr" style="font-size:clamp(1.3rem,3vw,2.3rem);color:var(--acc);font-weight:800">${esc(c.ans)}</p></div>`;
  }else if(s.t==="end"){
    body=`<div class="s-eyebrow"><span>${esc(d.name)}</span></div>
    <div class="s-body"><h2 class="s-title">Well done!</h2><p class="s-instr">${esc(d.end||"Which answer surprised you most today? Share one new thing you learnt about a classmate.")}</p></div>`;
  }else if(s.t==="grid"){
    const k=s.idx.length,cols=k===2||k===4?2:3,first=D.order.indexOf(s.idx[0])+1;
    body=`<div class="s-eyebrow"><span>${esc(d.name)}</span><span>${d.kind==="grid"&&k>3?"Choose three · ":""}${first}–${first+k-1} / ${d.cards.length}</span></div>
    <div class="s-body"><div class="s-tiles n${k}" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${s.idx.map(i=>{const u=IMAGES[d.id+":"+i];return u?`<div class="ptile ${k>4?"sm":""}"><img src="${u}" alt=""><span>${esc(ctext(d.cards[i]))}</span></div>`:`<div>${esc(ctext(d.cards[i]))}</div>`;}).join("")}</div>
      ${d.q&&k<=2?`<ul class="s-q">${d.q.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>`:""}</div>${phrases(d)}`;
  }else if(s.t==="pick"){
    body=`<div class="s-eyebrow"><span>${esc(d.name)}</span><span>Choose five</span></div>
    <div class="s-body"><div class="s-tiles five">${d.cards.map((x,k)=>{const u=IMAGES[d.id+":"+k];return u?`<div class="ptile sm"><img src="${u}" alt=""><span>${esc(x)}</span></div>`:`<div>${esc(x)}</div>`;}).join("")}</div></div>${phrases(d)}`;
  }else{
    const c=d.cards[s.i];let inner="";
    if(d.kind==="single"||d.kind==="grid"){const pic=d.img?img(d,s.i):"";
      const ct=ctext(c),longSub=typeof c==="object"&&c.sub&&(c.sub.length===4||c.sub.some(x=>x.length>28)),sub=longSub?`<div class="s-tiles" style="grid-template-columns:repeat(2,minmax(0,1fr))">${c.sub.map(x=>`<div style="font-size:clamp(.9rem,1.9vw,1.35rem)">${esc(x)}</div>`).join("")}</div>`:typeof c==="object"&&c.sub?`<div class="s-ph" style="gap:10px">${c.sub.map(x=>`<span style="font-size:clamp(1rem,2.4vw,1.7rem);background:var(--tint);border:0">${esc(x)}</span>`).join("")}</div>`:"";
      const txt=d.photoOnly?`<span class="s-tag">${esc(d.revealTag)}</span><p class="s-big mid">${esc(d.q[0])}</p>${pic?"":`<p class="s-ex">Clues: ${esc(ct)}</p>`}<ul class="s-q">${d.q.slice(1).map(q=>`<li>${esc(q)}</li>`).join("")}</ul>`:`${d.reveal?`<span class="s-tag">${esc(d.revealTag||"Real word · invent a meaning")}</span>`:""}<p class="s-big ${ct.length>40?"mid":""}">${esc(ct)}</p>${sub}${d.q?`<ul class="s-q">${d.q.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>`:""}`;
      inner=pic?`<div class="s-split"><div style="display:flex;flex-direction:column;gap:16px">${txt}</div><div class="s-img">${pic}</div></div>`:txt;}
    else if(d.kind==="versus"){const L=d.labels||["",""];
      const pa=d.img?img(d,s.i+"a"):"",pb=d.img?img(d,s.i+"b"):"",ph=pa&&pb;
      const opt=(p,l,x)=>ph?`<div class="s-opt ph">${p}<div class="cap">${l?`<small>${esc(l)}</small>`:""}<div>${esc(x)}</div></div></div>`:`<div class="s-opt">${l?`<small>${esc(l)}</small>`:""}<div>${esc(x)}</div></div>`;
      inner=`<div class="s-vs ${ph?"ph":""}">${opt(pa,L[0],c.a)}<span class="s-or">OR</span>${opt(pb,L[1],c.b)}</div>`;}
    else if(d.kind==="triple"){
      const tl=(x,k)=>{const u=IMAGES[`${d.id}:${s.i}-${k}`];return u?`<div class="ptile"><img src="${u}" alt=""><span>${esc(x)}</span></div>`:`<div ${d.id==="story-chain"?'style="justify-content:center;font-size:clamp(1.2rem,3vw,2.2rem)"':""}>${esc(x)}</div>`;};
      inner=`<div class="s-tiles">${c.map(tl).join("")}</div>${d.id==="story-chain"?"":`<p class="s-instr" style="font-size:clamp(.95rem,1.8vw,1.3rem)">Done it? Want to try it? Would you skip it?</p>`}`;}
    else if(d.kind==="stat"){
      inner=`<span class="s-tag">Imagined headline</span><p class="s-stat">“${esc(c.s)}”</p><ul class="s-q">${d.q.map(q=>`<li>${esc(q)}</li>`).join("")}<li><b>${esc(c.q)}</b></li></ul>`;}
    else if(d.kind==="board"){
      inner=`<div class="s-split"><p class="s-big">${esc(c.w)}</p><div class="s-no"><small class="label" style="color:var(--acc)">Don't say</small>${c.no.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`;}
    body=`<div class="s-eyebrow"><span>${esc(d.name)}</span><span>${cardNo}</span></div><div class="s-body">${inner}</div>${phrases(d)}`;
    if((d.kind==="board"||d.secret)&&D.hide)body+=`<div class="s-cover"><span class="label" style="color:var(--stage-muted)">${d.secret?"Only the speaker looks":"Next word"}</span><p class="s-title">${d.secret?"Eyes closed!":"Ready?"}</p><p class="s-instr">${d.secret?"Everyone except the speaker closes their eyes. Press H to show the card, and H again to hide it.":"Press Hide card again to show it."}</p></div>`;
  }
  st.innerHTML=body+`<div class="s-overlay">${D.tid||D.left>0?`<span class="s-pill ${D.left<=10?"low":""}" id="tpill">${fmt(Math.max(D.left,0))}</span>`:""}</div>
    ${D.up?`<div class="s-up">Time's up!</div>`:""}${D.pickName?`<div class="s-pick">${esc(D.pickName)}</div>`:""}
    <div class="s-nav"><button id="fsPrev" aria-label="Previous">←</button><button id="fsNext" aria-label="Next">→</button></div>`;
  $("#fsPrev").onclick=()=>go(-1);$("#fsNext").onclick=()=>go(1);
  $("#count").textContent=`${D.i+1} / ${n}`;
  $("#prev").disabled=D.i===0;$("#next").disabled=D.i===n-1;
  if(D.i===n-1){const a=CL.active();if(a&&!H.dates(a.id,d.id).includes(today())){$("#doneRow").scrollIntoView({block:"nearest"});}}
}
function toggleTimer(){if(D.tid){clearInterval(D.tid);D.tid=null;D.left=0;$("#tbtn").textContent="Timer";render();return;}
  audio();D.up=false;D.left=+$("#tsel").value;$("#tbtn").textContent="Stop timer";render();
  D.tid=setInterval(()=>{D.left--;if(D.left===10)warnTick();const p=$("#tpill");if(p){p.textContent=fmt(Math.max(D.left,0));p.classList.toggle("low",D.left<=10);}
    if(D.left<=0){clearInterval(D.tid);D.tid=null;beep();D.up=true;$("#tbtn").textContent="Timer";render();setTimeout(()=>{if(D&&!D.tid){D.up=false;D.left=0;render();}},4500);}},1000);}
function pickStudent(){const a=CL.active();if(!a)return;let pool=a.students.filter(s=>!D.picked.includes(s));if(!pool.length){D.picked=[];pool=a.students.slice();}
  const n=pool[Math.floor(Math.random()*pool.length)];D.picked.push(n);D.pickName=n;render();}

/* ---------- classes view ---------- */
function classesView(editId){
  const list=CL.all();
  if(editId===undefined&&!list.length)editId="new";
  const ed=editId==="new"?{id:"",name:"",students:[]}:list.find(c=>c.id===editId);
  app.innerHTML=`<div class="narrow"><a class="back" href="#">← All activities</a>
   <h1>My <span>classes</span></h1>
   ${ed?`<section class="card"><h2>${ed.id?"Edit class":"New class"}</h2>
     <div class="field"><label class="label" for="cName">Group name</label><input id="cName" value="${esc(ed.name)}" placeholder="e.g. B1+ Tuesday 18:00"></div>
     <div class="field"><label class="label" for="cStu">Students, one per line</label><textarea id="cStu" placeholder="For a private student, write just one name">${esc(ed.students.join("\n"))}</textarea></div>
     <span class="note" id="cErr" style="color:var(--stamp)"></span>
     <div class="row"><button class="primary" id="saveC">Save class</button>${list.length?`<button class="ghost" id="cancelC">Cancel</button>`:""}</div></section>`:""}
   <section class="card"><div class="row" style="justify-content:space-between"><h2>Saved classes</h2>${ed?"":`<button class="primary" id="newC">+ New class</button>`}</div>
     ${list.length?`<ul class="clist">${list.map(c=>{const h=H.all()[c.id]||{},n=Object.keys(h).filter(k=>h[k].length).length;return `<li><div><b>${esc(c.name)}</b><span class="note">${c.students.length} ${c.students.length===1?"student":"students"} · ${n} ${n===1?"activity":"activities"} done</span></div>
       <div class="row"><button class="ghost" data-e="${c.id}">Edit</button><button class="ghost" data-d="${c.id}">Delete</button></div></li>`;}).join("")}</ul>`
     :`<p class="note">No classes yet. Fill in the form above to save your first group.</p>`}</section>
   <section class="card"><details class="more"><summary>Back up or move your classes</summary>
     <div class="bank">
       <div class="field"><label class="label" for="exp">Backup code (classes and history)</label><textarea id="exp" readonly>${esc(JSON.stringify({classes:list,history:H.all(),plans:LP.all()}))}</textarea></div>
       <div class="row"><button class="ghost" id="copyB">Copy backup</button><span class="note" id="copyMsg"></span></div>
       <div class="field"><label class="label" for="imp">Restore from a backup</label><textarea id="imp" placeholder="Paste a backup code here"></textarea></div>
       <div class="row"><button class="ghost" id="impB">Restore</button><span class="note" id="impMsg"></span></div>
     </div></details></section></div>`;
  if(ed){
    $("#saveC").onclick=()=>{const name=$("#cName").value.trim(),st=parseNames($("#cStu").value);
      if(!name){$("#cErr").textContent="Give the class a name.";$("#cName").focus();return;}
      if(!st.length){$("#cErr").textContent="Add at least one student.";$("#cStu").focus();return;}
      const l=CL.all();
      if(ed.id){const c=l.find(x=>x.id===ed.id);c.name=name;c.students=st;}
      else{const id="c"+Date.now().toString(36);l.push({id,name,students:st});CL.setActive(id);}
      CL.save(l);classesView(null);};
    if($("#cancelC"))$("#cancelC").onclick=()=>classesView(null);
  }
  if($("#newC"))$("#newC").onclick=()=>classesView("new");
  app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>classesView(b.dataset.e));
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
    if(!b.classList.contains("warn")){b.classList.add("warn");b.textContent="Tap again to delete";return;}
    CL.save(CL.all().filter(c=>c.id!==b.dataset.d));classesView(null);});
  $("#copyB").onclick=()=>{const t=$("#exp"),fb=()=>{t.select();$("#copyMsg").textContent="Selected. Copy it with Ctrl+C.";};
    try{navigator.clipboard.writeText(t.value).then(()=>$("#copyMsg").textContent="Copied.",fb);}catch(e){fb();}};
  $("#impB").onclick=()=>{try{let data=JSON.parse($("#imp").value);const cls=Array.isArray(data)?data:data.classes;if(!Array.isArray(cls))throw 0;
      const l=CL.all(),hist=H.all(),map={};cls.forEach((c,n)=>{if(c&&c.name&&Array.isArray(c.students)){const id=l.some(x=>x.id===c.id)?"c"+Date.now().toString(36)+n:(c.id||"c"+Date.now().toString(36)+n);
        l.push({id,name:String(c.name),students:c.students.map(String)});map[c.id]=id;if(data.history&&data.history[c.id])hist[id]=data.history[c.id];}});
      CL.save(l);store.set("sc-hist",hist);LP.importPlans(data.plans,map);classesView(null);}catch(e){$("#impMsg").textContent="That code isn't valid. Paste the full backup code.";}};
}

/* ---------- info ---------- */
function photoSection(){
  const L=photoList(),done=L.filter(p=>IMAGES[p.key]).length,B=[];
  for(let i=0;i<L.length;i+=10)B.push(L.slice(i,i+10));
  const STYLE="Create 10 SEPARATE realistic photos (not a collage). Style for all: realistic photograph, natural light, simple and uncluttered, no text, no logos or brand names, people only from behind or far away (no recognisable faces) unless the item says otherwise, landscape 4:3, the photo must fill the whole frame (no borders, no blurred or empty bands at the top or bottom). Name each file EXACTLY as written before the colon, and give me all of them in one ZIP.";
  return `<p class="sub">${done} of ${L.length} photos added. Copy one batch at a time into ChatGPT, then send me the ZIP.</p>

  tm.textContent=fmt(Math.max(T.left,0));tm.classList.toggle("low",T.left<=10);$("#br").style.width=(Math.max(T.left,0)/T.total*100)+"%";

const STGame={g:byId("small-talk-grid"),level:"B1",mode:"class",pairs:[],turn:0,cells:[],time:60,

  if(ok){c.owner=this.turn;p.pts++;}else{c.used=true;}
  this.shell(`<span class="label">${ok?"Survived!":"Silence…"}</span>
    <h2>${ok?`${esc(p.name)} win “${esc(c.t)}”`:`${esc(p.name)} lose “${esc(c.t)}”`}</h2>
    <div class="row"><button class="primary" id="nx">Next pair</button>${ok?`<button class="ghost" id="undo">Actually, there was a silence</button>`:""}</div>`);
  $("#nx").onclick=()=>{this.turn=(this.turn+1)%this.pairs.length;this.grid();};
  if(ok)$("#undo").onclick=()=>{c.owner=null;c.used=true;p.pts--;this.turn=(this.turn+1)%this.pairs.length;this.grid();};},
 renderScores(){const s=this.pairs.map((p,i)=>({...p,i})).sort((a,b)=>b.pts-a.pts),top=s[0].pts;
  $("#scoreList").innerHTML=s.map(p=>`<li class="${p.pts===top&&p.pts>0?"lead":""}"><span class="turn p${p.i}"><span class="dot"></span>${esc(p.name)}</span><span class="pts">${p.pts}</span></li>`).join("");},
 over(){if(this.mode!=="race")return;const s=[...this.pairs].sort((a,b)=>b.pts-a.pts),top=s[0].pts,w=s.filter(p=>p.pts===top).map(p=>p.name);
  $("#screen").insertAdjacentHTML("beforeend",`<div class="reveal"><span class="label">Grid complete</span><h2>${w.length>1?"It's a tie":"Winners"}: ${w.map(esc).join(" & ")} (${top} squares)</h2></div>`);}
};

/* migrate old saved names: nothing to do, classes keep same keys */
route();
</script>
